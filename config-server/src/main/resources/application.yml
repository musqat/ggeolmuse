server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/musqat/ggeolmuse-config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:.}
          clone-on-start: true
          timeout: 10
        # 암호화 키 설정
        encrypt:
          enabled: ${CONFIG_ENCRYPT_ENABLED:false}
  
  # Config Server 보안 설정
  security:
    user:
      name: config
      password: config123

management:
  server:
    port: ${MANAGEMENT_PORT:9888}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,env,refresh,encrypt,decrypt}
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when_authorized}
    info:
      enabled: true
    env:
      enabled: ${MANAGEMENT_ENV_ENABLED:false}
    refresh:
      enabled: ${MANAGEMENT_REFRESH_ENABLED:true}
    encrypt:
      enabled: ${MANAGEMENT_ENCRYPT_ENABLED:false}
    decrypt:
      enabled: ${MANAGEMENT_DECRYPT_ENABLED:false}
  security:
    enabled: ${MANAGEMENT_SECURITY_ENABLED:true}

logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.config.server: DEBUG
    org.springframework.cloud.config.server.environment: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    com.muscat.configserver: INFO
