server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  
  cloud:
    config:
      server:
        bootstrap: true
        native:
          search-locations: classpath:/configs
        default-profile: dev
        # 암호화 키 설정 (운영환경에서는 환경변수로 관리)
        encrypt:
          enabled: ${CONFIG_ENCRYPT_ENABLED:false}
        # Git 저장소 설정 (미래 확장성)
        git:
          uri: ${CONFIG_GIT_URI:}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_PASSWORD:}
          skip-ssl-validation: ${CONFIG_GIT_SKIP_SSL:false}
  
  # 개발환경에서는 보안 비활성화
  security:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_PORT:9888}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,env,refresh,encrypt,decrypt}
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when_authorized}
    info:
      enabled: true
    env:
      enabled: ${MANAGEMENT_ENV_ENABLED:false}
    refresh:
      enabled: ${MANAGEMENT_REFRESH_ENABLED:true}
    encrypt:
      enabled: ${MANAGEMENT_ENCRYPT_ENABLED:false}
    decrypt:
      enabled: ${MANAGEMENT_DECRYPT_ENABLED:false}
  security:
    enabled: ${MANAGEMENT_SECURITY_ENABLED:true}

logging:
  level:
    org.springframework.cloud.config: INFO
    com.muscat.configserver: INFO