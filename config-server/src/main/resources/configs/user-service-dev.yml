spring:
  datasource:
    url: jdbc:h2:mem:userdb
    username: sa
    password:
  
  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# Keycloak User Service 전용 설정  
keycloak:
  resource: muscathan-user-cc
  credentials:
    secret: ${KEYCLOAK_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

# User Service 비즈니스 설정
app:
  mail:
    from: ${MAIL_FROM:noreply@ggeolmuse.com}
    verification:
      expiry-hours: ${EMAIL_EXPIRY_HOURS:24}
      base-url: ${APP_BASE_URL:http://localhost:3000}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  exchange-rate:
    min-valid-rate: ${EXCHANGE_RATE_MIN:500}
    max-valid-rate: ${EXCHANGE_RATE_MAX:2000}
    fallback-rate: ${EXCHANGE_RATE_FALLBACK:1350.00}