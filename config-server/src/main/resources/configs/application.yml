spring:
  # JPA 공통 설정 - 모든 서비스에서 사용하는 기본 JPA 설정
  jpa:
    open-in-view: false                      # OSIV(Open Session In View) 비활성화로 성능 최적화
    defer-datasource-initialization: true    # 데이터소스 초기화 지연으로 시작 시간 단축
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  
  # Redis 공통 설정 - 캐싱 및 세션 저장소로 사용 (연결 정보는 환경별 설정)
  data:
    redis:
      timeout: 2000ms                        # Redis 연결 타임아웃
      lettuce:                              # Lettuce 커넥션 풀 설정
        pool:
          max-active: 8                     # 최대 활성 연결
          max-idle: 8                       # 최대 유휴 연결
          min-idle: 0                       # 최소 유휴 연결
          max-wait: -1ms                    # 무제한 대기

# Actuator 공통 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,refresh
  endpoint:
    health:
      show-details: always

# Feign 공통 설정
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 15000

# Keycloak 공통 설정 (연결 URL은 환경별로 설정)
keycloak:
  realm: muscat

# 로깅 공통 설정
logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
    feign: WARN