# 모든 서비스 공통 설정
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

# Kafka 공통 설정
spring:
  # 데이터소스 공통 설정 (HikariCP)
  datasource:
    hikari:
      maximum-pool-size: 10          # 최대 커넥션 수
      minimum-idle: 5                # 최소 유휴 커넥션 (풀에 항상 유지)
      connection-timeout: 20000      # 커넥션 대기 시간 (20초)
      idle-timeout: 300000           # 유휴 커넥션 제거 시간 (5분)
      max-lifetime: 1200000          # 커넥션 최대 수명 (20분)
      leak-detection-threshold: 60000 # 커넥션 누수 감지 (60초)
      pool-name: ${spring.application.name:GGeolmuse}-HikariPool
      connection-test-query: SELECT 1  # H2/PostgreSQL 호환 쿼리
      auto-commit: true
      # 성능 최적화 설정
      register-mbeans: true          # JMX 모니터링 활성화

  # JPA 공통 설정
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마를 관리하므로 validate만 수행
    show-sql: false
    properties:
      hibernate:
        # 성능 최적화 설정
        jdbc:
          batch_size: 20  # 배치 insert/update 크기
          fetch_size: 50  # JDBC fetch 크기
        order_inserts: true
        order_updates: true
        # 2차 캐시
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # SQL 초기화 비활성화 (Flyway 사용)
  sql:
    init:
      mode: never

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${spring.application.name:ggeolmuse}-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.muscat.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        compression.type: gzip
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
    # Dead Letter Queue (DLQ) 설정
    listener:
      ack-mode: manual
      type: batch  # 배치 처리 모드
    # Retry 및 DLQ 토픽 설정
    retry:
      topic:
        enabled: true
        attempts: 3
        delay: 1000  # 1초
        multiplier: 2.0  # 지수 백오프
        max-delay: 10000  # 최대 10초

# SpringDoc OpenAPI 공통 설정
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false

# 로깅 설정 (모든 서비스 공통)
logging:
  level:
    root: INFO
    # Spring Framework
    org.springframework.security: INFO         # Security DEBUG 로그 제거 (health check 등)
    org.springframework.boot.actuate: WARN     # Actuator 로그 최소화
    org.springframework.cloud.gateway: INFO    # Gateway 기본 로그만
    # HTTP Client
    feign: DEBUG                               # Feign 클라이언트 디버깅
    reactor.netty: WARN                        # Netty 불필요한 로그 제거
    # Hibernate/JPA
    org.hibernate.SQL: WARN                    # SQL 로그 비활성화
    org.hibernate.type.descriptor.sql.BasicBinder: WARN  # 파라미터 바인딩 로그 비활성화
    org.hibernate.orm.jdbc.bind: WARN          # JDBC 바인딩 로그 비활성화
    # Kafka
    org.springframework.kafka: INFO            # Kafka 클라이언트 로그
    org.apache.kafka: WARN                     # Apache Kafka 내부 로그 최소화
    # 비즈니스 로직
    com.muscat: DEBUG                          # 코드는 상세 로그 유지
