server:
  port: 8083

spring:
  application:
    name: market-data-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}

keycloak:
  resource: muscat-user-cc

marketdata:
  constants:
    fx:
      default-base-rate: 1350
      scale: 6
      max-fallback-days: 7
    batch:
      min-rpm: 1
      max-backoff-ms: 30000
      millis-per-minute: 60000
    database:
      symbol-max-length: 16
      currency-length: 3
      decimal-precision: 19
      decimal-scale: 8
    calculation:
      percent-scale: 4
      percentage-multiplier: 100
    fx-ingest:
      backfill:
        enabled: true
        lookback-days: 365
      incremental:
        enabled: true
        default-days: 7
      scheduler:
        enabled: false
        cron: "0 10 11 * * MON-FRI"
        zone: "Asia/Seoul"
  data-collection:
    backfill:
      lookback-days: 365
    incremental:
      default-days: 7
    scheduler:
      timezone: "America/New_York"
  feed:
    symbol:
      enabled: true
      startup-delay: 30
    schedule:
      enabled: false
      cron: "0 0 5 * * *"
  cache:
    price-data-ttl: 300
    fx-rate-ttl: 3600
    symbol-info-ttl: 86400
    dividend-ttl: 86400

alphavantage:
  enabled: true
  rate-limit-per-second: 5
  timeout-seconds: 15
  base-url: "https://www.alphavantage.co/query"
  retry:
    max-attempts: 3
    backoff-delay: 1000

yahoo:
  finance:
    enabled: true
    base-url: "https://query1.finance.yahoo.com"
    timeout-seconds: 10
    rate-limit-per-second: 10
    retry:
      max-attempts: 3
      backoff-delay: 500

korea-exim:
  api:
    url: "https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON"
    enabled: true
    timeout-seconds: 10

management:
  health:
    redis:
      enabled: false
