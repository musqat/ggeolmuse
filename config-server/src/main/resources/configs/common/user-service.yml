server:
  port: 8080

spring:
  application:
    name: user-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:7001}
  realm: ${KEYCLOAK_REALM:muscathan}
  resource: ggeolmuse-client
  credentials:
    secret: ${KEYCLOAK_SECRET:dev-secret}
  public-url: ${KEYCLOAK_PUBLIC_URL:http://auth.localhost}

app:
  mail:
    from: ${MAIL_FROM:noreply@ggeolmuse.com}
    verification:
      expiry-hours: ${EMAIL_EXPIRY_HOURS:24}
      base-url: ${APP_BASE_URL:http://app.localhost}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  market-data:
    url: ${MARKET_DATA_SERVICE_URL:http://market-data-service:8083}
  exchange-rate:
    min-valid-rate: ${EXCHANGE_RATE_MIN:500}
    max-valid-rate: ${EXCHANGE_RATE_MAX:2000}
    fallback-rate: ${EXCHANGE_RATE_FALLBACK:1350.00}

management:
  health:
    redis:
      enabled: false

# Feign Client 설정
feign:
  client:
    config:
      default:
        connectTimeout: 500        # 연결 타임아웃: 500ms
        readTimeout: 1000          # 읽기 타임아웃: 1s

logging:
  level:
    com.muscat.user: INFO
