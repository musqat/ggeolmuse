spring:
  datasource:
    url: jdbc:h2:mem:marketdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

# Keycloak Market Data Service 전용 설정  
keycloak:
  resource: muscathan-market-data-cc
  credentials:
    secret: ${KEYCLOAK_SECRET}

# Market Data 환율 수집 설정 (개발환경 비활성화)
marketdata:
  fx:
    ingest:
      backfill:
        enabled: false
      incremental:
        enabled: false
      scheduler:
        enabled: false