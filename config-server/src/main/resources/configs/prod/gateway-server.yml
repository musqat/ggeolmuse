spring:
  main:
    web-application-type: reactive

  data:
    redis:
      host: redis.default.svc.cluster.local
      port: 6379

  cloud:
    gateway:

services:
  market-data:
    uri: http://market-data-service.default.svc.cluster.local:8083
  user:
    uri: http://user-service.default.svc.cluster.local:8080
  trade:
    uri: http://trade-service.default.svc.cluster.local:8081
  backtest:
    uri: http://backtest-service.default.svc.cluster.local:8082

gateway:
  cors:
    allowed-origins: "http://app.localhost"
