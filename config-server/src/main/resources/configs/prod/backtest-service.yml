spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backtestdb}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  market-data:
    url: http://market-data-service.default.svc.cluster.local:8083
  trade-service:
    url: http://trade-service.default.svc.cluster.local:8081
  user-service:
    url: http://user-service.default.svc.cluster.local:8080
