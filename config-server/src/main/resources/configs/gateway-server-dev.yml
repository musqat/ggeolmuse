spring:
  main:
    web-application-type: reactive

  # 자동설정 제외
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

  cloud:
    gateway:
      # CORS 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # 유저 서비스 (8080)
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**, /api/auth/**, /api/accounts/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Gateway-Request
                value: user-service

        # 거래 서비스 (8081)
        - id: trade-service
          uri: http://trade-service:8081
          predicates:
            - Path=/api/trade/**, /api/trading/**, /api/portfolio/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Gateway-Request
                value: trade-service

        # 시장데이터 서비스 (8083)
        - id: market-data-service
          uri: http://market-data-service:8083
          predicates:
            - Path=/api/market/**, /api/data/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Gateway-Request
                value: market-data-service

        # 백테스트 서비스 (8082)
        - id: backtest-service
          uri: http://backtest-service:8082
          predicates:
            - Path=/api/backtest/**, /api/analysis/**, /api/simulation/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Gateway-Request
                value: backtest-service

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    com.muscat.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    gateway:
      enabled: true
    routes:
      enabled: true