spring:
  # H2 개발 데이터베이스 기본 설정
  datasource:
    driver-class-name: org.h2.Driver
    
  # JPA 개발 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    
  # H2 Console 활성화 (개발환경만)
  h2:
    console:
      enabled: true
      path: /h2-console
      
  # Redis 개발환경 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Keycloak 개발환경 공통 설정
keycloak:
  realm: muscat
  auth-server-url: http://localhost:7001
  resource: muscathan-user-cc

# 로깅 개발환경 설정
logging:
  level:
    com.muscat: DEBUG
    org.springframework.cloud.config: DEBUG