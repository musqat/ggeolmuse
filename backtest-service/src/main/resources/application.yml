spring:
  application:
    name: backtest-service

  # Config Server 연결
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"

  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${SPRING_CLOUD_CONFIG_USERNAME:config}
      password: ${SPRING_CLOUD_CONFIG_PASSWORD:config123}
      fail-fast: false
      retry:
        initial-interval: 3000
        max-attempts: 6
        max-interval: 4000
        multiplier: 1.1
    compatibility-verifier:
      enabled: false

# Redis config is provided by Config Server

# Security config is provided by Config Server

## Server port moved to Config Server

## Keycloak config moved to Config Server

logging:
  level:
    com.muscat.backtest.infra.client: DEBUG
    feign: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,mappings
  endpoint:
    mappings:
      enabled: true

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
