# =============================================================================
# Trade Service 설정 (H2 사용, 민감정보는 환경변수로 관리)
# =============================================================================

spring:
  application:
    name: trade-service
  config:
    import: configserver:
  profiles:
    include: config

# Keycloak 민감정보
keycloak:
  credentials:
    secret: ${KEYCLOAK_SECRET:}

# Trade Service 고유 비즈니스 설정
trade:
  # Trading Fees 설정
  fee:
    default-rate: ${TRADE_FEE_RATE:0.0025}        # 기본 수수료율 (0.25%)
    minimum-amount: ${TRADE_FEE_MIN:1.00}         # 최소 수수료 금액 (USD)
    maximum-rate: ${TRADE_FEE_MAX:0.01}           # 최대 수수료율 (1%)
  
  # Calculation Precision
  calculation:
    price-precision: ${PRICE_PRECISION:2}          # 가격 소수점 자릿수
    quantity-precision: ${QUANTITY_PRECISION:6}    # 수량 소수점 자릿수
    currency-precision: ${CURRENCY_PRECISION:2}    # 통화 소수점 자릿수
  
  # Trading Validation 설정
  validation:
    max-price-deviation: ${MAX_PRICE_DEVIATION:0.20}   # 최대 가격 편차 (20%)
    min-trade-amount: ${MIN_TRADE_AMOUNT:1.00}          # 최소 거래 금액 (USD)
    max-trade-amount: ${MAX_TRADE_AMOUNT:1000000.00}    # 최대 거래 금액 (USD)
    max-daily-trades: ${MAX_DAILY_TRADES:1000}          # 일일 최대 거래 횟수
  
  # Cache 설정
  cache:
    market-data-ttl: ${CACHE_MARKET_DATA_TTL:300}       # 마켓 데이터 캐시 TTL (초)
    portfolio-ttl: ${CACHE_PORTFOLIO_TTL:600}           # 포트폴리오 캐시 TTL (초)
    balance-ttl: ${CACHE_BALANCE_TTL:300}               # 잔액 캐시 TTL (초)
  
  # FIFO Calculation 설정
  fifo:
    enabled: ${FIFO_ENABLED:true}                       # FIFO 계산 활성화
    precision: ${FIFO_PRECISION:8}                      # FIFO 계산 정밀도