spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:tradedb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:7001}/realms/${KEYCLOAK_REALM:muscat}

keycloak:
  realm: ${KEYCLOAK_REALM:muscat}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:7001}
  resource: ${KEYCLOAK_CLIENT_ID:muscathan-trade-cc}
  credentials:
    secret: ${KEYCLOAK_SECRET:your-secret}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8080}

market-service:
  url: ${MARKET_SERVICE_URL:http://localhost:8082}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
      user-service:
        connect-timeout: 5000
        read-timeout: 10000
      market-service:
        connect-timeout: 5000
        read-timeout: 15000

logging:
  level:
    com.muscat.trade: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  port: 8081