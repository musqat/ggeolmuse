plugins {
	id 'java'
	id 'org.springframework.boot'
}

dependencies {
	implementation(enforcedPlatform(project(':bom')))
	annotationProcessor(enforcedPlatform(project(':bom')))
	testAnnotationProcessor(enforcedPlatform(project(':bom')))
	
	implementation project(':common-lib')
	
	// Spring Cloud Config
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'io.jsonwebtoken:jjwt-api'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson'

	// QueryDSL 의존성 - 수동 Q클래스 생성 방식 사용
	// (annotation processor 방식 대신 수동으로 Q클래스를 작성하여 성능과 안정성 확보)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	
	// 자동 생성 방식 (현재 비활성화)
	// annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	// annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	// annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	runtimeOnly 'com.h2database:h2'
//    runtimeOnly 'org.postgresql:postgresql'
//    testImplementation 'org.testcontainers:postgresql'

//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.register("prepareKotlinBuildScriptModel") {}
