server:
  port: 8082
  servlet:
    context-path: /api/backtest

spring:
  application:
    name: backtest-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:7001}/realms/${KEYCLOAK_REALM:muscat}

app:
  market-data:
    url: http://localhost:8083
  trade-service:
    url: http://localhost:8081

logging:
  level:
    com.muscat.backtest: DEBUG
    feign: DEBUG