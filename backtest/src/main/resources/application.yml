# =============================================================================
# Backtest Service 설정 (H2 사용, 민감정보는 환경변수로 관리)
# =============================================================================

spring:
  application:
    name: backtest-service
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    include: config

# Keycloak 민감정보
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:7001}
  realm: ${KEYCLOAK_REALM:muscathan}
  credentials:
    secret: ${KEYCLOAK_SECRET:}

# Backtest Service 고유 비즈니스 설정
backtest:
  # Calculation Settings
  calculation:
    precision: ${CALCULATION_PRECISION:8}               # 계산 정밀도
    scale: ${CALCULATION_SCALE:4}                       # 결과 표시 소수점
    max-years: ${MAX_BACKTEST_YEARS:10}                 # 최대 백테스트 기간(년)
    min-days: ${MIN_BACKTEST_DAYS:30}                   # 최소 백테스트 기간(일)
  
  # Performance Settings
  concurrent:
    max-threads: ${MAX_CONCURRENT_THREADS:4}            # 최대 동시 실행 스레드
    queue-capacity: ${THREAD_QUEUE_CAPACITY:100}        # 스레드 대기열 크기
    timeout-minutes: ${BACKTEST_TIMEOUT:10}             # 백테스트 타임아웃(분)
  
  # Rate Limiting
  rate-limit:
    max-requests-per-minute: ${RATE_LIMIT_RPM:60}       # 분당 최대 요청
    max-concurrent-backtests: ${MAX_CONCURRENT:5}       # 동시 백테스트 최대
    daily-limit-per-user: ${DAILY_LIMIT:100}           # 사용자별 일일 한도
  
  # Strategy Configuration
  strategy:
    dca:
      min-monthly-amount: ${DCA_MIN_AMOUNT:100.00}      # 정액적립 최소 금액
      max-monthly-amount: ${DCA_MAX_AMOUNT:10000.00}    # 정액적립 최대 금액
    conditional:
      min-drop-percentage: ${CONDITIONAL_MIN_DROP:5}    # 최소 하락률(%)
      max-drop-percentage: ${CONDITIONAL_MAX_DROP:50}   # 최대 하락률(%)
      min-total-investment: ${CONDITIONAL_MIN_TOTAL:1000.00}  # 최소 총투자금액
  
  # Comparison Settings
  comparison:
    max-symbols: ${MAX_COMPARISON_SYMBOLS:10}           # 종목 비교 최대 개수
    max-strategies: ${MAX_COMPARISON_STRATEGIES:5}      # 전략 비교 최대 개수
    max-timings: ${MAX_COMPARISON_TIMINGS:10}           # 시점 비교 최대 개수
  
  # Data Validation
  validation:
    min-investment-amount: ${MIN_INVESTMENT:100.00}     # 최소 투자 금액
    max-investment-amount: ${MAX_INVESTMENT:10000000.00} # 최대 투자 금액
    max-trading-fee: ${MAX_TRADING_FEE:0.05}            # 최대 거래 수수료(5%)
    required-data-points: ${REQUIRED_DATA_POINTS:30}    # 필요한 최소 데이터 포인트
  
  # Cache Configuration
  cache:
    result-ttl-hours: ${CACHE_RESULT_TTL:24}            # 결과 캐시 TTL(시간)
    history-ttl-hours: ${CACHE_HISTORY_TTL:168}         # 이력 캐시 TTL(시간, 7일)
    max-cache-size: ${CACHE_MAX_SIZE:1000}              # 최대 캐시 크기
  
  # Result Storage
  storage:
    auto-save-enabled: ${AUTO_SAVE_ENABLED:true}        # 자동 저장 활성화
    max-results-per-user: ${MAX_RESULTS_PER_USER:1000}  # 사용자별 최대 결과 저장
    cleanup-days: ${CLEANUP_DAYS:90}                    # 결과 정리 주기(일)