spring:
  application:
    name: market-data-service

  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true

  # KafkaProducerConfig 가 이 값을 @Value 로 직접 읽는다.
  # 프로듀서는 지연 연결이라 컨텍스트 로딩엔 더미 주소로 충분하다.
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 0

# Keycloak 테스트 설정
keycloak:
  auth-server-url: http://localhost:8080
  realm: test-realm

# Market Data 테스트 설정
marketdata:
  # FxRateService 구현체가 @ConditionalOnProperty(marketdata.provider) 라
  # 값이 없으면 빈이 하나도 뜨지 않고 컨텍스트 로딩이 실패한다.
  provider: yahoo
  constants:
    fx-ingest:
      backfill:
        enabled: false
        lookback-days: 365
      incremental:
        enabled: false
        default-days: 30
      scheduler:
        enabled: false
        cron: "0 10 11 * * MON-FRI"
        zone: "Asia/Seoul"
  fx:
    koreaexim:
      url: http://localhost:8080/test
      authkey: test-key
  feed:
    enabled: false

# Alpha Vantage 테스트 설정
alphavantage:
  api-key: test-key
  enabled: false

# Feed 설정 (테스트용)
feed:
  rpm: 5
  retry:
    max: 3
    backoffMs: 2000

logging:
  level:
    com.muscat.marketdata: DEBUG
