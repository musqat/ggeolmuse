spring:
  application:
    name: market-data-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 0

# 테스트용 외부 API 키
app:
  alpha-vantage:
    api-key: test-key
    enabled: false

  yahoo-finance:
    enabled: false

logging:
  level:
    com.muscat.marketdata: DEBUG