    .pp { stroke: #0F6E56; }
    .ng { fill: #2C2C2A; stroke: #5F5E5A; }
    .np { fill: #04342C; stroke: #1D9E75; }
    .tg { fill: #F1EFE8; }
    .tp { fill: #E1F5EE; }
    .sp { fill: #9FE1CB; }
  }
