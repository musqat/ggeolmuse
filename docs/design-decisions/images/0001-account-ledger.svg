<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img">
  <title>계좌 잔액과 체결 — 일반적인 방식과 이 프로젝트</title>
  <style>
  .lbl { font: 500 13px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #5F5E5A; }
  .pg { fill: none; stroke: #D3D1C7; stroke-width: 1; stroke-dasharray: 4 4; }
  .pp { fill: none; stroke: #9FE1CB; stroke-width: 1; stroke-dasharray: 4 4; }
  .ng { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 1; }
  .np { fill: #E1F5EE; stroke: #5DCAA5; stroke-width: 1; }
  .tg { font: 500 14px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #2C2C2A; }
  .sg { font: 400 12px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #5F5E5A; }
  .tp { font: 500 14px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #085041; }
  .sp { font: 400 12px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #0F6E56; }
  .ar { stroke: #888780; stroke-width: 1.2; fill: none; }
  .al { font: 400 12px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #5F5E5A; }
  .note { font: 400 12px -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #5F5E5A; }
  .ah { fill: #888780; }
  @media (prefers-color-scheme: dark) {
    .lbl, .sg, .al, .note { fill: #B4B2A9; }
    .pg { stroke: #5F5E5A; }
    .pp { stroke: #0F6E56; }
    .ng { fill: #2C2C2A; stroke: #5F5E5A; }
    .np { fill: #04342C; stroke: #1D9E75; }
    .tg { fill: #F1EFE8; }
    .tp { fill: #E1F5EE; }
    .sp { fill: #9FE1CB; }
  }
  </style>
  <rect class="pg" x="20" y="12" width="840" height="126" rx="12"/>
  <text class="lbl" x="32" y="30">일반적인 방식</text>
  <rect class="ng" x="314.1" y="44" width="251.8" height="58" rx="8"/>
  <text class="tg" x="440.0" y="66" text-anchor="middle">주문 서비스</text>
  <text class="sg" x="440.0" y="86" text-anchor="middle">잔액 확인 · 차감 · 체결 저장 · 보유 반영</text>
  <text class="note" x="440.0" y="124" text-anchor="middle">한 서비스 · 한 DB · 한 트랜잭션</text>
  <rect class="pp" x="20" y="154" width="840" height="126" rx="12"/>
  <text class="lbl" x="32" y="172">이 프로젝트</text>
  <rect class="np" x="78.8" y="186" width="177.9" height="58" rx="8"/>
  <text class="tp" x="167.8" y="208" text-anchor="middle">trade</text>
  <text class="sp" x="167.8" y="228" text-anchor="middle">잔액 조회 · 체결 대기 저장</text>
  <rect class="np" x="345.0" y="186" width="181.3" height="58" rx="8"/>
  <text class="tp" x="435.7" y="208" text-anchor="middle">user</text>
  <text class="sp" x="435.7" y="228" text-anchor="middle">정산 테이블로 한 번만 반영</text>
  <rect class="np" x="651.6" y="186" width="149.6" height="58" rx="8"/>
  <text class="tp" x="726.4" y="208" text-anchor="middle">trade</text>
  <text class="sp" x="726.4" y="228" text-anchor="middle">대기 매수 완료 · 취소</text>
  <line class="ar" x1="260.7" y1="215.0" x2="337.0" y2="215.0"/>
  <path class="ah" d="M343.0 215.0 L336.0 211.0 L336.0 219.0 Z"/>
  <text class="al" x="298.9" y="207.0" text-anchor="middle">체결 이벤트</text>
  <line class="ar" x1="530.3" y1="215.0" x2="643.6" y2="215.0"/>
  <path class="ah" d="M649.6 215.0 L642.6 211.0 L642.6 219.0 Z"/>
  <text class="al" x="587.0" y="207.0" text-anchor="middle">정산 · 거절 이벤트</text>
  <text class="note" x="440.0" y="266" text-anchor="middle">두 서비스 · 두 DB, 이벤트로 이어지는 사가</text>
</svg>
