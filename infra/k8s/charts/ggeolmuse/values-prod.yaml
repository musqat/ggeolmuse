# 운영 값(kubeadm 멀티 노드 클러스터, 나머지는 values.yaml 에서 deep merge)
# CPU 요청은 쉴 때 사용량(파드당 10 ~ 40m)에 여유를 둔 값, 기동 때 몰리는 CPU 는 한도까지 씀(워커 하나가 멈추면 Kafka 같은 하나짜리가 옮겨 갈 자리)
global:
  domain: ggeolmuse.com
  authDomain: ggeolmuse.com
  springProfiles: prod

  keycloak:
    authServerUrl: http://keycloak:8080/auth
    publicUrl: https://ggeolmuse.com/auth

  # OpenTelemetry - Tempo in monitoring namespace
  otel:
    endpoint: http://tempo.monitoring.svc.cluster.local:4318
    environment: prod
    # 요청 4건 중 1건의 트레이스
    sampler: parentbased_traceidratio
    samplerArg: "0.25"

  # AWS Secrets Manager
  aws:
    secretsManager:
      enabled: true

  podDisruptionBudget:
    enabled: true
  # 레플리카 둘은 반드시 다른 워커에, 멈춘 워커에 있던 레플리카는 그 워커가 돌아올 때까지 대기
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule
    minDomains: 2
  # 워커가 멈추면 1분 뒤 그 워커의 파드를 내림(하나짜리는 남은 워커로, 기본 5분)
  nodeLostTolerationSeconds: 60
  preStopSleepSeconds: 5

infrastructure:
  redis:
    resources:
      # maxmemory 256mb 위로 메모리 조각 · AOF 다시 쓰기 몫
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 64Mi
        cpu: 50m

  # 워커마다 한 대, jdbc-ping 캐시 클러스터(keycloak 26 기본)
  keycloak:
    replicas: 2
    env:
      kcDbVendor: postgres  # RDS PostgreSQL 사용
      kcDbUrl: jdbc:postgresql://ggeolmuse-postgres.cxa6ioco4fhg.ap-northeast-2.rds.amazonaws.com:5432/keycloak
      kcHttpRelativePath: /auth
      kcProxyTrustedAddresses: 10.42.0.0/16  # 파드 대역
    resources:
      limits:
        memory: 1024Mi
        cpu: 500m
      requests:
        memory: 704Mi
        cpu: 50m

  # PostgreSQL - AWS RDS 사용
  postgres:
    enabled: false

  zookeeper:
    storage:
      data: 5Gi
      log: 5Gi
      storageClassName: gp3
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 50m

  kafka:
    env:
      logRetentionHours: 120
      logSegmentBytes: "536870912"
      # EBS(ext4) 볼륨 맨 위 lost+found 를 파티션으로 읽지 않는 볼륨 안 하위 폴더
      logDirs: /var/lib/kafka/data/logs
    storage:
      data: 10Gi
      storageClassName: gp3
    resources:
      limits:
        memory: 1Gi
        cpu: 750m
      requests:
        memory: 704Mi
        cpu: 100m

  kafkaUi:
    env:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    resources:
      limits:
        memory: 384Mi
        cpu: 200m
      requests:
        memory: 256Mi
        cpu: 50m

  tempo:
    enabled: false  # Tempo는 monitoring 네임스페이스에서 별도 실행
    resources:
      limits:
        cpu: 500m
      requests:
        cpu: 250m

# 상태 없는 앱은 워커마다 하나씩(레플리카 둘), 자바 앱 기동 검사는 노드 셋 동시 기동에 맞춘 10분
# Config Server
configServer:
  replicaCount: 2
  image:
    tag: "2.0.0"
  env:
    springProfiles: git,prod
  # 읽을 설정 리포 브랜치 · 커밋(릴리스 봇이 그때 main 끝 커밋으로 바꿈)
  gitLabel: 54799cdd393501c7bafab8fe1da94464e7f3dae9
  probes:
    startup:
      failureThreshold: 60
  resources:
    limits:
      memory: 512Mi
      cpu: 1000m
    requests:
      memory: 384Mi
      cpu: 50m

# Gateway Server
gatewayServer:
  replicaCount: 2
  image:
    tag: "2.0.0"
  env:
    springProfiles: prod
  probes:
    startup:
      failureThreshold: 60
    readiness:
      initialDelaySeconds: 120  # 2분 (Keycloak JWK + Redis)
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 300  # 5분
      periodSeconds: 20
  resources:
    limits:
      memory: 768Mi
      cpu: 1000m
    requests:
      memory: 384Mi
      cpu: 50m

# 비즈니스 서비스
services:
  userService:
    replicaCount: 2
    image:
      tag: "2.0.3"
    env:
      # market-data 와 같은 한국 시각(저장 시각 · 오늘 날짜 기준, 옛 UTC 시각은 Flyway V6 이 옮김)
      TZ: "Asia/Seoul"
      APP_BASE_URL: https://ggeolmuse.com
      APP_FRONTEND_URL: https://ggeolmuse.com
      APP_MAIL_VERIFICATION_BASE_URL: https://ggeolmuse.com
    probes:
      startup:
        failureThreshold: 60
      readiness:
        initialDelaySeconds: 180
      liveness:
        initialDelaySeconds: 600
    resources:
      limits:
        memory: 1024Mi
        cpu: 600m
      requests:
        memory: 640Mi
        cpu: 50m

  tradeService:
    replicaCount: 2
    image:
      tag: "2.0.3"
    env:
      TZ: "Asia/Seoul"
    probes:
      startup:
        failureThreshold: 60
      readiness:
        initialDelaySeconds: 180
      liveness:
        initialDelaySeconds: 600
    resources:
      limits:
        memory: 1024Mi
        cpu: 600m
      requests:
        memory: 640Mi
        cpu: 50m

  marketDataService:
    replicaCount: 2
    image:
      tag: "2.0.3"
    env:
      TZ: "Asia/Seoul"
      # 마켓 데이터 설정
      MARKETDATA_PROVIDER: "yahoo"
      SYMBOL_COLLECTION_ENABLED: "true"
      SYMBOL_COLLECT_DATA: "false"
      # 심볼 수집 최대 개수 (0 = 무제한, 기본값 100)
      SYMBOL_LISTING_MAX: "0"
    probes:
      startup:
        failureThreshold: 60
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 600
        periodSeconds: 20
    resources:
      limits:
        memory: 1536Mi
        cpu: 1000m
      requests:
        memory: 768Mi
        cpu: 50m

  backtestService:
    replicaCount: 2
    image:
      tag: "2.0.3"
    env:
      TZ: "Asia/Seoul"
    probes:
      startup:
        failureThreshold: 60
      readiness:
        initialDelaySeconds: 180
      liveness:
        initialDelaySeconds: 600
    # 무거운 백테스트 10건 동시 실행 몫(힙 768m 위로 메타스페이스 · 코드 캐시 · 스레드 약 300Mi)
    resources:
      limits:
        memory: 1536Mi
        cpu: 1000m
      requests:
        memory: 768Mi
        cpu: 50m

  chatService:
    replicaCount: 2
    image:
      tag: "1.14.0"
    metrics:
      enabled: true
    probes:
      readiness:
        initialDelaySeconds: 15
      liveness:
        initialDelaySeconds: 30
    resources:
      limits:
        memory: 512Mi
        cpu: 400m
      requests:
        memory: 128Mi
        cpu: 50m

# 프론트엔드
frontend:
  replicaCount: 2
  image:
    tag: "1.14.0"
  env:
    apiUrl: https://ggeolmuse.com/api
    keycloakUrl: https://ggeolmuse.com/auth
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 32Mi
      cpu: 50m

# 네트워크 정책
networkPolicy:
  # 외부 요청은 envoy-gateway-system 의 Envoy 프록시가 넘김
  ingressNamespace: envoy-gateway-system
  policyTypes:
    - Ingress
  ports:
    - 8000
    - 8080
    - 8081
    - 8082
    - 8083

# 외부 진입은 Cloudflare Tunnel(cloudflared 가 아래 hosts · subdomains 규칙으로 서비스에 바로). kind 는 같은 규칙을 Gateway API 로
cloudflared:
  enabled: true
  tunnelId: fd0c287c-c332-4d29-b56c-503aaba1122a

ingress:
  kind: Gateway
  className: envoy
  gateway:
    replicas: 2
  hosts:
    - paths:
        - path: /api
          backend:
            service: gateway-server
            port: 8070
        - path: /auth
          backend:
            service: keycloak
            port: 8080
        - path: /kafka-ui
          backend:
            service: kafka-ui
            port: 8090
        - path: /
          backend:
            service: frontend-web
            port: 3000
  subdomains:
    - name: argocd
      namespace: argocd
      service: argocd-server
      port: 80
    - name: grafana
      namespace: monitoring
      service: prometheus-grafana
      port: 80

# Secret 설정
secrets:
  data: {}

# DB 백업
dbBackup:
  enabled: true

# 평일 아침 기동 확인(슬랙)
morningCheck:
  enabled: true

# Monitoring - Prometheus ServiceMonitor
monitoring:
  dashboards:
    enabled: true
  slack:
    # 웹훅 URL 은 ggeolmuse-secrets 의 SLACK_WEBHOOK_URL
    enabled: true
