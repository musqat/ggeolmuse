# 멀티 노드 kubeadm 덧붙임(values-prod.yaml 다음)
global:
  podDisruptionBudget:
    enabled: true
  # 레플리카 둘은 반드시 다른 워커에, 멈춘 워커는 셈에서 빼 남은 워커에 몰아 띄움
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
  # 워커가 멈추면 1분 뒤 다른 워커로(기본 5분)
  nodeLostTolerationSeconds: 60
  preStopSleepSeconds: 5

# CPU 요청은 쉴 때 사용량(파드당 10 ~ 40m)에 여유를 둔 값, 기동 때 몰리는 CPU 는 한도까지 씀(워커 하나가 멈추면 Kafka 같은 하나짜리가 옮겨 갈 자리)
infrastructure:
  # jdbc-ping 캐시 클러스터(keycloak 26 기본)
  keycloak:
    replicas: 2
    resources:
      requests:
        cpu: 50m
  zookeeper:
    storage:
      storageClassName: gp3
  kafka:
    resources:
      requests:
        cpu: 100m
    storage:
      storageClassName: gp3
    # EBS(ext4) 볼륨 맨 위 lost+found 를 파티션으로 읽지 않는 볼륨 안 하위 폴더
    env:
      logDirs: /var/lib/kafka/data/logs

# 외부 요청은 envoy-gateway-system 의 Envoy 프록시가 넘김
networkPolicy:
  ingressNamespace: envoy-gateway-system

# 상태 없는 앱은 워커마다 하나씩, 자바 앱 기동 검사는 노드 셋 동시 기동에 맞춘 10분
configServer:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
  probes:
    startup:
      failureThreshold: 60

gatewayServer:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
  probes:
    startup:
      failureThreshold: 60

services:
  userService:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
    probes:
      startup:
        failureThreshold: 60
  tradeService:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
    probes:
      startup:
        failureThreshold: 60
  marketDataService:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
    probes:
      startup:
        failureThreshold: 60
  backtestService:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
    probes:
      startup:
        failureThreshold: 60
  chatService:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m

frontend:
  replicaCount: 2

# 외부 진입은 Cloudflare Tunnel(cloudflared 가 아래 hosts · subdomains 규칙으로 서비스에 바로). kind 는 같은 규칙을 Gateway API 로
cloudflared:
  enabled: true
  tunnelId: fd0c287c-c332-4d29-b56c-503aaba1122a

ingress:
  kind: Gateway
  className: envoy
  gateway:
    replicas: 2
  hosts:
    - paths:
        - path: /api
          backend:
            service: gateway-server
            port: 8070
        - path: /auth
          backend:
            service: keycloak
            port: 8080
        - path: /kafka-ui
          backend:
            service: kafka-ui
            port: 8090
        - path: /
          backend:
            service: frontend-web
            port: 3000
  subdomains:
    - name: argocd
      namespace: argocd
      service: argocd-server
      port: 80
    - name: grafana
      namespace: monitoring
      service: prometheus-grafana
      port: 80
