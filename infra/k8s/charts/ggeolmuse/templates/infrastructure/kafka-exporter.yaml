{{- with .Values.infrastructure.kafkaExporter }}
{{- if and .enabled $.Values.infrastructure.kafka.enabled }}
---
# Kafka 지표 내보내기(브로커 수 · 토픽 오프셋 · 소비자 그룹 지연)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels:
    app: kafka-exporter
    {{- include "ggeolmuse.labels" $ | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ $.Values.global.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      securityContext:
        {{- include "ggeolmuse.podSecurityContext" $ | nindent 8 }}
      # 첫 연결에 실패하면 종료되는 exporter 를 Kafka 가 연결을 받을 때까지 대기
      initContainers:
      - name: wait-for-kafka
        image: {{ $.Values.global.initContainer.image }}
        command:
        - sh
        - -c
        - |
          addr={{ $.Values.global.kafka.bootstrapServers }}
          until nc -z -w 3 "${addr%:*}" "${addr##*:}"; do
            echo "Kafka is not ready yet. Retrying in 5 seconds..."
            sleep 5
          done
        securityContext:
          {{- include "ggeolmuse.securityContext" $ | nindent 10 }}
        resources:
          {{- toYaml $.Values.global.initContainer.resources | nindent 10 }}
      containers:
      - name: kafka-exporter
        image: {{ .image }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        args:
        - --kafka.server={{ $.Values.global.kafka.bootstrapServers }}
        - --kafka.version={{ .kafkaVersion }}
        ports:
        - containerPort: {{ .port }}
          name: metrics
        resources:
          {{- toYaml .resources | nindent 10 }}
        securityContext:
          {{- include "ggeolmuse.securityContext" $ | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  labels:
    app: kafka-exporter
    {{- include "ggeolmuse.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: {{ .port }}
    targetPort: metrics
    protocol: TCP
  selector:
    app: kafka-exporter
{{- end }}
{{- end }}
