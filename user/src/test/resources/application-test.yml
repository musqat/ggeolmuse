# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 587
    username: test@test.com
    password: test

app:
  market-data:
    url: http://localhost:8999
  exchange-rate:
    min-valid-rate: 0
    max-valid-rate: 3000
    fallback-rate: 1300.00
  mail:
    from: test@test.com
    verification:
      expiry-hours: 24
      base-url: http://localhost:8080
  oauth:
    redirect-uri: http://localhost:8080/callback
  frontend:
    url: http://localhost:3000

keycloak:
  realm: test-realm
  auth-server-url: http://localhost:7999
  resource: test-client
  credentials:
    secret: test-secret
  admin:
    username: test-admin
    password: test-password
