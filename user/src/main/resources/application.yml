spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:7001}/realms/${KEYCLOAK_REALM:muscat}/protocol/openid-connect/certs

app:
  mail:
    from: ${MAIL_FROM:noreply@muscat.com}
    verification:
      expiry-hours: 24
      base-url: ${APP_BASE_URL:http://localhost:8080}

keycloak:
  realm: ${KEYCLOAK_REALM:muscat}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:7001}
  resource: ${KEYCLOAK_CLIENT_ID:muscathan-user-cc}
  credentials:
    secret: ${KEYCLOAK_SECRET:your-secret}

logging:
  level:
    com.muscat.user: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG