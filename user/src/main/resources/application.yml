spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}

app:
  mail:
    from: ${MAIL_FROM}
    verification:
      expiry-hours: 24
      base-url: ${APP_BASE_URL}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI}
  market-data:
    url: ${MARKET_DATA_URL}
  exchange-rate:
    min-valid-rate: ${EXCHANGE_RATE_MIN:0}
    max-valid-rate: ${EXCHANGE_RATE_MAX:3000}
    fallback-rate: ${EXCHANGE_RATE_FALLBACK:1300.00}

keycloak:
  realm: ${KEYCLOAK_REALM}
  auth-server-url: ${KEYCLOAK_URL}
  resource: ${KEYCLOAK_CLIENT_ID}
  credentials:
    secret: ${KEYCLOAK_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}