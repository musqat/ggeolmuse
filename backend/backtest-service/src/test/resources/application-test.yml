spring:
  application:
    name: backtest-service

  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false

  # DB 는 테스트의 Postgres 컨테이너(운영처럼 Flyway 로 테이블을 만들고 엔티티 검사)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 0

# Keycloak 테스트 설정
keycloak:
  auth-server-url: http://localhost:8080
  realm: test-realm

# 테스트용 외부 서비스 URL
app:
  services:
    market-data-service: http://localhost:8083

logging:
  level:
    com.muscat.backtest: DEBUG