spring:
  application:
    name: gateway-server
  config:
    import:
      - "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    # 자동설정이 리전을 찾다 실패한다. prod 에서만 켠다
    aws:
      secretsmanager:
        enabled: false
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:config123}

server:
  port: 8070

---
# prod 프로파일에서만 AWS Secrets Manager (dev/로컬은 AWS 미사용)
spring:
  config:
    activate:
      on-profile: prod
    import:
      - "optional:aws-secretsmanager:ggeolmuse/production"
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ${AWS_REGION:ap-northeast-2}
