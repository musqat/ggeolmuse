spring:
  application:
    name: market-data-service
  task:
    scheduling:
      # 기본 1이면 수집 집계가 크론 작업 뒤로 밀림
      pool-size: 3
  flyway:
    # db/postgresql 은 H2 가 모르는 Postgres 전용 마이그레이션 자리
    locations: classpath:db/migration,classpath:db/{vendor}
  config:
    import:
      - "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD}

server:
  port: 8083

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      data-source-properties:
        # 끊긴 DB 연결 대기 상한 5분(초 단위)
        socketTimeout: 300
