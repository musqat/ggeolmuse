spring:
  application:
    name: market-data-service
  # null primitive 칸은 기본값 · 응답 칸은 선언 순서
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false
  task:
    scheduling:
      # 기본 1이면 수집 집계가 크론 작업 뒤로 밀림
      pool-size: 3
  flyway:
    # db/postgresql 은 H2 가 모르는 Postgres 전용 마이그레이션 자리
    locations: classpath:db/migration,classpath:db/{vendor}
  config:
    import:
      - "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD}
    openfeign:
      client:
        config:
          # 관리자 요청마다 묻는 관리자 역할(밀리초)
          user-service:
            connect-timeout: 1000
            read-timeout: 5000

server:
  port: 8083

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      data-source-properties:
        # 응답 없는 DB 연결 대기 상한 5분(초 단위)
        socketTimeout: 300
