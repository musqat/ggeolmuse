spring:
  application:
    name: user-service
  # null primitive 칸은 기본값 · 응답 칸은 선언 순서
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false
  config:
    import:
      - "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD}

server:
  port: 8080

logging:
  structured:
    json:
      # JSON 로그 문자열 값 속 이메일 가리기
      customizer: com.muscat.user.common.logging.MaskedEmailJsonCustomizer

# Keycloak 사용자 관리 클라이언트 이름 · secret
keycloak:
  admin-client:
    id: ggeolmuse-user-admin
    secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
