server:
  port: 8888

spring:
  application:
    name: config-server
  # config-server는 앱 시크릿(ggeolmuse/production)을 쓰지 않음 → AWS import 제거
  # (git config 서빙만 담당, 자체 크리덴셜은 env로 주입)
  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/musqat/ggeolmuse-config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:.}
          clone-on-start: true
          timeout: 10
        # 암호화 키 설정
        encrypt:
          enabled: ${CONFIG_ENCRYPT_ENABLED:false}
  
  # Config Server 보안 설정
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # 응답 시간 히스토그램 구간
    distribution:
      slo:
        http.server.requests: 100ms,300ms,1s,2s,5s

logging:
  structured:
    format:
      # 콘솔 로그를 JSON(ECS) 한 줄로
      console: ecs
