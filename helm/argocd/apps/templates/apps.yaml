{{- /* 부품마다 Application 하나(자동 동기화 없음, 차트는 버전 고정 · 값 파일은 리포에서) */ -}}
{{- /* 네임스페이스 메타데이터의 owner 는 같은 네임스페이스의 앱 하나 */ -}}
{{- range $ns, $m := .Values.namespaceMetadata }}
{{- $owner := get $.Values.apps (required (printf "namespaceMetadata.%s.owner" $ns) $m.owner) }}
{{- if not (and $owner (eq $owner.namespace $ns)) }}
{{- fail (printf "namespaceMetadata.%s.owner(%s) 가 %s 네임스페이스의 앱이 아님" $ns $m.owner $ns) }}
{{- end }}
{{- end }}
{{- range $name, $a := .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
spec:
  project: default
  {{- if $a.chart }}
  sources:
    - repoURL: {{ $a.repoURL }}
      chart: {{ $a.chart }}
      targetRevision: {{ required (printf "apps.%s.version" $name) $a.version | quote }}
      helm:
        releaseName: {{ $name }}
        {{- with $a.valueFiles }}
        valueFiles:
          {{- range . }}
          - $values/{{ . }}
          {{- end }}
        {{- end }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
  {{- else }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ required (printf "apps.%s.path" $name) $a.path }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $a.namespace }}
  syncPolicy:
    {{- with get $.Values.namespaceMetadata $a.namespace }}
    {{- if eq .owner $name }}
    managedNamespaceMetadata:
      labels:
        {{- toYaml .labels | nindent 8 }}
    {{- end }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      {{- if $a.serverSideApply }}
      - ServerSideApply=true
      {{- end }}
{{- end }}
