global:
  domain: ggeolmuse.com

# ArgoCD Server 설정
server:
  ingress:
    enabled: false

  # 커맨드 라인 플래그로 insecure 모드 명시적 설정
  extraArgs:
    - --insecure

  # 리소스 제한 (t3.medium 최적화)
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Controller 설정 (Git 저장소 감시)
controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Repo Server 설정 (Git 저장소 연결)
repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Redis 설정
redis:
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

# ApplicationSet Controller 설정
applicationSet:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Notifications Controller (선택사항)
notifications:
  enabled: false

# Dex (OIDC 인증, 현재는 미사용)
dex:
  enabled: false

# 설정
configs:
  params:
    # Git 폴링 간격 (기본 3분)
    timeout.reconciliation: 180s
    # Base URL 설정 (서브도메인 기반)
    server.basehref: /
    server.rootpath: /
    server.insecure: "true"

  cm:
    # ArgoCD 서버 URL
    url: ""

    # Git 저장소 자동 추가
    repositories: |
      - url: https://github.com/musqat/ggeolmuse
        type: git
        name: ggeolmuse

    # 리소스 추적 방법
    application.resourceTrackingMethod: annotation

    # 상태 배지 활성화
    statusbadge.enabled: "true"

    # 리소스 제외 설정
    resource.exclusions: |
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - EndpointSlice
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
