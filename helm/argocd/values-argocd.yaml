global:
  domain: ggeolmuse.com

# ArgoCD Server 설정
server:
  ingress:
    enabled: false

  # 커맨드 라인 플래그로 insecure 모드 명시적 설정
  extraArgs:
    - --insecure

  # 요청을 실사용에 맞추고 한도는 남긴다.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Controller 설정 (Git 저장소 감시)
controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 320Mi

# Repo Server 설정 (Git 저장소 연결)
repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Redis 설정
redis:
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 32Mi

# ApplicationSet Controller 설정
applicationSet:
  enabled: false

# Notifications Controller (선택사항)
notifications:
  enabled: false

# Dex (OIDC 인증, 현재는 미사용)
dex:
  enabled: false

# 설정
configs:
  params:
    # Git 폴링 간격 (기본 3분)
    timeout.reconciliation: 180s
    # 서브도메인 기반
    server.insecure: "true"

  cm:
    # ArgoCD 서버 URL
    url: ""

    # Git 저장소 자동 추가
    repositories: |
      - url: https://github.com/musqat/ggeolmuse
        type: git
        name: ggeolmuse

    # 리소스 추적 방법
    application.resourceTrackingMethod: annotation

    # 상태 배지 활성화
    statusbadge.enabled: "true"

    # 리소스 제외 설정
    resource.exclusions: |
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - EndpointSlice
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
