# Prometheus 설정
prometheus:
  prometheusSpec:
    # Service Monitor 설정
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}

    # Pod Monitor 설정
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}

    # 모든 네임스페이스의 PrometheusRule 읽기
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # 메트릭 보관 기간
    retention: 15d  # 15일

    # 서비스 그래프 · 스팬 지표를 remote write 로 받음
    enableRemoteWriteReceiver: true

    # 스토리지 설정
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  # Prometheus Ingress는 비활성화
  ingress:
    enabled: false

# Grafana 설정
grafana:
  enabled: true

  # Admin 계정 설정 - Kubernetes Secret 사용
  admin:
    existingSecret: "grafana-admin"
    userKey: admin-user
    passwordKey: admin-password

  # Sidecar 설정 - Chart의 자동 datasource 생성 완전히 비활성화
  sidecar:
    datasources:
      enabled: false  # Sidecar 비활성화하여 Chart가 생성하는 ConfigMap 방지

  # 서브도메인 설정
  grafana.ini:
    server:
      root_url: "https://grafana.ggeolmuse.com"
      serve_from_sub_path: false

  # Grafana Ingress는 비활성화
  ingress:
    enabled: false

  # 리소스 설정
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 50m

  # 데이터소스 셋(Prometheus · Loki · Tempo, 서로 uid 로 이어짐)
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
          jsonData:
            timeInterval: 30s

        # 로그 줄의 trace_id 에서 Tempo 트레이스로
        - name: Loki
          uid: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"(\w+)"'
                datasourceUid: Tempo
                url: '$${__value.raw}'

        # 트레이스에서 그 시간 · 그 trace_id 의 로그와 서비스 그래프로
        - name: Tempo
          uid: Tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: Loki
              spanStartTimeShift: '-5m'
              spanEndTimeShift: '5m'
              filterByTraceID: true
            serviceMap:
              datasourceUid: Prometheus
            nodeGraph:
              enabled: true

# Alertmanager 설정
alertmanager:
  enabled: true

  alertmanagerSpec:
    # 모든 네임스페이스의 AlertmanagerConfig 읽기
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    # 알림 네임스페이스와 무관한 라우팅
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  ingress:
    enabled: false

# 기타 컴포넌트 설정
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false
