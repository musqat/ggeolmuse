# AlertManager 설정: 알림 라우팅 및 채널 설정
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: ggeolmuse
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      # 알림 기본 설정
      resolve_timeout: 5m

      # Slack 설정 (선택적 - 환경변수로 설정)
      # slack_api_url: '${SLACK_WEBHOOK_URL}'

      # SMTP 설정 (선택적 - 환경변수로 설정)
      # smtp_from: '${SMTP_FROM}'
      # smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
      # smtp_auth_username: '${SMTP_USERNAME}'
      # smtp_auth_password: '${SMTP_PASSWORD}'
      # smtp_require_tls: true

    # 알림 템플릿
    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    # 알림 라우팅 규칙
    route:
      # 기본 그룹핑 키 (같은 알림을 묶어서 전송)
      group_by: ['alertname', 'cluster', 'service', 'severity']

      # 첫 알림 대기 시간 (같은 그룹의 알림을 모아서 전송)
      group_wait: 10s

      # 같은 그룹에 추가 알림이 오면 대기 시간
      group_interval: 10s

      # 같은 알림을 다시 보내는 간격
      repeat_interval: 12h

      # 기본 receiver
      receiver: 'default'

      # Severity별 라우팅
      routes:
        # Critical 알림 - 즉시 전송
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 5m
          continue: true

        # Warning 알림 - 그룹핑 후 전송
        - match:
            severity: warning
          receiver: 'warning-alerts'
          group_wait: 30s
          repeat_interval: 1h
          continue: true

        # Info 알림 - 그룹핑 후 전송
        - match:
            severity: info
          receiver: 'info-alerts'
          group_wait: 1m
          repeat_interval: 3h

    # 알림 억제 규칙
    inhibit_rules:
      # ServiceDown이 발생하면 다른 알림 억제
      - source_match:
          severity: 'critical'
          alertname: 'ServiceDown'
        target_match:
          severity: 'warning'
        equal: ['job', 'instance']

      # PodNotReady가 발생하면 HighCpuUsage, HighMemoryUsage 억제
      - source_match:
          severity: 'warning'
          alertname: 'PodNotReady'
        target_match_re:
          alertname: '^(HighCpuUsage|HighMemoryUsage)$'
        equal: ['pod']

    # Receivers (알림 채널)
    receivers:
      # 기본 receiver (콘솔 로그만)
      - name: 'default'
        # webhook_configs:
        #   - url: 'http://localhost:5001/'
        #     send_resolved: true

      # Critical 알림용 receiver
      - name: 'critical-alerts'
        # Slack 알림 (선택적)
        # slack_configs:
        #   - api_url: '${SLACK_WEBHOOK_URL}'
        #     channel: '#alerts-critical'
        #     title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
        #     text: |
        #       {{ range .Alerts }}
        #       *Alert:* {{ .Labels.alertname }}
        #       *Severity:* {{ .Labels.severity }}
        #       *Summary:* {{ .Annotations.summary }}
        #       *Description:* {{ .Annotations.description }}
        #       {{ end }}
        #     send_resolved: true

        # Email 알림 (선택적)
        # email_configs:
        #   - to: '${ALERT_EMAIL_TO}'
        #     from: '${SMTP_FROM}'
        #     smarthost: '${SMTP_HOST}:${SMTP_PORT}'
        #     auth_username: '${SMTP_USERNAME}'
        #     auth_password: '${SMTP_PASSWORD}'
        #     headers:
        #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        #     send_resolved: true

      # Warning 알림용 receiver
      - name: 'warning-alerts'
        # Slack 알림 (선택적)
        # slack_configs:
        #   - api_url: '${SLACK_WEBHOOK_URL}'
        #     channel: '#alerts-warning'
        #     title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
        #     text: |
        #       {{ range .Alerts }}
        #       *Alert:* {{ .Labels.alertname }}
        #       *Severity:* {{ .Labels.severity }}
        #       *Summary:* {{ .Annotations.summary }}
        #       {{ end }}
        #     send_resolved: true

      # Info 알림용 receiver
      - name: 'info-alerts'
        # Slack 알림 (선택적)
        # slack_configs:
        #   - api_url: '${SLACK_WEBHOOK_URL}'
        #     channel: '#alerts-info'
        #     title: 'ℹ️ [INFO] {{ .GroupLabels.alertname }}'
        #     text: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        #     send_resolved: false
