# Loki 로그 수집 설정

loki:
  enabled: true
  isDefault: true
  # Grafana 상태 확인 쿼리(vector)를 읽는 판
  image:
    tag: 2.9.17
  # 로그 · WAL 을 노드 디스크(local-path)에 저장
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  # 7일 지난 로그는 compactor 가 지움
  config:
    compactor:
      retention_enabled: true
    limits_config:
      retention_period: 168h
  # 조회 때 순간 메모리 몫
  resources:
    limits:
      memory: 1Gi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 50m

promtail:
  enabled: true
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 64Mi
      cpu: 20m

test:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
