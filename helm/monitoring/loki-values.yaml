# Loki 로그 수집 설정

loki:
  enabled: true
  isDefault: true
  # Grafana 상태 확인 쿼리(vector)를 읽는 판
  image:
    tag: 2.9.17

promtail:
  enabled: true

test:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
