# Tempo 분산 추적 설정

tempo:
  # 블록 flush(압축 · 쓰기) 때 순간 CPU 몫
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  # flush 중 /ready 가 수십 초 막히는 것은 넘기고 오래 응답이 없을 때만
  livenessProbe:
    failureThreshold: 12

  # 트레이스 3일 보관
  retention: 72h

  # 서비스 그래프 · 스팬 지표를 Prometheus 로 보냄
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

  # 만들 지표 종류(서비스 그래프 · 스팬 지표)
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

# OTLP 받기(자바 OTel 에이전트)
traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

# Zipkin 호환성
zipkin:
  enabled: true

# 트레이스를 노드 디스크(local-path)에 저장
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

# Tempo 자체 지표
serviceMonitor:
  enabled: true
