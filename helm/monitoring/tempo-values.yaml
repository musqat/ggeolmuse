# Tempo 분산 추적 설정

tempo:
  # 블록 flush 가 압축과 쓰기를 몰아 해서 순간 CPU 를 쓴다.
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  # flush 중에는 /ready 가 수십 초 막힌다. 오래 먹통인 경우만 잡는다.
  livenessProbe:
    failureThreshold: 12

# OTLP 프로토콜 활성화 (Micrometer Tracing 사용)
traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

# Zipkin 호환성
zipkin:
  enabled: true

# 저장소 설정 (로컬 파일시스템)
persistence:
  enabled: false

serviceMonitor:
  enabled: false
