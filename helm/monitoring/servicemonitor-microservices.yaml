apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ggeolmuse-config-server
  namespace: monitoring
  labels:
    app: ggeolmuse
    release: prometheus
spec:
  selector:
    matchLabels:
      app: config-server
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: management
      path: /prometheus
      interval: 30s
      scheme: http
---
