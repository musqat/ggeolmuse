# AlertManager 이메일 설정 예시
# alertmanager-config.yaml의 주석을 해제하고 아래 내용으로 수정하세요

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: ggeolmuse
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

      # SMTP 설정 (Gmail 예시)
      smtp_from: 'ggeolmuse-alerts@gmail.com'
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_auth_username: 'ggeolmuse-alerts@gmail.com'
      smtp_auth_password: 'your-app-password'  # Gmail 앱 비밀번호
      smtp_require_tls: true

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'

      routes:
        # Critical 알림 - 즉시 이메일 전송
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 5m
          continue: true

        # Warning 알림 - 그룹핑 후 전송
        - match:
            severity: warning
          receiver: 'warning-alerts'
          group_wait: 30s
          repeat_interval: 1h
          continue: true

        # Info 알림
        - match:
            severity: info
          receiver: 'info-alerts'
          group_wait: 1m
          repeat_interval: 3h

    # 알림 억제 규칙
    inhibit_rules:
      - source_match:
          severity: 'critical'
          alertname: 'ServiceDown'
        target_match:
          severity: 'warning'
        equal: ['job', 'instance']

    # Receivers (이메일 설정)
    receivers:
      # 기본 receiver
      - name: 'default'

      # Critical 알림 - 운영팀에게 즉시 전송
      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall@yourdomain.com'  # 담당자 이메일
            from: 'ggeolmuse-alerts@gmail.com'
            headers:
              Subject: '🚨 [CRITICAL] {{ .GroupLabels.alertname }} - ggeolmuse'
            html: |
              <!DOCTYPE html>
              <html>
              <body style="font-family: Arial, sans-serif;">
                <h2 style="color: #dc3545;">🚨 Critical Alert</h2>
                {{ range .Alerts }}
                <div style="background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin: 10px 0; border-radius: 5px;">
                  <h3>{{ .Labels.alertname }}</h3>
                  <p><strong>Severity:</strong> <span style="color: #dc3545;">{{ .Labels.severity }}</span></p>
                  <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
                  <p><strong>Description:</strong> {{ .Annotations.description }}</p>
                  <p><strong>Service:</strong> {{ .Labels.job }}</p>
                  <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
                  <p><strong>Started:</strong> {{ .StartsAt }}</p>
                </div>
                {{ end }}
                <hr>
                <p><a href="http://grafana.localhost">Grafana 대시보드 확인</a></p>
                <p><a href="http://alertmanager.localhost">AlertManager 확인</a></p>
              </body>
              </html>
            send_resolved: true

      # Warning 알림 - 개발팀에게 전송
      - name: 'warning-alerts'
        email_configs:
          - to: 'dev-team@yourdomain.com'
            from: 'ggeolmuse-alerts@gmail.com'
            headers:
              Subject: '⚠️ [WARNING] {{ .GroupLabels.alertname }} - ggeolmuse'
            html: |
              <!DOCTYPE html>
              <html>
              <body style="font-family: Arial, sans-serif;">
                <h2 style="color: #ffc107;">⚠️ Warning Alert</h2>
                {{ range .Alerts }}
                <div style="background-color: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; margin: 10px 0; border-radius: 5px;">
                  <h3>{{ .Labels.alertname }}</h3>
                  <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
                  <p><strong>Service:</strong> {{ .Labels.job }}</p>
                  <p><strong>Started:</strong> {{ .StartsAt }}</p>
                </div>
                {{ end }}
              </body>
              </html>
            send_resolved: true

      # Info 알림 - 간단한 텍스트만
      - name: 'info-alerts'
        email_configs:
          - to: 'monitoring@yourdomain.com'
            from: 'ggeolmuse-alerts@gmail.com'
            headers:
              Subject: 'ℹ️ [INFO] {{ .GroupLabels.alertname }} - ggeolmuse'
            send_resolved: false
