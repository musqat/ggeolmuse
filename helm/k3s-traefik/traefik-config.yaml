# k3s 번들 Traefik 값 덧붙이기(HelmChart 는 k3s 가 부팅마다 다시 만듦)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        # IngressRoute 가 argocd · monitoring 네임스페이스의 서비스를 가리키게
        allowCrossNamespace: true
        allowExternalNameServices: true
    api:
      insecure: false
      dashboard: true
    # Prometheus 지표를 metrics 진입점으로 냄
    metrics:
      prometheus:
        entryPoint: metrics
