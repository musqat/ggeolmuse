# k3s 는 부팅할 때마다 HelmChart 를 다시 만든다.
# 값을 추가하려면 HelmChartConfig 를 쓴다
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        # IngressRoute 가 argocd, monitoring 네임스페이스의 서비스를 가리킨다
        allowCrossNamespace: true
        allowExternalNameServices: true
    api:
      insecure: true
      dashboard: true
