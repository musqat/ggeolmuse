# 공통 설정 (환경 무관). 환경별 값은 values-dev.yaml / values-prod.yaml 참조.
global:
  imageRegistry: muscathan
  imagePullPolicy: Always

  # Management server port (Health, Metrics, Actuator)
  management:
    port: 9090

  keycloak:
    realm: muscathan
    clientId: ggeolmuse-client
    frontendClientId: ggeolmuse-frontend
    # authServerUrl, publicUrl: 환경별 (dev/prod)

  redis:
    host: redis
    port: 6379
    healthCheckEnabled: false

  kafka:
    enabled: true
    bootstrapServers: kafka:9092
    consumer:
      groupIdPrefix: ggeolmuse
      autoOffsetReset: earliest
      enableAutoCommit: false
    producer:
      acks: all
      retries: 3
      compressionType: snappy

  # springProfiles: 환경별 (dev/prod)

  # AWS 설정 (enabled/secretsManager.enabled: 환경별)
  aws:
    region: ap-northeast-2
    secretsManager:
      # Shared production secret name (all services use this)
      name: ggeolmuse/production
    # IRSA (IAM Roles for Service Accounts) 설정
    serviceAccount:
      create: true

  # OpenTelemetry 설정 (endpoint: 환경별)
  otel:
    enabled: true
    protocol: http/protobuf
    tracesExporter: otlp
    metricsExporter: none  # Tempo는 traces만 지원
    logsExporter: none     # Loki 사용 시 변경 가능
    serviceName: ""        # 각 서비스에서 override

# Ingress Controller (enabled: 환경별 - dev만 사용)
ingressController:
  image: registry.k8s.io/ingress-nginx/controller:v1.9.4

# 인프라
infrastructure:
  redis:
    enabled: true
    image: redis:7-alpine
    port: 6379
    service:
      type: ClusterIP

  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:23.0
    port: 8080
    replicas: 1
    env:
      kcAdminUser: admin
      kcAdminPassword: admin
      kcDbVendor: dev-file
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080

  zookeeper:
    enabled: true
    image: confluentinc/cp-zookeeper:7.6.0
    port: 2181
    replicas: 1
    env:
      clientPort: 2181
      tickTime: 2000
      syncLimit: 2
    service:
      type: ClusterIP
      port: 2181
    storage:
      data: 1Gi
      log: 1Gi

  kafka:
    enabled: true
    image: confluentinc/cp-kafka:7.6.0
    replicas: 1
    ports:
      internal: 9092
      external: 9094
    env:
      brokerId: 1
      zookeeperConnect: zookeeper:2181
      offsetsTopicReplicationFactor: 1
      transactionStateLogMinIsr: 1
      transactionStateLogReplicationFactor: 1
      autoCreateTopicsEnable: true
      logRetentionHours: 168
      logSegmentBytes: "1073741824"
    service:
      internal:
        type: ClusterIP
        port: 9092
      external:
        type: NodePort
        port: 9094
        nodePort: 30094
    storage:
      data: 5Gi
    topicsInit:
      enabled: true

  kafkaUi:
    enabled: true
    image: provectuslabs/kafka-ui:latest
    replicas: 1
    port: 8080
    env:
      clustersName: ggeolmuse
      bootstrapServers: kafka:9092
      zookeeper: zookeeper:2181
    service:
      type: ClusterIP
      port: 8090
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m

  tempo:
    enabled: true
    image: grafana/tempo:2.3.1
    replicas: 1
    ports:
      otlp: 4317      # OTLP gRPC
      otlpHttp: 4318  # OTLP HTTP
      zipkin: 9411    # Zipkin
      jaeger: 14268   # Jaeger
    service:
      type: ClusterIP
    storage:
      data: 5Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 500m

# 설정 서버
configServer:
  enabled: true
  name: config-server
  replicaCount: 1
  image:
    repository: config-server
  service:
    type: ClusterIP
    port: 8888
  git:
    uri: https://github.com/musqat/ggeolmuse-config.git
    label: main
    searchPaths: .
  # env.springProfiles: 환경별 (dev/prod)
  probes:
    readiness:
      initialDelaySeconds: 60
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 15
    startup:
      failureThreshold: 30
      periodSeconds: 10

# 게이트웨이
gatewayServer:
  enabled: true
  name: gateway-server
  replicaCount: 1
  image:
    repository: gateway-server
  service:
    type: LoadBalancer
    port: 8070
  env:
    # springProfiles: 환경별 (dev/prod)
    configUri: http://config-server:8888
    configUsername: config
    configPassword: config123
  rbac:
    create: true
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  probes:
    readiness:
      initialDelaySeconds: 60
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 15
    startup:
      failureThreshold: 30
      periodSeconds: 10

# 비즈니스 서비스
services:
  userService:
    enabled: true
    name: user-service
    replicaCount: 1
    image:
      repository: user-service
    service:
      type: ClusterIP
      port: 8080
    labels:
      tier: business-service
    # env.appBaseUrl/appFrontendUrl/mailVerificationBaseUrl: 환경별 (dev/prod)
    secrets:
      keycloakSecret: true
      mailUsername: true
      mailPassword: true
      mailFrom: true
    strategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    probes:
      readiness:
        initialDelaySeconds: 60
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 120
        periodSeconds: 20
      startup:
        failureThreshold: 30
        periodSeconds: 10

  tradeService:
    enabled: true
    name: trade-service
    replicaCount: 1
    image:
      repository: trade-service
    service:
      type: ClusterIP
      port: 8081
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    strategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    probes:
      readiness:
        initialDelaySeconds: 60
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 120
        periodSeconds: 20
      startup:
        failureThreshold: 30
        periodSeconds: 10

  marketDataService:
    enabled: true
    name: market-data-service
    replicaCount: 1
    image:
      repository: market-data-service
    service:
      type: ClusterIP
      port: 8083
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
      koreaexImApiKey: true
    strategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    probes:
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 15
      startup:
        failureThreshold: 30
        periodSeconds: 10

  backtestService:
    enabled: true
    name: backtest-service
    replicaCount: 1
    image:
      repository: backtest-service
    service:
      type: ClusterIP
      port: 8082
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    probes:
      readiness:
        initialDelaySeconds: 60
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 120
        periodSeconds: 20
      startup:
        failureThreshold: 30
        periodSeconds: 10

  chatService:
    enabled: true
    name: chat-service
    replicaCount: 1
    image:
      repository: chat-service
    service:
      type: ClusterIP
      port: 8000
    labels:
      tier: business-service
    probes:
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 20
        periodSeconds: 20

# 프론트엔드
frontend:
  enabled: true
  name: frontend-web
  replicaCount: 1
  image:
    repository: frontend-web
  service:
    type: LoadBalancer
    port: 3000
    targetPort: 80
  env:
    # apiUrl, keycloakUrl: 환경별 (dev/prod)
    keycloakRealm: muscathan
    keycloakClientId: ggeolmuse-frontend

# 네트워크 정책
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  businessServiceTier: business-service
  gatewayApp: gateway-server
  ports:
    - 8000
    - 8080
    - 8081
    - 8082
    - 8083

# Ingress 설정: 환경별 (values-dev.yaml = nginx/app.localhost, values-prod.yaml = traefik/ggeolmuse.com)

# Secret 설정
secrets:
  enabled: false  # 기본값: 비활성화
  name: ggeolmuse-secrets
  data:
    configServerUsername: ""
    configServerPassword: ""
    keycloakSecret: ""
    keycloakAdminUsername: ""
    keycloakAdminPassword: ""
    keycloakClientSecret: ""
    keycloakTestUserPassword: ""
    mailUsername: ""
    mailPassword: ""
    mailFrom: ""
    koreaeximApiKey: ""
    alphavantageApiKey: ""
    openaiApiKey: ""

# 모니터링 설정
monitoring:
  serviceMonitor:
    enabled: true

# ConfigMap 설정
configMap:
  enabled: true
  data:
    # appBaseUrl, oauthRedirectUri: 환경별 (dev/prod)
    emailExpiryHours: "24"
    exchangeRateMin: "0"
    exchangeRateMax: "3000"
    exchangeRateFallback: "1300.00"
    redisHost: "redis"
    redisPort: "6379"
    redisPassword: ""
