{{- if .Values.secrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.secrets.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Config Server 인증
  CONFIG_SERVER_USERNAME: {{ .Values.secrets.data.configServerUsername | quote }}
  CONFIG_SERVER_PASSWORD: {{ .Values.secrets.data.configServerPassword | quote }}

  # Keycloak 설정
  KEYCLOAK_SECRET: {{ .Values.secrets.data.keycloakSecret | quote }}
  KEYCLOAK_ADMIN_USERNAME: {{ .Values.secrets.data.keycloakAdminUsername | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.data.keycloakAdminPassword | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.data.keycloakClientSecret | quote }}
  KEYCLOAK_TEST_USER_PASSWORD: {{ .Values.secrets.data.keycloakTestUserPassword | quote }}

  # Gmail SMTP 설정 (User Service)
  MAIL_USERNAME: {{ .Values.secrets.data.mailUsername | quote }}
  MAIL_PASSWORD: {{ .Values.secrets.data.mailPassword | quote }}
  MAIL_FROM: {{ .Values.secrets.data.mailFrom | quote }}

  # 외부 API 키 (Market Data Service)
  KOREAEXIM_API_KEY: {{ .Values.secrets.data.koreaeximApiKey | quote }}
  ALPHAVANTAGE_API_KEY: {{ .Values.secrets.data.alphavantageApiKey | quote }}

  # OpenAI API 키 (AI Chat Service)
  OPENAI_API_KEY: {{ .Values.secrets.data.openaiApiKey | quote }}
{{- end }}
