{{- if and .Values.infrastructure.kafka.enabled .Values.infrastructure.kafka.topicsInit.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    app: kafka-topics-init
    {{- include "ggeolmuse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics-creator
          image: {{ .Values.infrastructure.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              sleep 30

              echo "Creating Kafka topics..."

              # Trading topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic trading.trade.completed \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=604800000 \
                --config segment.bytes=1073741824

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic trading.trade.failed \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=604800000

              # Market data topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic market.price.updated \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=86400000 \
                --config cleanup.policy=compact

              # User account topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic user.account.created \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic user.account.deleted \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic user.email.send \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=604800000

              # Backtest topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic backtest.completed \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              # FX Rate topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic market.fxrate.updated \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000 \
                --config cleanup.policy=compact

              # Dividend topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic market.dividend.updated \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=7776000000

              # Dead Letter Queue topics
              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic trading.trade.completed.DLT \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic market.price.updated.DLT \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic user.account.created.DLT \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic user.email.send.DLT \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              kafka-topics --create --if-not-exists \
                --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }} \
                --topic backtest.completed.DLT \
                --partitions 3 \
                --replication-factor {{ .Values.infrastructure.kafka.replicas }} \
                --config retention.ms=2592000000

              echo "Listing all topics:"
              kafka-topics --list --bootstrap-server kafka:{{ .Values.infrastructure.kafka.ports.internal }}

              echo "Kafka topics initialization completed!"
          resources:
            {{- toYaml .Values.infrastructure.kafka.topicsInit.resources | nindent 12 }}
{{- end }}
