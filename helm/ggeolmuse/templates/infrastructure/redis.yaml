{{- if .Values.infrastructure.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # emptyDir /data 에 AOF 를 쓸 수 있게 fsGroup
      securityContext:
        fsGroup: 10001
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.infrastructure.redis.port }}
        {{- if (include "ggeolmuse.secretFiles" .) }}
        # 비밀번호는 파일에서 읽어 표준입력 설정으로(환경변수 · 프로세스 인자에 안 남음)
        command:
        - sh
        - -c
        - |
          exec redis-server - --appendonly yes --maxmemory {{ .Values.infrastructure.redis.maxmemory }} --maxmemory-policy {{ .Values.infrastructure.redis.maxmemoryPolicy }} <<EOF
          requirepass $(cat /etc/secrets/REDIS_PASSWORD)
          EOF
        {{- else }}
        command: ["redis-server", "--appendonly", "yes", "--maxmemory", {{ .Values.infrastructure.redis.maxmemory | quote }}, "--maxmemory-policy", {{ .Values.infrastructure.redis.maxmemoryPolicy | quote }}]
        {{- end }}
        resources:
          {{- toYaml .Values.infrastructure.redis.resources | nindent 10 }}
        securityContext:
          {{- include "ggeolmuse.securityContext" . | nindent 10 }}
        # AOF 자리(루트는 읽기 전용)
        volumeMounts:
        - name: data
          mountPath: /data
        {{- if (include "ggeolmuse.secretFiles" .) }}
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
        {{- end }}
      {{- with .Values.infrastructure.redis.exporter }}
      {{- if .enabled }}
      # 지표 내보내기(응답 · 메모리 · 키 수 · 명령 수)
      - name: redis-exporter
        image: {{ .image }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .port }}
          name: metrics
        {{- if (include "ggeolmuse.secretFiles" $) }}
        # 이미지에 셸이 없어 비밀번호는 환경변수로
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: REDIS_PASSWORD
        {{- end }}
        resources:
          {{- toYaml .resources | nindent 10 }}
        securityContext:
          {{- include "ggeolmuse.securityContext" $ | nindent 10 }}
      {{- end }}
      {{- end }}
      volumes:
      - name: data
        emptyDir: {}
      {{- if (include "ggeolmuse.secretFiles" .) }}
      - name: secrets
        secret:
          secretName: ggeolmuse-secrets
          items:
          - key: REDIS_PASSWORD
            path: REDIS_PASSWORD
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.infrastructure.redis.service.type }}
  ports:
  - name: redis
    port: {{ .Values.infrastructure.redis.port }}
    targetPort: {{ .Values.infrastructure.redis.port }}
    protocol: TCP
  {{- if .Values.infrastructure.redis.exporter.enabled }}
  - name: metrics
    port: {{ .Values.infrastructure.redis.exporter.port }}
    targetPort: metrics
    protocol: TCP
  {{- end }}
  selector:
    app: redis
{{- end }}
