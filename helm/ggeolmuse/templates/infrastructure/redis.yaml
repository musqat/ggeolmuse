{{- if .Values.infrastructure.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # /data 는 emptyDir 이라 root 소유로 생긴다. fsGroup 이 있어야 AOF 를 쓴다.
      securityContext:
        fsGroup: 10001
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.infrastructure.redis.port }}
        {{- if .Values.global.aws.secretsManager.enabled }}
        # --requirepass 는 인자라 환경변수가 안 풀린다. 셸을 거쳐 넘긴다.
        command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: REDIS_PASSWORD
        {{- else }}
        command: ["redis-server", "--appendonly", "yes"]
        {{- end }}
        resources:
          {{- toYaml .Values.infrastructure.redis.resources | nindent 10 }}
        securityContext:
          {{- include "ggeolmuse.securityContext" . | nindent 10 }}
        # AOF 가 여기 쌓인다. 루트를 읽기전용으로 막아서 쓸 자리를 따로 준다.
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.infrastructure.redis.service.type }}
  ports:
  - port: {{ .Values.infrastructure.redis.port }}
    targetPort: {{ .Values.infrastructure.redis.port }}
    protocol: TCP
  selector:
    app: redis
{{- end }}
