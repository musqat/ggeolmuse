# PrometheusRule: ggeolmuse 마이크로서비스 알림 규칙
# app=ggeolmuse, release=prometheus 를 보므로 이 라벨이면 자동으로 집는다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ggeolmuse-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app: ggeolmuse
    release: prometheus
spec:
  groups:
    # ========================================
    # 서비스 가용성 알림
    # ========================================
    - name: service-availability
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: up{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)"} == 0
          # 콜드 부팅에 7분 걸린다. config-server 가 뜬 뒤에야 나머지가 시작한다.
          for: 10m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: "서비스 다운 감지: {{ `{{ $labels.job }}` }}"
            description: '{{ `{{ $labels.job }}` }} 응답 없음 · 10분 지속'
            instance: "{{ `{{ $labels.instance }}` }}"
            value: "{{ `{{ $value }}` }}"

        - alert: ServiceRestarting
          # EC2 를 매일 껐다 켜서 부팅마다 1회는 정상이다. 크래시 루프만 잡는다.
          expr: increase(kube_pod_container_status_restarts_total{namespace="default", pod=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service).*"}[15m]) > 2
          for: 5m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "Pod 재시작 감지: {{ `{{ $labels.pod }}` }}"
            description: '{{ `{{ $labels.pod }}` }} 재시작 3회 초과 · 최근 15분'
            namespace: "{{ `{{ $labels.namespace }}` }}"
            container: "{{ `{{ $labels.container }}` }}"

    # ========================================
    # 리소스 사용량 알림
    # ========================================
    - name: resource-usage
      interval: 30s
      rules:
        - alert: HighCpuUsage
          expr: |
            (
              rate(process_cpu_seconds_total{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)"}[5m]) * 100
            ) > 80
          for: 5m
          labels:
            severity: warning
            category: resource
          annotations:
            summary: "높은 CPU 사용률: {{ `{{ $labels.job }}` }}"
            description: '{{ `{{ $labels.job }}` }} CPU 사용률 80% 초과 · 5분 지속 · 현재 {{ `{{ $value | printf "%.1f" }}` }}%'
            instance: "{{ `{{ $labels.instance }}` }}"

        - alert: HighMemoryUsage
          # GC 후 남는 양으로 잰다. used 는 수거 전 쓰레기를 포함해서 배치가 돌 때마다 걸린다.
          expr: |
            (
              jvm_gc_live_data_size_bytes{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)"}
              / jvm_memory_max_bytes{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)", area="heap"}
              * 100
            ) > 85
          for: 5m
          labels:
            severity: warning
            category: resource
          annotations:
            summary: "높은 메모리 사용률: {{ `{{ $labels.job }}` }}"
            description: '{{ `{{ $labels.job }}` }} 힙 사용률 85% 초과 · 5분 지속 · 현재 {{ `{{ $value | printf "%.1f" }}` }}%'
            instance: "{{ `{{ $labels.instance }}` }}"

        - alert: CriticalMemoryUsage
          expr: |
            (
              jvm_gc_live_data_size_bytes{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)"}
              / jvm_memory_max_bytes{job=~"(config-server|gateway-server|user-service|trade-service|market-data-service|backtest-service)", area="heap"}
              * 100
            ) > 95
          for: 2m
          labels:
            severity: critical
            category: resource
          annotations:
            summary: "심각한 메모리 부족: {{ `{{ $labels.job }}` }}"
            description: '{{ `{{ $labels.job }}` }} 힙 사용률 95% 초과 · 2분 지속 · 현재 {{ `{{ $value | printf "%.1f" }}` }}% · OOM 임박'
            instance: "{{ `{{ $labels.instance }}` }}"

    # ========================================
    # API 성능 알림
    # ========================================
    - name: api-performance
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job=~"(gateway-server|user-service|trade-service|market-data-service|backtest-service)", status=~"5.."}[5m])) by (job, uri)
              / sum(rate(http_server_requests_seconds_count{job=~"(gateway-server|user-service|trade-service|market-data-service|backtest-service)"}[5m])) by (job, uri)
              * 100
            ) > 5
          for: 3m
          labels:
            severity: critical
            category: performance
          annotations:
            summary: "높은 에러율: {{ `{{ $labels.job }}` }} {{ `{{ $labels.uri }}` }}"
            description: '{{ `{{ $labels.job }}` }} {{ `{{ $labels.uri }}` }} 5xx 비율 5% 초과 · 3분 지속 · 현재 {{ `{{ $value | printf "%.1f" }}` }}%'

        - alert: SlowResponseTime
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{job=~"(gateway-server|user-service|trade-service|market-data-service|backtest-service)"}[5m])) by (job, uri, le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "느린 응답 시간: {{ `{{ $labels.job }}` }} {{ `{{ $labels.uri }}` }}"
            description: '{{ `{{ $labels.job }}` }} {{ `{{ $labels.uri }}` }} P95 응답 2초 초과 · 5분 지속 · 현재 {{ `{{ $value | printf "%.2f" }}` }}초'
    - name: config-server
      interval: 30s
      rules:
        - alert: ConfigServerDown
          expr: up{job="config-server"} == 0
          for: 5m
          labels:
            severity: critical
            category: config
          annotations:
            summary: "Config Server 다운"
            description: 'config-server 응답 없음 · 5분 지속 · 나머지 서비스 설정 조회 불가'

        - alert: ConfigServerHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{job="config-server"}[5m])) by (le)
            ) > 5
          for: 5m
          labels:
            severity: warning
            category: config
          annotations:
            summary: "Config Server 응답 지연"
            description: 'config-server P95 응답 5초 초과 · 5분 지속 · 서비스 기동 지연'

        - alert: ConfigServerUnauthorized
          # 클라이언트와 config-server 의 비밀번호가 어긋나면 여기서 401 이 난다
          expr: sum(rate(http_server_requests_seconds_count{job="config-server", status="401"}[5m])) * 60 > 0
          for: 5m
          labels:
            severity: critical
            category: config
          annotations:
            summary: "Config Server 인증 실패"
            description: 'config-server 401 응답 · 5분 지속 · 분당 {{ `{{ $value | printf "%.0f" }}` }}회 · 클라이언트 비밀번호 불일치 의심'

    # ========================================
    # Gateway 알림
    # ========================================
    - name: gateway
      interval: 30s
      rules:
        - alert: GatewayHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="gateway-server", status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{job="gateway-server"}[5m]))
              * 100
            ) > 3
          for: 3m
          labels:
            severity: critical
            category: gateway
          annotations:
            summary: "Gateway 높은 에러율"
            description: 'gateway-server 5xx 비율 3% 초과 · 3분 지속 · 현재 {{ `{{ $value | printf "%.1f" }}` }}%'

    # ========================================
    # 서킷브레이커
    # ========================================
    - name: resilience
      interval: 30s
      rules:
        - alert: CircuitBreakerOpen
          expr: resilience4j_circuitbreaker_state{job=~"(gateway-server|user-service|trade-service|backtest-service)", state="open"} > 0
          for: 1m
          labels:
            severity: warning
            category: resilience
          annotations:
            summary: "서킷 OPEN: {{ `{{ $labels.job }}` }} → {{ `{{ $labels.name }}` }}"
            description: '{{ `{{ $labels.job }}` }} → {{ `{{ $labels.name }}` }} 서킷 OPEN · 1분 지속 · 대상 서비스 호출 차단 중'

        - alert: CircuitBreakerMissing
          # 설정의 인스턴스 이름과 코드의 @CircuitBreaker 이름이 어긋나면 서킷이 기본값으로 돌아
          # 사실상 열리지 않는다. 기대하는 (서비스, 이름) 의 메트릭이 없으면 그 상태다.
          # 콜드 부팅 7분 동안은 메트릭이 없으니 15분 유예.
          expr: |
            absent(resilience4j_circuitbreaker_state{job="backtest-service", name="marketDataService"})
            or absent(resilience4j_circuitbreaker_state{job="backtest-service", name="tradeService"})
            or absent(resilience4j_circuitbreaker_state{job="trade-service", name="marketService"})
            or absent(resilience4j_circuitbreaker_state{job="trade-service", name="userService"})
            or absent(resilience4j_circuitbreaker_state{job="user-service", name="marketDataService"})
          for: 15m
          labels:
            severity: warning
            category: resilience
          annotations:
            summary: "서킷 메트릭 없음: {{ `{{ $labels.job }}` }} / {{ `{{ $labels.name }}` }}"
            description: '{{ `{{ $labels.job }}` }} 에 {{ `{{ $labels.name }}` }} 서킷 메트릭 없음 · 15분 지속 · 설정 instances 이름과 @CircuitBreaker 이름 불일치 의심'
