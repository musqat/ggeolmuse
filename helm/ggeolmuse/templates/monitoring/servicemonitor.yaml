{{- if .Values.monitoring.serviceMonitor.enabled }}
---
# Gateway Server ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: gateway-server
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
---
