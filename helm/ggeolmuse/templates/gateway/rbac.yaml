{{- if and .Values.gatewayServer.enabled .Values.gatewayServer.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gatewayServer.name }}
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.gatewayServer.name }}-role
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.gatewayServer.name }}-binding
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.gatewayServer.name }}-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.gatewayServer.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
