{{- /* Traefik 전용(IngressRoute/Middleware). className이 traefik일 때만 렌더 → 로컬 nginx/vanilla k8s는 스킵 */ -}}
{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
---
# Middlewares
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-add-prefix
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  addPrefix:
    prefix: /argocd
---
# Main IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ggeolmuse.fullname" . }}-main-route
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # API Gateway
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: gateway-server
          port: 8070

    # Keycloak
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/auth`)
      kind: Rule
      priority: 20
      services:
        - name: keycloak
          port: 8080

    # Kafka UI
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/kafka-ui`)
      kind: Rule
      priority: 20
      services:
        - name: kafka-ui
          port: 8090

    # Frontend
    - match: Host(`{{ .Values.global.domain }}`)
      kind: Rule
      priority: 10
      services:
        - name: frontend-web
          port: 3000
---
# ArgoCD IngressRoute (subdomain-based)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ggeolmuse.fullname" . }}-argocd-route
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`argocd.{{ .Values.global.domain }}`)
      kind: Rule
      priority: 100
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
---
# Grafana IngressRoute (subdomain-based)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ggeolmuse.fullname" . }}-grafana-route
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`grafana.{{ .Values.global.domain }}`)
      kind: Rule
      priority: 100
      services:
        - name: prometheus-grafana
          namespace: monitoring
          port: 80
{{- end }}
