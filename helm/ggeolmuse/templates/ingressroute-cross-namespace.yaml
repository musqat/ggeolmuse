{{- if .Values.ingress.enabled }}
---
# ArgoCD IngressRoute (subdomain-based)
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ggeolmuse.fullname" . }}-argocd-route
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`argocd.{{ .Values.global.domain }}`)
      kind: Rule
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
---
# Grafana IngressRoute (subdomain-based)
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ggeolmuse.fullname" . }}-grafana-route
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`grafana.{{ .Values.global.domain }}`)
      kind: Rule
      services:
        - name: prometheus-grafana
          namespace: monitoring
          port: 80
{{- end }}
