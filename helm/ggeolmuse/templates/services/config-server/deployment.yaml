{{- if .Values.configServer.enabled }}
{{- include "ggeolmuse.serviceAccount" (dict "name" .Values.configServer.name "Values" .Values) }}
---
{{- $ctx := dict "svc" .Values.configServer "Values" .Values "Chart" .Chart "Release" .Release }}
{{ include "ggeolmuse.javaPodHeader" $ctx }}
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.configServer.env.springProfiles | quote }}
        - name: SERVER_PORT
          value: {{ .Values.configServer.service.port | quote }}
        - name: JAVA_OPTS
          value: {{ include "ggeolmuse.otelJavaOpts" (dict "Values" .Values "xmx" .Values.configServer.xmx) }}
        {{- include "ggeolmuse.otelEnv" (dict "Values" .Values "serviceName" .Values.configServer.name "version" .Values.configServer.image.tag) | nindent 8 }}
        # JGit 설정을 쓸 HOME(UID 10001 은 홈이 없어 / 로 잡힘)
        - name: HOME
          value: /tmp
{{- include "ggeolmuse.javaPodTail" $ctx }}
{{- end }}
