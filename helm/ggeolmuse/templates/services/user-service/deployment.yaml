{{- if .Values.services.userService.enabled }}
{{- include "ggeolmuse.serviceAccount" (dict "name" .Values.services.userService.name "Values" .Values) }}
---
{{- include "ggeolmuse.javaPodHeader" (dict "svc" .Values.services.userService "Values" .Values "Chart" .Chart "Release" .Release) }}
        {{- include "ggeolmuse.springEnv" . | nindent 8 }}
        - name: JAVA_OPTS
          value: {{ include "ggeolmuse.otelJavaOpts" (dict "Values" .Values "serviceName" .Values.services.userService.name "extraOpts" "-Dh2.webAllowOthers=true" "xmx" "256m") }}
        - name: KEYCLOAK_PUBLIC_URL
          value: {{ .Values.global.keycloak.publicUrl | quote }}
        - name: KEYCLOAK_RESOURCE
          value: {{ .Values.global.keycloak.clientId | quote }}
        {{- if .Values.global.aws.secretsManager.enabled }}
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: {{ include "ggeolmuse.dbUrlSecretKey" (dict "serviceName" .Values.services.userService.name) }}
        - name: KEYCLOAK_CREDENTIALS_SECRET
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: KEYCLOAK_SECRET
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: MAIL_PASSWORD
        - name: MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: MAIL_FROM
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: KEYCLOAK_ADMIN_USER_PASSWORD
        {{- else }}
        - name: KEYCLOAK_CREDENTIALS_SECRET
          {{- include "ggeolmuse.secretRef" (dict "Values" .Values "key" "KEYCLOAK_SECRET") | nindent 10 }}
        - name: MAIL_USERNAME
          {{- include "ggeolmuse.secretRef" (dict "Values" .Values "key" "MAIL_USERNAME") | nindent 10 }}
        - name: MAIL_PASSWORD
          {{- include "ggeolmuse.secretRef" (dict "Values" .Values "key" "MAIL_PASSWORD") | nindent 10 }}
        - name: MAIL_FROM
          {{- include "ggeolmuse.secretRef" (dict "Values" .Values "key" "MAIL_FROM") | nindent 10 }}
        - name: ADMIN_PASSWORD
          {{- include "ggeolmuse.secretRef" (dict "Values" .Values "key" "KEYCLOAK_ADMIN_USER_PASSWORD") | nindent 10 }}
        {{- end }}
        - name: APP_BASE_URL
          value: {{ .Values.services.userService.env.appBaseUrl | quote }}
        - name: APP_FRONTEND_URL
          value: {{ .Values.services.userService.env.appFrontendUrl | quote }}
        - name: APP_MAIL_VERIFICATION_BASE_URL
          value: {{ .Values.services.userService.env.mailVerificationBaseUrl | quote }}
        startupProbe:
          {{- include "ggeolmuse.startupProbe" (merge (dict "port" .Values.global.management.port) .Values.services.userService.probes.startup) | nindent 10 }}
        readinessProbe:
          {{- include "ggeolmuse.readinessProbe" (merge (dict "port" .Values.global.management.port) .Values.services.userService.probes.readiness) | nindent 10 }}
        livenessProbe:
          {{- include "ggeolmuse.livenessProbe" (merge (dict "port" .Values.global.management.port) .Values.services.userService.probes.liveness) | nindent 10 }}
{{- end }}
