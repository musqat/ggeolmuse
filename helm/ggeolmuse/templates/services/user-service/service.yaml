{{- if .Values.services.userService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.userService.name }}
  labels:
    app: {{ .Values.services.userService.name }}
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.userService.service.type }}
  ports:
  - port: {{ .Values.services.userService.service.port }}
    targetPort: {{ .Values.services.userService.service.port }}
    protocol: TCP
  selector:
    app: {{ .Values.services.userService.name }}
{{- end }}
