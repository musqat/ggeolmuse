{{- if .Values.global.aws.secretsManager.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ggeolmuse-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ggeolmuse-secrets
    creationPolicy: Owner
  data:
    # Config Server 인증
    - secretKey: CONFIG_SERVER_PASSWORD
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: CONFIG_SERVER_PASSWORD
    - secretKey: CONFIG_SERVER_USERNAME
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: CONFIG_SERVER_USERNAME
    # Database
    - secretKey: DB_URL
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_URL
    - secretKey: DB_URL_USER
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_URL_USER
    - secretKey: DB_URL_TRADE
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_URL_TRADE
    - secretKey: DB_URL_MARKET
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_URL_MARKET
    - secretKey: DB_URL_BACKTEST
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_URL_BACKTEST
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: DB_PASSWORD
    # Mail
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: MAIL_USERNAME
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: MAIL_PASSWORD
    - secretKey: MAIL_FROM
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: MAIL_FROM
    # API Keys
    - secretKey: KOREAEXIM_API_KEY
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KOREAEXIM_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: OPENAI_API_KEY
    # Keycloak
    - secretKey: KEYCLOAK_SECRET
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KEYCLOAK_SECRET
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: KEYCLOAK_ADMIN_USERNAME
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KEYCLOAK_ADMIN_USERNAME
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KEYCLOAK_ADMIN_PASSWORD
    - secretKey: KEYCLOAK_ADMIN_USER_PASSWORD
      remoteRef:
        key: {{ .Values.global.aws.secretsManager.name }}
        property: KEYCLOAK_ADMIN_USER_PASSWORD
{{- end }}
