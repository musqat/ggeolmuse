{{- if .Values.configServer.enabled }}
{{- include "ggeolmuse.serviceAccount" (dict "name" .Values.configServer.name "Values" .Values) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.configServer.name }}
  labels:
    app: {{ .Values.configServer.name }}
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.configServer.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.configServer.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.configServer.name }}
    spec:
      {{- if .Values.global.aws.serviceAccount.create }}
      serviceAccountName: {{ .Values.configServer.name }}
      {{- end }}
      # emptyDir 은 root 소유로 생긴다. fsGroup 이 있어야 10001 이 clone 할 수 있다.
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: git-clone
        image: alpine/git:v2.54.0
        command:
        - sh
        - -c
        - |
          cd /config-repo
          if [ -d .git ]; then
            # 디렉터리 주인은 root 인데 프로세스는 10001 이라 git 이 거부한다.
            # --global 은 읽기전용 루트의 $HOME 에 쓰려 해서 못 쓴다.
            git -c safe.directory=/config-repo pull
          else
            git clone --branch {{ .Values.configServer.git.label | default "main" }} {{ .Values.configServer.git.uri }} .
          fi
        securityContext:
          {{- include "ggeolmuse.securityContext" . | nindent 10 }}
        resources:
          {{- toYaml .Values.global.initContainer.resources | nindent 10 }}
        volumeMounts:
        - name: config-repo-volume
          mountPath: /config-repo
      containers:
      - name: {{ .Values.configServer.name }}
        image: {{ include "ggeolmuse.image" (dict "Values" .Values "repository" .Values.configServer.image.repository "tag" .Values.configServer.image.tag "Chart" .Chart) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.configServer.service.port }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.configServer.env.springProfiles | quote }}
        - name: SERVER_PORT
          value: {{ .Values.configServer.service.port | quote }}
        {{- if .Values.global.aws.secretsManager.enabled }}
        # 클라이언트가 쓰는 값과 같은 자리에서 읽는다. 여기가 비면 application.yml
        - name: CONFIG_SERVER_USERNAME
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: CONFIG_SERVER_USERNAME
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: CONFIG_SERVER_PASSWORD
        {{- end }}
        - name: JAVA_OPTS
          value: {{ include "ggeolmuse.otelJavaOpts" (dict "Values" .Values "serviceName" .Values.configServer.name "xmx" "128m") }}
        # UID 10001 은 홈이 없어 HOME 이 / 로 잡힌다. JGit 이 거기 설정을 쓴다
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: config-repo-volume
          mountPath: /config-repo
          readOnly: true
        {{- include "ggeolmuse.tmpVolumeMount" . | nindent 8 }}
        {{- if .Values.configServer.resources }}
        resources:
          {{- toYaml .Values.configServer.resources | nindent 10 }}
        {{- end }}
        securityContext:
          {{- include "ggeolmuse.securityContext" . | nindent 10 }}
        startupProbe:
          {{- include "ggeolmuse.startupProbe" (dict "port" 9090 "failureThreshold" .Values.configServer.probes.startup.failureThreshold "periodSeconds" .Values.configServer.probes.startup.periodSeconds) | nindent 10 }}
        readinessProbe:
          {{- include "ggeolmuse.readinessProbe" (dict "port" 9090 "initialDelaySeconds" .Values.configServer.probes.readiness.initialDelaySeconds "periodSeconds" .Values.configServer.probes.readiness.periodSeconds) | nindent 10 }}
        livenessProbe:
          {{- include "ggeolmuse.livenessProbe" (dict "port" 9090 "initialDelaySeconds" .Values.configServer.probes.liveness.initialDelaySeconds "periodSeconds" .Values.configServer.probes.liveness.periodSeconds) | nindent 10 }}
      volumes:
      - name: config-repo-volume
        emptyDir: {}
      {{- include "ggeolmuse.tmpVolume" . | nindent 6 }}
{{- end }}
