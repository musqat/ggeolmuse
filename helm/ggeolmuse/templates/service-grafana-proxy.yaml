{{- if .Values.ingress.enabled }}
---
# Grafana
apiVersion: v1
kind: Service
metadata:
  name: prometheus-grafana-proxy
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: prometheus-grafana.monitoring.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
