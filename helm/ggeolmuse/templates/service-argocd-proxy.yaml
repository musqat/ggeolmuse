{{- if .Values.ingress.enabled }}
---
#  ArgoCD
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-proxy
  namespace: default
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: argocd-server.argocd.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
