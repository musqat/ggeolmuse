{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      tier: {{ .Values.networkPolicy.businessServiceTier }}
  policyTypes:
  {{- range .Values.networkPolicy.policyTypes }}
  - {{ . }}
  {{- end }}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.networkPolicy.gatewayApp }}
    ports:
    {{- range .Values.networkPolicy.ports }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}

  - from:
    - podSelector:
        matchExpressions:
        - key: tier
          operator: In
          values:
          - {{ .Values.networkPolicy.businessServiceTier }}
    ports:
    {{- range .Values.networkPolicy.ports }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}

  # monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
    {{- if .Values.services.chatService.metrics.enabled }}
    - protocol: TCP
      port: {{ .Values.services.chatService.service.port }}
    {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.infrastructure.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-services
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.networkPolicy.gatewayApp }}
    - podSelector:
        matchLabels:
          tier: {{ .Values.networkPolicy.businessServiceTier }}
    ports:
    - protocol: TCP
      port: {{ .Values.infrastructure.redis.port }}
{{- end }}
{{- with .Values.networkPolicy.instanceMetadata }}
{{- if and $.Values.networkPolicy.enabled .block }}
---
# app 레이블이 있는 이 차트의 파드만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-instance-metadata
  labels:
    {{- include "ggeolmuse.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: Exists
    - key: app
      operator: NotIn
      values:
      {{- range .exemptApps }}
      - {{ . }}
      {{- end }}
  policyTypes:
    - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
{{- end }}
{{- end }}
{{- $np := .Values.networkPolicy }}
{{- $infra := .Values.infrastructure }}
{{- if and $np.enabled $np.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- if .Values.gatewayServer.enabled }}
---
# 게이트웨이: 인그레스 컨트롤러 · LoadBalancer 의 API 요청, monitoring 의 지표 수집
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-server
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $np.gatewayApp }}
  policyTypes:
    - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
    ports:
    - protocol: TCP
      port: {{ .Values.gatewayServer.service.port }}
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: {{ .Values.global.management.port }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
# 프론트엔드: 인그레스 컨트롤러 · LoadBalancer 의 화면 요청
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-web
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  policyTypes:
    - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.targetPort }}
{{- end }}
{{- if $infra.keycloak.enabled }}
---
# Keycloak: 인그레스 컨트롤러의 로그인 화면, 게이트웨이 · business 의 토큰 검증 키 · 서비스 토큰 · 사용자 관리
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
    - podSelector:
        matchLabels:
          app: {{ $np.gatewayApp }}
    - podSelector:
        matchLabels:
          tier: {{ $np.businessServiceTier }}
    ports:
    - protocol: TCP
      port: {{ $infra.keycloak.port }}
{{- end }}
{{- if .Values.configServer.enabled }}
---
# 설정 서버: 게이트웨이 · business 의 설정 요청 · 기동 대기 헬스 체크, monitoring 의 지표 수집
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-config-server
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.configServer.name }}
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ $np.gatewayApp }}
    - podSelector:
        matchLabels:
          tier: {{ $np.businessServiceTier }}
    ports:
    - protocol: TCP
      port: {{ .Values.configServer.service.port }}
    - protocol: TCP
      port: {{ .Values.global.management.port }}
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: {{ .Values.global.management.port }}
{{- end }}
{{- if $infra.kafka.enabled }}
---
# Kafka: business · Kafka UI · 토픽 초기화 Job · 브로커 자신의 내부 리스너(외부 리스너 포트는 열지 않음)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: {{ $np.businessServiceTier }}
    - podSelector:
        matchLabels:
          app: kafka-ui
    - podSelector:
        matchLabels:
          app: kafka-topics-init
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: {{ $infra.kafka.ports.internal }}
{{- end }}
{{- if $infra.zookeeper.enabled }}
---
# Zookeeper: Kafka · Kafka UI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-zookeeper
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: zookeeper
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kafka
    - podSelector:
        matchLabels:
          app: kafka-ui
    ports:
    - protocol: TCP
      port: {{ $infra.zookeeper.port }}
{{- end }}
{{- if $infra.kafkaUi.enabled }}
---
# Kafka UI: 인그레스 컨트롤러의 화면 요청
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ui
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kafka-ui
  policyTypes:
    - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
    ports:
    - protocol: TCP
      port: {{ $infra.kafkaUi.port }}
{{- end }}
{{- if $infra.tempo.enabled }}
---
# Tempo: 같은 네임스페이스 파드의 트레이스, monitoring 의 조회
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tempo
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: {{ $infra.tempo.ports.otlp }}
    - protocol: TCP
      port: {{ $infra.tempo.ports.otlpHttp }}
    - protocol: TCP
      port: {{ $infra.tempo.ports.zipkin }}
    - protocol: TCP
      port: {{ $infra.tempo.ports.jaeger }}
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 3200
{{- end }}
{{- end }}
