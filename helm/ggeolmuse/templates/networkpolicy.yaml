{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  labels:
    {{- include "ggeolmuse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      tier: {{ .Values.networkPolicy.businessServiceTier }}
  policyTypes:
  {{- range .Values.networkPolicy.policyTypes }}
  - {{ . }}
  {{- end }}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.networkPolicy.gatewayApp }}
    ports:
    {{- range .Values.networkPolicy.ports }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}

  - from:
    - podSelector:
        matchExpressions:
        - key: tier
          operator: In
          values:
          - {{ .Values.networkPolicy.businessServiceTier }}
    ports:
    {{- range .Values.networkPolicy.ports }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}

  # monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
{{- end }}
