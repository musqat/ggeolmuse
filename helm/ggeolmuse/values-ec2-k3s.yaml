# AWS EC2 K3s Single Node Production Values
# 단일 노드에 최적화된 설정

global:
  domain: ggeolmuse.com
  authDomain: ggeolmuse.com
  imageRegistry: muscathan
  imagePullPolicy: Always
  springProfiles: prod,no-file-logging

  # Management server port (Health, Metrics, Actuator)
  management:
    port: 9090

  keycloak:
    authServerUrl: http://keycloak:8080/auth
    publicUrl: https://ggeolmuse.com/auth

  kafka:
    enabled: true
    bootstrapServers: kafka:9092

  redis:
    enabled: true

  # OpenTelemetry - Tempo in monitoring namespace
  otel:
    enabled: true
    endpoint: http://tempo.monitoring.svc.cluster.local:4318
    protocol: http/protobuf
    tracesExporter: otlp
    metricsExporter: none
    logsExporter: none

# Ingress Controller - K3s에서 별도 설치
ingressController:
  enabled: false

# 인프라 - 단일 노드용 (replicas=1, 리소스 최적화)
infrastructure:
  redis:
    enabled: true
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  keycloak:
    enabled: true
    replicas: 1  # 단일 노드
    env:
      kcDbVendor: postgres
      kcHttpRelativePath: /auth
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m

  # PostgreSQL - Using AWS RDS (managed service)
  postgres:
    enabled: false  # RDS 사용으로 self-hosted postgres 비활성화

  zookeeper:
    enabled: true
    replicas: 1
    storage:
      data: 5Gi
      log: 5Gi
      storageClass: local-path
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  kafka:
    enabled: true
    replicas: 1
    storage:
      data: 10Gi
      storageClass: local-path
    resources:
      limits:
        memory: 1536Mi
        cpu: 750m
      requests:
        memory: 768Mi
        cpu: 400m

  kafkaUi:
    enabled: true  # Ingress를 통해 접근 가능하도록 활성화
    env:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    resources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        memory: 128Mi
        cpu: 100m

  tempo:
    enabled: false  # Tempo는 monitoring 네임스페이스에서 실행
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m

# Config Server
configServer:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.1.0"
  resources:
    limits:
      memory: 384Mi
      cpu: 300m
    requests:
      memory: 192Mi
      cpu: 150m

# Gateway Server
gatewayServer:
  enabled: true
  replicaCount: 1  # 단일 노드
  image:
    tag: "1.1.0"
  env:
    springProfiles: prod,no-file-logging
  probes:
    liveness:
      initialDelaySeconds: 300  # 5분으로 증가 (Keycloak JWK + Redis)
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 120  # 2분으로 증가
      periodSeconds: 10
  resources:
    limits:
      memory: 640Mi
      cpu: 600m
    requests:
      memory: 320Mi
      cpu: 300m

# 비즈니스 서비스
services:
  userService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.1.0"
    env:
      appBaseUrl: https://ggeolmuse.com
      appFrontendUrl: https://ggeolmuse.com
      mailVerificationBaseUrl: https://ggeolmuse.com
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가 (DB + Flyway)
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  tradeService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.1.0"
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  marketDataService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.1.0"
    env:
      TZ: "Asia/Seoul"  # 한국 시간대 설정 (UTC+9)
      # 마켓 데이터 프로바이더 설정
      MARKETDATA_PROVIDER: "alphavantage"
      # 심볼 수집 활성화
      MARKETDATA_SYMBOL_COLLECTION_ENABLED: "true"
      SYMBOL_LISTING_MAX: "0"  # 0 = 무제한
      SYMBOL_LISTING_ONLY_MAJOR: "true"  # NYSE, NASDAQ, NYSE ARCA 주요 거래소만
      SYMBOL_COLLECT_DATA: "false"  # 초기 수집 완료, 스케줄러로만 업데이트
      SYMBOL_INCLUDE_DIVIDENDS: "true"  # 배당 데이터 포함
      # 스케줄러 활성화 (초기 수집 완료)
      ALPHAVANTAGE_SCHEDULER_ZONE: "Asia/Seoul"  # 통합 시간대
      ALPHAVANTAGE_SCHEDULER_FX_CRON: "0 0 6 * * MON-FRI"  # 매일 오전 6시 KST (한국 평일, USD/KRW 환율)
      ALPHAVANTAGE_SCHEDULER_CANDLE_CRON: "0 0 6 * * TUE-SAT"  # 오전 6시 KST (미국 월~금 거래일 데이터)
      ALPHAVANTAGE_SCHEDULER_MARKETCAP_CRON: "0 10 6 * * TUE-SAT"  # 오전 6시 10분 KST (미국 월~금 거래일 데이터)
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 60  # 최대 10분
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 1280Mi
        cpu: 700m
      requests:
        memory: 640Mi
        cpu: 350m

  backtestService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.1.0"
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

# 프론트엔드
frontend:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.0.3"
  env:
    apiUrl: https://ggeolmuse.com/api
    keycloakUrl: https://ggeolmuse.com/auth
    keycloakRealm: muscathan
    keycloakClientId: ggeolmuse-frontend
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

# Ingress - CloudFlare와 통합
ingress:
  enabled: true
  className: traefik
  annotations: {}

  hosts:
    - host: ggeolmuse.com
      paths:
        # API Gateway 라우팅
        - path: /api
          pathType: Prefix
          backend:
            service: gateway-server
            port: 8070

        # Keycloak 인증 서버
        - path: /auth
          pathType: Prefix
          backend:
            service: keycloak
            port: 8080

        # Grafana 모니터링 대시보드
        - path: /grafana
          pathType: Prefix
          backend:
            service: prometheus-grafana
            port: 80
            namespace: monitoring

        # Kafka UI
        - path: /kafka-ui
          pathType: Prefix
          backend:
            service: kafka-ui
            port: 8080

        # ArgoCD GitOps
        - path: /argocd
          pathType: Prefix
          backend:
            service: argocd-server
            port: 80
            namespace: argocd

        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service: frontend-web
            port: 3000

  # TLS는 CloudFlare에서 처리 (Flexible SSL)
  tls: []

# 네트워크 정책
networkPolicy:
  enabled: true

# Secrets - AWS Secrets Manager에서 가져온 값
secrets:
  enabled: false
  name: ggeolmuse-secrets
