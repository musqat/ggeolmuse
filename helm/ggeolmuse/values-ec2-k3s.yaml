# AWS EC2 K3s Single Node Production Values
# 단일 노드에 최적화된 설정

global:
  domain: ggeolmuse.com
  authDomain: ggeolmuse.com
  imageRegistry: muscathan
  imagePullPolicy: Always
  springProfiles: prod,no-file-logging

  # Management server port (Health, Metrics, Actuator)
  management:
    port: 9090

  keycloak:
    authServerUrl: http://keycloak:8080
    publicUrl: https://ggeolmuse.com/auth

  kafka:
    enabled: true
    bootstrapServers: kafka:9092

  redis:
    enabled: true

  # OpenTelemetry - Tempo in monitoring namespace
  otel:
    enabled: true
    endpoint: http://tempo.monitoring.svc.cluster.local:4318
    protocol: http/protobuf
    tracesExporter: otlp
    metricsExporter: none
    logsExporter: none

# Ingress Controller - K3s에서 별도 설치
ingressController:
  enabled: false

# 인프라 - 단일 노드용 (replicas=1, 리소스 최적화)
infrastructure:
  redis:
    enabled: true
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  keycloak:
    enabled: true
    replicas: 1  # 단일 노드
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m

  # PostgreSQL - Using AWS RDS (managed service)
  postgres:
    enabled: false  # RDS 사용으로 self-hosted postgres 비활성화

  zookeeper:
    enabled: true
    replicas: 1
    storage:
      data: 5Gi
      log: 5Gi
      storageClass: local-path
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  kafka:
    enabled: true
    replicas: 1
    storage:
      data: 10Gi
      storageClass: local-path
    resources:
      limits:
        memory: 1536Mi
        cpu: 750m
      requests:
        memory: 768Mi
        cpu: 400m

  kafkaUi:
    enabled: false  # 프로덕션에서 비활성화

  tempo:
    enabled: true
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

# Config Server
configServer:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.0.0"
  resources:
    limits:
      memory: 384Mi
      cpu: 300m
    requests:
      memory: 192Mi
      cpu: 150m

# Gateway Server
gatewayServer:
  enabled: true
  replicaCount: 1  # 단일 노드
  image:
    tag: "1.0.2"
  env:
    springProfiles: prod,no-file-logging
  probes:
    liveness:
      initialDelaySeconds: 300  # 5분으로 증가 (Keycloak JWK + Redis)
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 120  # 2분으로 증가
      periodSeconds: 10
  resources:
    limits:
      memory: 640Mi
      cpu: 600m
    requests:
      memory: 320Mi
      cpu: 300m

# 비즈니스 서비스
services:
  userService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.0.7"
    env:
      appBaseUrl: https://ggeolmuse.com
      appFrontendUrl: https://ggeolmuse.com
      mailVerificationBaseUrl: https://ggeolmuse.com
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가 (DB + Flyway)
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  tradeService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.0.8"
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  marketDataService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.0.7"
    env:
      SYMBOL_LISTING_MAX: "0"  # 0 = 무제한 (전체 Stock + ETF)
      SYMBOL_LISTING_ONLY_MAJOR: "true"  # NYSE, NASDAQ 등 주요 거래소만
      SYMBOL_LOOKBACK_DAYS: "3650"  # 10년치 데이터 수집
      SYMBOL_COLLECT_DATA: "true"  # 캔들 데이터 수집 활성화
      SYMBOL_INCLUDE_DIVIDENDS: "true"  # 배당 데이터 포함
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 60  # 최대 10분
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 1280Mi
        cpu: 700m
      requests:
        memory: 640Mi
        cpu: 350m

  backtestService:
    enabled: true
    replicaCount: 1
    image:
      tag: "1.0.5"
    probes:
      liveness:
        initialDelaySeconds: 300  # 5분으로 증가
        periodSeconds: 20
      readiness:
        initialDelaySeconds: 120  # 2분으로 증가
        periodSeconds: 10
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

# 프론트엔드
frontend:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.0.2"
  env:
    apiUrl: https://ggeolmuse.com/api
    keycloakUrl: https://ggeolmuse.com/auth
    keycloakRealm: muscathan
    keycloakClientId: ggeolmuse-frontend
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

# Ingress - CloudFlare와 통합
ingress:
  enabled: true
  className: traefik
  annotations:
    # CloudFlare SSL 설정
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # CORS 설정
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # 타임아웃 설정
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

  hosts:
    - host: ggeolmuse.com
      paths:
        # API Gateway 라우팅
        - path: /api
          pathType: Prefix
          backend:
            service: gateway-server
            port: 8070

        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service: frontend-web
            port: 3000

  # TLS는 CloudFlare에서 처리 (Flexible SSL)
  tls: []

# 네트워크 정책
networkPolicy:
  enabled: true

# Secrets - AWS Secrets Manager에서 가져온 값
secrets:
  enabled: false
  name: ggeolmuse-secrets
