# 멀티 노드 kubeadm 덧붙임(values-prod.yaml 다음)
global:
  podDisruptionBudget:
    enabled: true
  # 레플리카 둘은 반드시 다른 워커에, 멈춘 워커는 셈에서 빼 남은 워커에 몰아 띄움
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
  # 워커가 멈추면 1분 뒤 다른 워커로(기본 5분)
  nodeLostTolerationSeconds: 60
  preStopSleepSeconds: 5

infrastructure:
  # jdbc-ping 캐시 클러스터(keycloak 26 기본)
  keycloak:
    replicas: 2
  zookeeper:
    storage:
      storageClassName: gp3
  kafka:
    storage:
      storageClassName: gp3

# 외부 요청은 envoy-gateway-system 의 Envoy 프록시가 넘김
networkPolicy:
  ingressNamespace: envoy-gateway-system

# 상태 없는 앱은 워커마다 하나씩
configServer:
  replicaCount: 2

gatewayServer:
  replicaCount: 2

services:
  userService:
    replicaCount: 2
  tradeService:
    replicaCount: 2
  marketDataService:
    replicaCount: 2
  backtestService:
    replicaCount: 2
  chatService:
    replicaCount: 2

frontend:
  replicaCount: 2

# 외부 진입은 Gateway API(컨트롤러는 Envoy Gateway)
ingress:
  kind: Gateway
  className: envoy
  gateway:
    replicas: 2
  hosts:
    - paths:
        - path: /api
          backend:
            service: gateway-server
            port: 8070
        - path: /auth
          backend:
            service: keycloak
            port: 8080
        - path: /kafka-ui
          backend:
            service: kafka-ui
            port: 8090
        - path: /
          backend:
            service: frontend-web
            port: 3000
  subdomains:
    - name: argocd
      namespace: argocd
      service: argocd-server
      port: 80
    - name: grafana
      namespace: monitoring
      service: prometheus-grafana
      port: 80
