# prod 전용 오버라이드만 정의. 나머지는 base values.yaml에서 상속(deep merge).
global:
  domain: ggeolmuse.com
  authDomain: ggeolmuse.com
  springProfiles: prod

  keycloak:
    authServerUrl: http://keycloak:8080/auth
    publicUrl: https://ggeolmuse.com/auth

  # OpenTelemetry - Tempo in monitoring namespace
  otel:
    endpoint: http://tempo.monitoring.svc.cluster.local:4318

  # AWS Secrets Manager
  aws:
    enabled: true
    secretsManager:
      enabled: true

# Ingress Controller - K3s Traefik 사용
ingressController:
  enabled: false

# 인프라 - 단일 노드 최적화 (prod 오버라이드만, 나머지 base 상속)
infrastructure:
  redis:
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  keycloak:
    env:
      kcDbVendor: postgres  # RDS PostgreSQL 사용
      kcHttpRelativePath: /auth
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m

  # PostgreSQL - AWS RDS 사용
  postgres:
    enabled: false

  zookeeper:
    storage:
      data: 5Gi
      log: 5Gi
      storageClass: local-path
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  kafka:
    env:
      logRetentionHours: 120
      logSegmentBytes: "536870912"
      heapOpts: "-Xms512m -Xmx896m"
    storage:
      data: 10Gi
      storageClass: local-path
    resources:
      limits:
        memory: 1280Mi
        cpu: 750m
      requests:
        memory: 640Mi
        cpu: 400m

  kafkaUi:
    env:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    resources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        memory: 128Mi
        cpu: 100m

  tempo:
    enabled: false  # Tempo는 monitoring 네임스페이스에서 별도 실행
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m

# Config Server
configServer:
  enabled: true
  name: config-server
  replicaCount: 1  # 단일 노드
  image:
    repository: config-server
    tag: "1.1.3"
  service:
    type: ClusterIP
    port: 8888
  git:
    uri: https://github.com/musqat/ggeolmuse-config.git
    label: main
    searchPaths: .
  env:
    springProfiles: git,prod
  probes:
    readiness:
      initialDelaySeconds: 60
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 15
  resources:
    limits:
      memory: 320Mi
      cpu: 300m
    requests:
      memory: 160Mi
      cpu: 150m

# Gateway Server
gatewayServer:
  enabled: true
  name: gateway-server
  replicaCount: 1
  image:
    repository: gateway-server
    tag: "1.1.4"
  service:
    type: LoadBalancer
    port: 8070
  env:
    springProfiles: prod
    configUri: http://config-server:8888
    configUsername: config
  rbac:
    create: true
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  probes:
    readiness:
      initialDelaySeconds: 120  # 2분 (Keycloak JWK + Redis)
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 300  # 5분
      periodSeconds: 20
  resources:
    limits:
      memory: 512Mi
      cpu: 600m
    requests:
      memory: 256Mi
      cpu: 300m

# 비즈니스 서비스
services:
  userService:
    enabled: true
    name: user-service
    replicaCount: 1
    image:
      repository: user-service
      tag: "1.1.3"
    service:
      type: ClusterIP
      port: 8080
    labels:
      tier: business-service
    env:
      appBaseUrl: https://ggeolmuse.com
      appFrontendUrl: https://ggeolmuse.com
      mailVerificationBaseUrl: https://ggeolmuse.com
    secrets:
      keycloakSecret: true
      mailUsername: true
      mailPassword: true
      mailFrom: true
    probes:
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 600
        periodSeconds: 20
    resources:
      limits:
        memory: 1024Mi
        cpu: 600m
      requests:
        memory: 512Mi
        cpu: 300m

  tradeService:
    enabled: true
    name: trade-service
    replicaCount: 1
    image:
      repository: trade-service
      tag: "1.1.3"
    service:
      type: ClusterIP
      port: 8081
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    probes:
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 600
        periodSeconds: 20
    resources:
      limits:
        memory: 1024Mi
        cpu: 600m
      requests:
        memory: 512Mi
        cpu: 300m

  marketDataService:
    enabled: true
    name: market-data-service
    replicaCount: 1
    image:
      repository: market-data-service
      tag: "1.1.4"
    service:
      type: ClusterIP
      port: 8083
    labels:
      tier: business-service
    env:
      TZ: "Asia/Seoul"
      # 마켓 데이터 설정
      MARKETDATA_PROVIDER: "yahoo"
      SYMBOL_COLLECTION_ENABLED: "true"
      SYMBOL_COLLECT_DATA: "false"
      # 심볼 수집 최대 개수 (0 = 무제한, 기본값 100)
      SYMBOL_LISTING_MAX: "0"
    secrets:
      keycloakSecret: true
      koreaexImApiKey: true
    probes:
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 10
        timeoutSeconds: 3
      liveness:
        initialDelaySeconds: 600
        periodSeconds: 20
    resources:
      limits:
        memory: 1280Mi
        cpu: 700m
      requests:
        memory: 640Mi
        cpu: 350m

  backtestService:
    enabled: true
    name: backtest-service
    replicaCount: 1
    image:
      repository: backtest-service
      tag: "1.1.5"
    service:
      type: ClusterIP
      port: 8082
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    probes:
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 600
        periodSeconds: 20
    resources:
      limits:
        memory: 896Mi
        cpu: 600m
      requests:
        memory: 448Mi
        cpu: 300m

  chatService:
    enabled: true
    name: chat-service
    replicaCount: 1
    image:
      repository: chat-service
      tag: "1.0.2"
    service:
      type: ClusterIP
      port: 8000
    labels:
      tier: business-service
    probes:
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 20
    resources:
      limits:
        memory: 512Mi
        cpu: 400m
      requests:
        memory: 256Mi
        cpu: 200m

# 프론트엔드
frontend:
  enabled: true
  name: frontend-web
  replicaCount: 1
  image:
    repository: frontend-web
    tag: "1.1.4"
  service:
    type: LoadBalancer
    port: 3000
    targetPort: 80
  env:
    apiUrl: https://ggeolmuse.com/api
    keycloakUrl: https://ggeolmuse.com/auth
    keycloakRealm: muscathan
    keycloakClientId: ggeolmuse-frontend
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

# 네트워크 정책
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  businessServiceTier: business-service
  gatewayApp: gateway-server
  ports:
    - 8000
    - 8080
    - 8081
    - 8082
    - 8083

# Ingress - Traefik with CloudFlare
ingress:
  enabled: true
  className: traefik
  annotations: {}  # CloudFlare에서 SSL 처리

  hosts:
    - host: ggeolmuse.com
      paths:
        # API Gateway 라우팅
        - path: /api
          pathType: Prefix
          backend:
            service: gateway-server
            port: 8070

        # Keycloak 인증 서버
        - path: /auth
          pathType: Prefix
          backend:
            service: keycloak
            port: 8080

        # Kafka UI
        - path: /kafka-ui
          pathType: Prefix
          backend:
            service: kafka-ui
            port: 8080

        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service: frontend-web
            port: 3000

  # TLS는 CloudFlare에서 처리 (Flexible SSL)
  tls: []

# Secret 설정
secrets:
  enabled: false
  name: ggeolmuse-secrets
  data: {}

# ConfigMap 설정
configMap:
  enabled: true
  data:
    appBaseUrl: "https://ggeolmuse.com"
    oauthRedirectUri: "https://ggeolmuse.com/api/auth/social/google/callback"
    emailExpiryHours: "24"
    exchangeRateMin: "0"
    exchangeRateMax: "3000"
    exchangeRateFallback: "1300.00"
    redisHost: "redis"
    redisPort: "6379"
    redisPassword: ""

# Monitoring - Prometheus ServiceMonitor
monitoring:
  serviceMonitor:
    enabled: true
