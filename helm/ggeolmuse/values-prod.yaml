# Production Environment Configuration
global:
  domain: ggeolmuse.com
  authDomain: ggeolmuse.com
  imageRegistry: muscathan
  imagePullPolicy: Always
  springProfiles: prod

  # Management server port (Health, Metrics, Actuator)
  management:
    port: 9090

  keycloak:
    authServerUrl: http://keycloak:8080/auth
    publicUrl: https://ggeolmuse.com/auth
    realm: muscathan
    clientId: ggeolmuse-client
    frontendClientId: ggeolmuse-frontend

  redis:
    host: redis
    port: 6379
    healthCheckEnabled: false

  kafka:
    enabled: true
    bootstrapServers: kafka:9092
    consumer:
      groupIdPrefix: ggeolmuse
      autoOffsetReset: earliest
      enableAutoCommit: false
    producer:
      acks: all
      retries: 3
      compressionType: snappy

  # OpenTelemetry - Tempo in monitoring namespace
  otel:
    enabled: true
    endpoint: http://tempo.monitoring.svc.cluster.local:4318
    protocol: http/protobuf
    tracesExporter: otlp
    metricsExporter: none
    logsExporter: none
    serviceName: ""

  # AWS Secrets Manager
  aws:
    enabled: true
    region: ap-northeast-2
    secretsManager:
      enabled: true
      name: ggeolmuse/production
    serviceAccount:
      create: true
      # annotations:
      #   eks.amazonaws.com/role-arn: arn:aws:iam::111071843009:role/ggeolmuse-secrets-role

# Ingress Controller - K3s Traefik 사용
ingressController:
  enabled: false

# 인프라 - 단일 노드 최적화 (replicas=1, 리소스 제한)
infrastructure:
  redis:
    enabled: true
    image: redis:7-alpine
    port: 6379
    service:
      type: ClusterIP
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:23.0
    port: 8080
    replicas: 1  # 단일 노드
    env:
      # Keycloak admin credentials는 Secret에서 주입
      kcDbVendor: postgres  # RDS PostgreSQL 사용
      kcHttpRelativePath: /auth
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m

  # PostgreSQL - AWS RDS 사용
  postgres:
    enabled: false

  zookeeper:
    enabled: true
    image: confluentinc/cp-zookeeper:7.6.0
    port: 2181
    replicas: 1
    env:
      clientPort: 2181
      tickTime: 2000
      syncLimit: 2
    service:
      type: ClusterIP
      port: 2181
    storage:
      data: 5Gi
      log: 5Gi
      storageClass: local-path
    resources:
      limits:
        memory: 384Mi
        cpu: 300m
      requests:
        memory: 192Mi
        cpu: 150m

  kafka:
    enabled: true
    image: confluentinc/cp-kafka:7.6.0
    replicas: 1
    ports:
      internal: 9092
      external: 9094
    env:
      brokerId: 1
      zookeeperConnect: zookeeper:2181
      offsetsTopicReplicationFactor: 1
      transactionStateLogMinIsr: 1
      transactionStateLogReplicationFactor: 1
      autoCreateTopicsEnable: true
      logRetentionHours: 168
      logSegmentBytes: "1073741824"
    service:
      internal:
        type: ClusterIP
        port: 9092
      external:
        type: NodePort
        port: 9094
        nodePort: 30094
    storage:
      data: 10Gi
      storageClass: local-path
    topicsInit:
      enabled: true
    resources:
      limits:
        memory: 1536Mi
        cpu: 750m
      requests:
        memory: 768Mi
        cpu: 400m

  kafkaUi:
    enabled: true
    image: provectuslabs/kafka-ui:latest
    replicas: 1
    port: 8080
    env:
      clustersName: ggeolmuse
      bootstrapServers: kafka:9092
      zookeeper: zookeeper:2181
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    service:
      type: ClusterIP
      port: 8090
    resources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        memory: 128Mi
        cpu: 100m

  tempo:
    enabled: false  # Tempo는 monitoring 네임스페이스에서 별도 실행
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m

# Config Server
configServer:
  enabled: true
  name: config-server
  replicaCount: 1  # 단일 노드
  image:
    repository: config-server
    tag: "1.1.0"
  service:
    type: ClusterIP
    port: 8888
  git:
    uri: https://github.com/musqat/ggeolmuse-config.git
    label: main
    searchPaths: .
  env:
    springProfiles: git,prod
  probes:
    readiness:
      initialDelaySeconds: 60
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    limits:
      memory: 384Mi
      cpu: 300m
    requests:
      memory: 192Mi
      cpu: 150m

# Gateway Server
gatewayServer:
  enabled: true
  name: gateway-server
  replicaCount: 1  # 단일 노드
  image:
    repository: gateway-server
    tag: "1.1.0"
  service:
    type: LoadBalancer
    port: 8070
  env:
    springProfiles: prod
    configUri: http://config-server:8888
    configUsername: config
  rbac:
    create: true
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  probes:
    readiness:
      initialDelaySeconds: 120  # 2분 (Keycloak JWK + Redis)
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 300  # 5분
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    limits:
      memory: 640Mi
      cpu: 600m
    requests:
      memory: 320Mi
      cpu: 300m

# 비즈니스 서비스
services:
  userService:
    enabled: true
    name: user-service
    replicaCount: 1  # 단일 노드
    image:
      repository: user-service
      tag: "1.1.0"
    service:
      type: ClusterIP
      port: 8080
    labels:
      tier: business-service
    env:
      appBaseUrl: https://ggeolmuse.com
      appFrontendUrl: https://ggeolmuse.com
      mailVerificationBaseUrl: https://ggeolmuse.com
    secrets:
      keycloakSecret: true
      mailUsername: true
      mailPassword: true
      mailFrom: true
    probes:
      readiness:
        initialDelaySeconds: 120  # 2분 (DB + Flyway migration)
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        initialDelaySeconds: 300  # 5분
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  tradeService:
    enabled: true
    name: trade-service
    replicaCount: 1
    image:
      repository: trade-service
      tag: "1.1.0"
    service:
      type: ClusterIP
      port: 8081
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    probes:
      readiness:
        initialDelaySeconds: 120  # 2분
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        initialDelaySeconds: 300  # 5분
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

  marketDataService:
    enabled: true
    name: market-data-service
    replicaCount: 1
    image:
      repository: market-data-service
      tag: "1.1.0"
    service:
      type: ClusterIP
      port: 8083
    labels:
      tier: business-service
    env:
      TZ: "Asia/Seoul"
      # 마켓 데이터 프로바이더 설정
      MARKETDATA_PROVIDER: "alphavantage"
      # 심볼 수집 활성화
      MARKETDATA_SYMBOL_COLLECTION_ENABLED: "true"
      SYMBOL_LISTING_MAX: "0"  # 0 = 무제한
      SYMBOL_LISTING_ONLY_MAJOR: "true"  # NYSE, NASDAQ, NYSE ARCA 주요 거래소만
      SYMBOL_COLLECT_DATA: "false"  # 초기 수집 완료, 스케줄러로만 업데이트
      SYMBOL_INCLUDE_DIVIDENDS: "true"
      # 스케줄러 설정 (한국 시간대)
      ALPHAVANTAGE_SCHEDULER_ZONE: "Asia/Seoul"
      ALPHAVANTAGE_SCHEDULER_FX_CRON: "0 0 6 * * MON-FRI"  # 매일 오전 6시 KST
      ALPHAVANTAGE_SCHEDULER_CANDLE_CRON: "0 0 6 * * TUE-SAT"  # 오전 6시 KST
      ALPHAVANTAGE_SCHEDULER_MARKETCAP_CRON: "0 10 6 * * TUE-SAT"  # 오전 6시 10분 KST
    secrets:
      keycloakSecret: true
      alphavantageApiKey: true
      koreaexImApiKey: true
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 60  # 최대 10분
      readiness:
        initialDelaySeconds: 120  # 2분
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        initialDelaySeconds: 300  # 5분
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      limits:
        memory: 1280Mi
        cpu: 700m
      requests:
        memory: 640Mi
        cpu: 350m

  backtestService:
    enabled: true
    name: backtest-service
    replicaCount: 1
    image:
      repository: backtest-service
      tag: "1.1.0"
    service:
      type: ClusterIP
      port: 8082
    labels:
      tier: business-service
    env: {}
    secrets:
      keycloakSecret: true
    probes:
      readiness:
        initialDelaySeconds: 120  # 2분
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        initialDelaySeconds: 300  # 5분
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      limits:
        memory: 640Mi
        cpu: 600m
      requests:
        memory: 320Mi
        cpu: 300m

# 프론트엔드
frontend:
  enabled: true
  name: frontend-web
  replicaCount: 1
  image:
    repository: frontend-web
    tag: "1.0.3"
  service:
    type: LoadBalancer
    port: 3000
    targetPort: 80
  env:
    apiUrl: https://ggeolmuse.com/api
    keycloakUrl: https://ggeolmuse.com/auth
    keycloakRealm: muscathan
    keycloakClientId: ggeolmuse-frontend
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

# 네트워크 정책
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  businessServiceTier: business-service
  gatewayApp: gateway-server
  ports:
    - 8080
    - 8081
    - 8082
    - 8083

# Ingress - Traefik with CloudFlare
ingress:
  enabled: true
  className: traefik
  annotations: {}  # CloudFlare에서 SSL 처리

  hosts:
    - host: ggeolmuse.com
      paths:
        # API Gateway 라우팅
        - path: /api
          pathType: Prefix
          backend:
            service: gateway-server
            port: 8070

        # Keycloak 인증 서버
        - path: /auth
          pathType: Prefix
          backend:
            service: keycloak
            port: 8080

        # Kafka UI
        - path: /kafka-ui
          pathType: Prefix
          backend:
            service: kafka-ui
            port: 8080

        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service: frontend-web
            port: 3000

  # TLS는 CloudFlare에서 처리 (Flexible SSL)
  tls: []

# Secret 설정
secrets:
  enabled: false  # Production에서는 외부 Secret 사용
  name: ggeolmuse-secrets
  data: {}  # 외부에서 Secret 생성 필요

# ConfigMap 설정
configMap:
  enabled: true
  data:
    appBaseUrl: "https://ggeolmuse.com"
    oauthRedirectUri: "https://ggeolmuse.com/api/auth/social/google/callback"
    emailExpiryHours: "24"
    exchangeRateMin: "0"
    exchangeRateMax: "3000"
    exchangeRateFallback: "1300.00"
    redisHost: "redis"
    redisPort: "6379"
    redisPassword: ""

# Monitoring - Prometheus ServiceMonitor
monitoring:
  serviceMonitor:
    enabled: true
