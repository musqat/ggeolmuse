# 로컬 스택 메트릭 수집
# 대상은 서비스마다 management 포트 9090 의 /actuator/prometheus
# (ggeolmuse-config/application.yml)

global:
  # 부하 테스트용 5초 수집(기본 60초면 짧은 스파이크가 점 하나)
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ggeolmuse
    # 기본값 /metrics 대신 actuator 경로(타겟 DOWN 이면 먼저 볼 곳)
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:9090
          - gateway-server:9090
          - user-service:9090
          - trade-service:9090
          - market-data-service:9090
          - backtest-service:9090
    relabel_configs:
      # 주소의 호스트만 service 라벨로(범례 줄이기)
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'

  # 수집기 자신(수집 밀림 확인)
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
