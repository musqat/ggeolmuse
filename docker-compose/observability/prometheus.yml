# 로컬 스택 메트릭 수집.
# 각 서비스는 management 포트 9090에서 /actuator/prometheus 를 이미 열어둔다
# (ggeolmuse-config/application.yml)

global:
  # 부하 테스트 중에는 초 단위로 그래프가 움직여야 의미가 있다.
  # 기본값 60s면 30초짜리 스파이크가 점 하나로 뭉개진다.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ggeolmuse
    # 기본값이 /metrics 라 반드시 덮어써야 한다. 타겟이 DOWN이면 여기부터 의심.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:9090
          - gateway-server:9090
          - user-service:9090
          - trade-service:9090
          - market-data-service:9090
          - backtest-service:9090
    relabel_configs:
      # instance 라벨이 host:port 로 남으면 범례가 길어진다.
      # 호스트만 뽑아 service 라벨로 쓴다.
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'

  # 수집기 자신. 수집이 밀리는지 확인할 때 쓴다.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
