# 로컬 트레이스 저장소, 로컬 디스크 · 짧은 보관(부하 테스트 한 번 보고 버림)

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # 자바 OTel 에이전트가 쓰는 HTTP(4318)
        http:
          endpoint: 0.0.0.0:4318
        # grpc(지금은 안 씀)
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # 방금 보낸 트레이스를 빨리 검색되게
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
