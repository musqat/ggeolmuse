# Grafana 기동 때 자동 등록하는 데이터소스(/etc/grafana/provisioning/datasources/ 에 마운트)

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # 컨테이너 네트워크 안 주소(호스트에서는 9091)
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # 트레이스 구간에서 메트릭으로 바로 가기
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
