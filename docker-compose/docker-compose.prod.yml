version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ggeolmuse-postgres
    environment:
      POSTGRES_DB: ggeolmuse
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ggeolmuse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ggeolmuse-redis
    ports:
      - "6379:6379"
    networks:
      - ggeolmuse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ggeolmuse-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${DOMAIN_NAME}
      KC_PROXY: edge
    command: start
    ports:
      - "8080:8080"
    networks:
      - ggeolmuse-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ggeolmuse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ggeolmuse-network
    restart: unless-stopped

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ggeolmuse-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - ggeolmuse-network
    depends_on:
      - zookeeper
    restart: unless-stopped

  # Config Server
  config-server:
    image: muscathan/config-server:1.2.4
    container_name: ggeolmuse-config-server
    environment:
      SPRING_PROFILES_ACTIVE: git,no-file-logging
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/musqat/ggeolmuse-config.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
    ports:
      - "8888:8888"
    networks:
      - ggeolmuse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Gateway Server
  gateway-server:
    image: muscathan/gateway-server:1.3.1
    container_name: ggeolmuse-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod,no-file-logging
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
    ports:
      - "8070:8070"
    networks:
      - ggeolmuse-network
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  # User Service
  user-service:
    image: muscathan/user-service:1.2.6
    container_name: ggeolmuse-user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod,no-file-logging
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - ggeolmuse-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Trade Service
  trade-service:
    image: muscathan/trade-service:1.2.5
    container_name: ggeolmuse-trade-service
    environment:
      SPRING_PROFILES_ACTIVE: prod,no-file-logging
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - ggeolmuse-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Market Data Service
  market-data-service:
    image: muscathan/market-data-service:1.3.9
    container_name: ggeolmuse-market-data
    environment:
      SPRING_PROFILES_ACTIVE: prod,no-file-logging
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    networks:
      - ggeolmuse-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Backtest Service
  backtest-service:
    image: muscathan/backtest-service:1.3.4
    container_name: ggeolmuse-backtest
    environment:
      SPRING_PROFILES_ACTIVE: prod,no-file-logging
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - ggeolmuse-network
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Frontend Web
  frontend-web:
    image: muscathan/frontend-web:1.2.10
    container_name: ggeolmuse-frontend
    environment:
      VITE_API_URL: https://${DOMAIN_NAME}/api
      VITE_KEYCLOAK_URL: https://${DOMAIN_NAME}/auth
      VITE_KEYCLOAK_REALM: muscathan
      VITE_KEYCLOAK_CLIENT_ID: ggeolmuse-frontend
    ports:
      - "3000:80"
    networks:
      - ggeolmuse-network
    depends_on:
      - gateway-server
    restart: unless-stopped

networks:
  ggeolmuse-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
