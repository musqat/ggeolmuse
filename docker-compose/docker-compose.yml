services:

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ggeolmuse-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: ggeolmuse-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "7001:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/muscathan-realm.json:/opt/keycloak/data/import/muscathan-realm.json:ro
    command: start-dev --import-realm
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m


  # Config Server
  config-server:
    image: config-server:1.2.2
    container_name: ggeolmuse-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native,dev
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Gateway
  gateway-server:
    image: gateway-server:1.2.2
    container_name: ggeolmuse-gateway-server
    ports:
      - "8070:8070"
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      SERVER_PORT: 8070
      SPRING_MAIN_WEB_APPLICATION_TYPE: reactive
      SPRING_CLOUD_CONFIG_ENABLED: false
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["NONE"]
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  #### BUSINESS MICROSERVICES ####

  # User Management Service
  user-service:
    image: user-service:1.2.2
    container_name: ggeolmuse-user-service
    ports:
      - "8080:8080"
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JAVA_OPTS: "-Dh2.webAllowOthers=true"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      gateway-server:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Trade Service
  trade-service:
    image: trade-service:1.2.2
    container_name: ggeolmuse-trade-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: "trade-service"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health", "||", "exit", "1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Market Data Service
  market-data-service:
    image: market-data-service:1.2.2
    container_name: ggeolmuse-market-data-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: "market-data-service"
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY:-demo}
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health", "||", "exit", "1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Backtest Service
  backtest-service:
    image: backtest-service:1.2.2
    container_name: ggeolmuse-backtest-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: "backtest-service"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health", "||", "exit", "1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

# VOLUMES
volumes:
  redis_data:
    driver: local
  keycloak_data:
    driver: local

# NETWORKS

networks:
  ggeolmuse-network:
    driver: bridge
    name: ggeolmuse-network
