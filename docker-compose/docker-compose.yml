services:

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ggeolmuse-redis
    ports:
      - "6379:6379"
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ggeolmuse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ggeolmuse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Keycloak (로컬: realm import)
  #   KC_HOSTNAME_URL 로 issuer를 항상 http://localhost:8080 으로 고정 발급.
  #   => 브라우저는 localhost:8080 그대로 접속, 백엔드는 내부 keycloak:8080 으로 키(JWKS) fetch.
  #      hosts 파일 수정 불필요.
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ggeolmuse-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/custom-realm.json:/opt/keycloak/data/import/custom-realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # Config Server (외부 public git repo에서 서비스 설정 로드)
  config-server:
    build:
      context: ..
      dockerfile: backend/config-server/Dockerfile
    image: ggeolmuse-local/config-server:latest
    container_name: ggeolmuse-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: git
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/musqat/ggeolmuse-config.git}
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-main}
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Gateway
  gateway-server:
    build:
      context: ..
      dockerfile: backend/gateway-server/Dockerfile
    image: ggeolmuse-local/gateway-server:latest
    container_name: ggeolmuse-gateway-server
    ports:
      - "8070:8070"
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      SERVER_PORT: 8070
      # config repo 기본값은 k8s 내부 주소라 로컬에서 안 잡힌다.
      # spring.config.import 방식이라 환경변수가 원격 설정을 이긴다.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_MAIN_WEB_APPLICATION_TYPE: reactive
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: dev
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
    healthcheck:
      test: ["NONE"]
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  #### BUSINESS MICROSERVICES ####

  # User Management Service (시드 admin 자동 생성: admin@test.com / Admin123!)
  user-service:
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    image: ggeolmuse-local/user-service:latest
    container_name: ggeolmuse-user-service
    ports:
      # host 8080은 keycloak이 사용 → user-service는 8085로 노출(내부는 8080, gateway가 라우팅)
      - "8085:8080"
    environment:
      JAVA_OPTS: "-Dh2.webAllowOthers=true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # 시드 admin 계정 (로컬 체험용 더미)
      APP_ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: Admin123!
      # config-server를 non-optional + retry로 가져옴 (초기 부팅 DNS race 방지). 로컬은 AWS 미사용.
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS: "20"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: "2000"
      SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL: "10000"
      # JWT: issuer는 브라우저 발급값(localhost) 문자열 검증, 키는 내부 keycloak에서 fetch
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/custom
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/custom/protocol/openid-connect/certs
      MAIL_USERNAME: ${MAIL_USERNAME:-local@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local-dummy}
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Trade Service
  trade-service:
    build:
      context: ..
      dockerfile: backend/trade-service/Dockerfile
    image: ggeolmuse-local/trade-service:latest
    container_name: ggeolmuse-trade-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: "trade-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/custom
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/custom/protocol/openid-connect/certs
      # dev는 H2 + ddl-auto create-drop로 스키마 생성. flyway 마이그레이션(PostgreSQL용)은 H2서 충돌 → 끔
      SPRING_FLYWAY_ENABLED: "false"
    healthcheck:
      # actuator/health는 보안(401)이라 TCP 포트 응답으로 liveness 체크
      test: ["CMD", "sh", "-c", "nc -z localhost 8081"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Market Data Service
  market-data-service:
    build:
      context: ..
      dockerfile: backend/market-data-service/Dockerfile
    image: ggeolmuse-local/market-data-service:latest
    container_name: ggeolmuse-market-data-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: "market-data-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      # yahoo = 키 불필요·무료. 부팅 후 소수 종목 OHLC 자동 수집 → 차트/백테스트 데이터 확보
      MARKETDATA_PROVIDER: yahoo
      # 로컬(H2 in-mem): 전체 ~6700종목 수집은 무겁고 재시작마다 재수집 → 상위 50개만 수집(시총 desc, AAPL 등 포함).
      MARKETDATA_SYMBOLCOLLECTION_MAXSYMBOLS: "50"
      # 50종목뿐이라 메모리 여유 → 2년치 수집(1년+ 기간 백테스트/비교 가능)
      SYMBOL_LOOKBACK_DAYS: "730"
      SYMBOL_INCLUDE_DIVIDENDS: "false"
      # 환율(KRW/USD) backfill: FX 소스가 KoreaExim API(실제 키 필요)라 demo 키론 실패.
      #  KOREAEXIM_API_KEY(.env)에 무료 발급 키를 넣으면 켜기: FX_BACKFILL_ENABLED=true.
      #  (단일 simulation 백테스트는 fallback 환율로 키 없이 동작. DCA/전략/비교만 FX 시계열 필요.)
      FX_BACKFILL_ENABLED: "${FX_BACKFILL_ENABLED:-false}"
      # 비동기 수집이 커넥션을 다 잡아 API가 503나는 것 방지
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
      # 컨테이너 2g 한도 내 heap 명시 (기본 25%로는 부족 → OOM)
      JAVA_TOOL_OPTIONS: "-Xmx1536m"
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY:-demo}
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/custom
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/custom/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8083"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Backtest Service
  backtest-service:
    build:
      context: ..
      dockerfile: backend/backtest-service/Dockerfile
    image: ggeolmuse-local/backtest-service:latest
    container_name: ggeolmuse-backtest-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: "backtest-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: custom
      KEYCLOAK_SECRET: local-client-secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/custom
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/custom/protocol/openid-connect/certs
      # dev는 H2 + ddl-auto create-drop로 스키마 생성. flyway 마이그레이션(PostgreSQL용)은 H2서 충돌 → 끔
      SPRING_FLYWAY_ENABLED: "false"
    healthcheck:
      # actuator/health는 보안(401)이라 TCP 포트 응답으로 liveness 체크
      test: ["CMD", "sh", "-c", "nc -z localhost 8082"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # AI Chat Service (선택: OPENAI_API_KEY 있을 때만 --profile ai 로 실행)
  chat-service:
    build:
      context: ../backend/chat-service
      dockerfile: Dockerfile
    image: ggeolmuse-local/chat-service:latest
    container_name: ggeolmuse-chat-service
    profiles: ["ai"]
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MARKET_DATA_BASE_URL: http://market-data-service:8083
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/custom/protocol/openid-connect/certs
    depends_on:
      redis:
        condition: service_started
      market-data-service:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # Frontend Web Application
  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8070/api
        - VITE_KEYCLOAK_URL=http://localhost:8080
        - VITE_KEYCLOAK_REALM=custom
        - VITE_KEYCLOAK_CLIENT_ID=ggeolmuse-frontend
    image: ggeolmuse-local/frontend-web:latest
    container_name: ggeolmuse-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      gateway-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  #### OBSERVABILITY ####
  # prod(helm/monitoring)와 같은 조합을 로컬에도 둔다.
  # 앱은 이미 메트릭·트레이스를 뱉고 있었고, 그걸 받을 쪽이 없었을 뿐이다.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ggeolmuse-prometheus
    ports:
      # 컨테이너 9090은 각 서비스의 actuator 포트와 겹치지 않지만,
      # 호스트에서는 비켜준다.
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 부하 테스트 후 설정만 고쳐 다시 읽히려고 열어둔다.
      - --web.enable-lifecycle
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  tempo:
    image: grafana/tempo:2.7.1
    container_name: ggeolmuse-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      # 트레이스는 컨테이너와 함께 사라진다. 볼륨을 붙이지 않는 이유는 둘이다.
      # 지난 세션 트레이스를 볼 일이 없고, 쌓인 채로 재시작하면 옛 블록
      # compaction 에 메모리가 크게 든다.
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  grafana:
    image: grafana/grafana:11.5.1
    container_name: ggeolmuse-grafana
    ports:
      # 3000은 frontend-web이 쓴다.
      - "3001:3000"
    environment:
      # 로컬이라 로그인 화면을 건너뛴다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

# VOLUMES
volumes:
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  keycloak_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# NETWORKS
networks:
  ggeolmuse-network:
    driver: bridge
    name: ggeolmuse-network
