services:

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ggeolmuse-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ggeolmuse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ggeolmuse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Kafka Topics Initialization
  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ggeolmuse-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "Waiting for Kafka to be ready..."
        sleep 10

        echo "Creating Kafka topics..."

        # Trading topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic trading.trade.completed \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000 \
          --config segment.bytes=1073741824

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic trading.trade.failed \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000

        # Market data topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic market.price.updated \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000 \
          --config cleanup.policy=compact

        # User account topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic user.account.created \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic user.account.deleted \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic user.email.send \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000

        # Backtest topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic backtest.completed \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        # FX Rate topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic market.fxrate.updated \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000 \
          --config cleanup.policy=compact

        # Dividend topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic market.dividend.updated \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=7776000000

        # Dead Letter Queue topics
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic trading.trade.completed.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic market.price.updated.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic user.account.created.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic user.email.send.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --topic backtest.completed.DLT \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000

        echo "Listing all topics:"
        kafka-topics --list --bootstrap-server kafka:9092

        echo "Kafka topics initialization completed!"

        # Keep container running for logs inspection
        tail -f /dev/null
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: ggeolmuse-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "7001:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/muscathan-realm.json:/opt/keycloak/data/import/muscathan-realm.json:ro
    command: start-dev --import-realm
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m


  # Config Server
  config-server:
    image: config-server:1.2.2
    container_name: ggeolmuse-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native,dev
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Gateway
  gateway-server:
    image: gateway-server:1.2.8
    container_name: ggeolmuse-gateway-server
    ports:
      - "8070:8070"
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      SERVER_PORT: 8070
      SPRING_MAIN_WEB_APPLICATION_TYPE: reactive
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["NONE"]
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  #### BUSINESS MICROSERVICES ####

  # User Management Service
  user-service:
    image: user-service:1.2.2
    container_name: ggeolmuse-user-service
    ports:
      - "8080:8080"
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JAVA_OPTS: "-Dh2.webAllowOthers=true"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Trade Service
  trade-service:
    image: trade-service:1.2.2
    container_name: ggeolmuse-trade-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: "trade-service"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health", "||", "exit", "1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Market Data Service
  market-data-service:
    image: market-data-service:1.2.8
    container_name: ggeolmuse-market-data-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: "market-data-service"
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY:-demo}
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8083"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Backtest Service
  backtest-service:
    image: backtest-service:1.2.2
    container_name: ggeolmuse-backtest-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: "backtest-service"
      SPRING_PROFILES_ACTIVE: "dev,no-file-logging"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: config123
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: muscathan
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-demo-secret-key}
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health", "||", "exit", "1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      gateway-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  # Frontend Web Application
  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
        - VITE_KEYCLOAK_URL=http://localhost:7001
        - VITE_KEYCLOAK_REALM=muscathan
        - VITE_KEYCLOAK_CLIENT_ID=ggeolmuse-frontend
    container_name: ggeolmuse-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      gateway-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ggeolmuse-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

# VOLUMES
volumes:
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  keycloak_data:
    driver: local

# NETWORKS

networks:
  ggeolmuse-network:
    driver: bridge
    name: ggeolmuse-network
