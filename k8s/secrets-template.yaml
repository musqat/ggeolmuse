---
apiVersion: v1
kind: Secret
metadata:
  name: ggeolmuse-secrets
type: Opaque
stringData:
  # Config Server 인증
  CONFIG_SERVER_USERNAME: "REPLACE_WITH_ACTUAL_VALUE"
  CONFIG_SERVER_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  
  # Keycloak 설정
  KEYCLOAK_SECRET: "REPLACE_WITH_ACTUAL_VALUE"
  KEYCLOAK_ADMIN_USERNAME: "REPLACE_WITH_ACTUAL_VALUE"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_VALUE"
  KEYCLOAK_TEST_USER_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  
  # Gmail SMTP 설정 (User Service)
  MAIL_USERNAME: "REPLACE_WITH_ACTUAL_VALUE"
  MAIL_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  MAIL_FROM: "REPLACE_WITH_ACTUAL_VALUE"
  
  # 외부 API 키 (Market Data Service)
  ALPHAVANTAGE_API_KEY: "REPLACE_WITH_ACTUAL_VALUE"
  KOREAEXIM_API_KEY: "REPLACE_WITH_ACTUAL_VALUE"
