---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  labels:
    app: market-data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      labels:
        app: market-data-service
        tier: business-service
    spec:
      containers:
      - name: market-data-service
        image: muscathan/market-data-service:1.2.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: SPRING_PROFILES_ACTIVE
          value: "dev,no-file-logging"
        - name: SPRING_APPLICATION_NAME
          value: "market-data-service"
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: KEYCLOAK_AUTH_SERVER_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_REALM
          value: "muscathan"
        - name: KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: KEYCLOAK_SECRET
        - name: ALPHAVANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: ALPHAVANTAGE_API_KEY
        - name: KOREAEXIM_API_KEY
          valueFrom:
            secretKeyRef:
              name: ggeolmuse-secrets
              key: KOREAEXIM_API_KEY
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60  # 30 + (60 * 10) = 630초 = 10분 30초
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
  labels:
    app: market-data-service
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
  selector:
    app: market-data-service