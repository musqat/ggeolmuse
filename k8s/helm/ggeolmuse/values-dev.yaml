# 로컬 · dev 환경 설정(비시크릿, 공통값은 values.yaml 상속)
# 로컬 배포: helm ... -f values-dev.yaml -f values-secret.yaml
global:
  domain: app.localhost
  authDomain: auth.localhost
  springProfiles: prod,no-file-logging

  keycloak:
    authServerUrl: http://keycloak:8080
    publicUrl: http://auth.localhost

  otel:
    endpoint: http://tempo:4318
    environment: dev

  aws:
    secretsManager:
      enabled: false

# 설정 서버 - dev 프로파일
configServer:
  env:
    springProfiles: git

# 게이트웨이 - dev 프로파일
gatewayServer:
  env:
    springProfiles: dev

# 비즈니스 서비스 - dev URL
services:
  userService:
    env:
      APP_BASE_URL: http://app.localhost
      APP_FRONTEND_URL: http://app.localhost
      APP_MAIL_VERIFICATION_BASE_URL: http://app.localhost

# 프론트엔드 - dev URL
frontend:
  env:
    apiUrl: http://app.localhost/api
    keycloakUrl: http://auth.localhost

# Ingress - dev(Traefik, app.localhost, 컨트롤러는 클러스터에 따로)
ingress:
  enabled: true
  kind: Ingress
  className: traefik

  hosts:
    - host: app.localhost
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service: gateway-server
            port: 8070
        - path: /
          pathType: Prefix
          backend:
            service: frontend-web
            port: 3000

    - host: auth.localhost
      paths:
        - path: /
          pathType: Prefix
          backend:
            service: keycloak
            port: 8080

    - host: kafka.localhost
      paths:
        - path: /
          pathType: Prefix
          backend:
            service: kafka-ui
            port: 8090

    - host: tempo.localhost
      paths:
        - path: /
          pathType: Prefix
          backend:
            service: tempo
            port: 3200

# ConfigMap - dev URL
configMap:
  data:
    appBaseUrl: "http://app.localhost"

# 로컬은 Prometheus Operator(ServiceMonitor · PrometheusRule CRD) 없으므로 비활성화
monitoring:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
