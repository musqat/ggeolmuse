{{- /* Cloudflare Full (strict) 의 origin 인증서(Traefik 은 TLSStore 기본 인증서로, Gateway 는 리스너가 시크릿을 직접 씀) */ -}}
{{- if and .Values.ingress.enabled .Values.global.aws.secretsManager.enabled (dig "originTls" "enabled" false .Values.ingress) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origin-tls
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: origin-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.ingress.originTls.secretsManagerKey }}
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.ingress.originTls.secretsManagerKey }}
        property: tls.key
{{- if eq .Values.ingress.className "traefik" }}
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  # Traefik 은 이름이 default 인 TLSStore 만 읽음
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  defaultCertificate:
    secretName: origin-tls
{{- end }}
{{- end }}
