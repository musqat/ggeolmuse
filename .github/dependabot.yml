# 의존성 올리기 PR(월 1회 1일 09시, 생태계마다 부 · 수 버전을 PR 하나로 묶음, 주 버전은 계획해서 따로 올려 무시)
version: 2
updates:

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directories: [/frontend-web, /tests/e2e]
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pip
    directory: /backend/chat-service
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      # sdk 와 instrumentation(0.xxbN 버전)은 짝이 맞아야 설치돼서 한 PR 로
      opentelemetry:
        patterns: ["opentelemetry-*"]
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  # Dockerfile 베이스 이미지 digest
  - package-ecosystem: docker
    directories:
      - /backend/backtest-service
      - /backend/chat-service
      - /backend/config-server
      - /backend/gateway-server
      - /backend/market-data-service
      - /backend/trade-service
      - /backend/user-service
      - /frontend-web
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    # 수 버전 · digest 를 디렉터리 전부 PR 하나로
    groups:
      base-images:
        patterns: ["*"]
    # 파이썬 · node 버전이 바뀌는 부 버전은 막고 수 버전 · digest 만
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # maven 빌드 이미지는 태그 끝 JDK 버전(21 → 26)이 수 버전으로 잡혀 digest 만
      - dependency-name: maven
        update-types: [version-update:semver-patch]
    commit-message:
      prefix: chore(deps)

  # 워크플로 · 저장소 안 액션의 커밋 고정
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/install-trivy, /.github/actions/trivy-image-scan]
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: terraform
    directories: [/infra/terraform/ops, /infra/terraform/cluster/modules/k8s-cluster]
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)
