name: Trivy image scan
description: 컨테이너 이미지를 스캔해 결과를 GitHub Security 탭에 올리고(upload 가 false 면 안 올림), 고친 버전이 나온 CRITICAL 이 있으면 실패한다

inputs:
  image:
    description: 스캔할 이미지 태그
    required: true
  name:
    description: 리포트 파일명과 Security 탭 카테고리에 쓸 이름
    required: true
  require-report:
    description: true 면 리포트가 없을 때(설치 · DB 받기 실패) 실패, 아니면 경고만
    required: false
    default: 'false'
  upload:
    description: false 면 Security 탭에 올리지 않고 판정만(security-events 쓰기 권한이 없는 잡)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # 설치 · DB 받기 실패는 판정 단계에서 경고(require-report 면 실패)
    - uses: ./.github/actions/install-trivy
      continue-on-error: true

    # JSON 으로 한 번 스캔, convert 로 SARIF · 표 출력(재스캔 없음)
    - name: ${{ inputs.name }} 스캔
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        image-ref: ${{ inputs.image }}
        format: json
        output: trivy-${{ inputs.name }}.json
        severity: CRITICAL,HIGH
        exit-code: '0'
        ignore-unfixed: true
        trivyignores: .trivyignore
        cache: false
        skip-setup-trivy: true

    - name: SARIF 와 표로 변환
      continue-on-error: true
      shell: bash
      # 리포트 위치를 워크스페이스 루트로 고정
      working-directory: ${{ github.workspace }}
      run: |
        trivy convert --format sarif \
          --output trivy-results-${{ inputs.name }}.sarif \
          trivy-${{ inputs.name }}.json
        trivy convert --format table trivy-${{ inputs.name }}.json

    - name: GitHub Security 탭에 업로드
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
      if: always() && inputs.upload == 'true'
      continue-on-error: true
      with:
        sarif_file: trivy-results-${{ inputs.name }}.sarif
        category: trivy-${{ inputs.name }}

    # 리포트에 남은 CRITICAL 이면 실패(스캔이 고친 버전 없는 것을 뺌, 예외는 저장소 루트의 .trivyignore)
    - name: 고친 버전이 나온 CRITICAL 판정
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ ! -f trivy-${{ inputs.name }}.json ]; then
          if [ "${{ inputs.require-report }}" = true ]; then
            echo "::error title=Trivy::${{ inputs.name }} 스캔 리포트 없음(설치 · DB 받기 실패), 스캔 없이 넘기지 않음"
            exit 1
          fi
          echo "::warning title=Trivy::${{ inputs.name }} 스캔 리포트 없음(설치 · DB 받기 실패), 판정 건너뜀"
          exit 0
        fi
        trivy convert --format table --severity CRITICAL --exit-code 1 trivy-${{ inputs.name }}.json || {
          echo "::error title=Trivy::${{ inputs.name }} 에 고친 버전이 나온 CRITICAL(버전을 올리거나 .trivyignore 에 까닭과 함께)"
          exit 1
        }
