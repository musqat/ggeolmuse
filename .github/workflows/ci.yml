name: CI
on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

# 같은 PR 에 새 커밋이 오면 이전 실행 취소(master 는 머지마다 끝까지)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡마다 시간 제한(최근 실행의 세 배 안팎)
jobs:
  # PR 은 바뀐 서비스 이미지만, master push 는 전부 빌드(기준은 .github/scripts/ci-changes.sh)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
      chat: ${{ steps.pick.outputs.chat }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/ci-changes.sh

  build-bom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.services != '[]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # 잡마다 다른 캐시 키(받는 의존이 다름)
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-bom-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-bom-
      - name: Build & Install ggeolmuse-bom · ggeolmuse-common
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install
          cd ../ggeolmuse-common
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install

  build-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build-bom]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-messaging-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-messaging-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging
        run: |
          cd backend/messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install

  build-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-${{ matrix.service }}-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install ggeolmuse-common (for dependencies)
        run: |
          cd backend/ggeolmuse-common
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd backend/messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      # 읽기 전용 토큰으로 Docker Hub 로그인(익명은 429, Testcontainers 의 Postgres · Kafka 이미지도)
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          # verify: 단위(*Test) surefire · 통합(*IT) failsafe · 커버리지 검사(user · trade · market-data · backtest, 줄 90 · 분기 80)
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean verify
      - uses: docker/setup-buildx-action@v4

      # Docker 레이어를 Actions 캐시로 재사용(러너가 매번 새 머신)
      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.service }}:ci-${{ github.sha }}
          name: ${{ matrix.service }}

  # 프론트엔드는 BOM · messaging 과 무관해 Java 잡과 병렬
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test
        # vitest run + 커버리지(줄 90 · 분기 80 아래면 실패, 날짜 테스트용 TZ 는 vitest.config.ts 의 Asia/Seoul)
        run: npm run test:coverage
      - name: Build
        # tsc -b 포함(타입 오류도 여기서)
        run: npm run build

      # Docker Hub 로그인(익명 받기의 횟수 제한 429 회피, 읽기 전용 토큰)
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker Image for frontend-web
        uses: docker/build-push-action@v7
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          tags: frontend-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend-web
          cache-to: type=gha,mode=max,scope=frontend-web

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: frontend-web:ci-${{ github.sha }}
          name: frontend-web

  # chat 테스트(이미지 빌드 scan-images 는 이 잡 통과 뒤)
  test-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/chat-service/requirements.txt
            backend/chat-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: coverage run -m pytest -q
      # 줄 90 · 분기 80 아래면 실패, 표는 잡 요약에
      - name: Coverage
        run: |
          coverage json -q -o coverage.json
          python "$GITHUB_WORKSPACE/.github/scripts/chat-coverage.py" coverage.json 90 80

  # chat 이미지 빌드 · 검사(파이썬이라 build-services 메이븐 잡 밖)
  scan-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test-chat]
    if: needs.changes.outputs.chat == 'true'
    steps:
      - uses: actions/checkout@v7
      # Docker Hub 로그인(익명 받기의 횟수 제한 429 회피, 읽기 전용 토큰)
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker Image for chat-service
        uses: docker/build-push-action@v7
        with:
          context: backend/chat-service
          file: backend/chat-service/Dockerfile
          tags: chat-service:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=chat-service
          cache-to: type=gha,mode=max,scope=chat-service

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: chat-service:ci-${{ github.sha }}
          name: chat-service

  # 렌더한 매니페스트 검사(리소스 한도 누락 · 특권 컨테이너처럼 이미지 스캔에 안 보이는 것)
  scan-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: 실제 배포본을 뽑는다
        run: |
          helm template ggeolmuse helm/ggeolmuse \
            -f helm/ggeolmuse/values-prod.yaml > rendered.yaml

      # 환경별 파일 없이 기본 값만으로 렌더되는지 확인
      - name: 기본 값만으로도 렌더되는지 본다
        run: helm template ggeolmuse helm/ggeolmuse > /dev/null

      # NetworkPolicy 허용 목록에 없는 새 서비스 포트 검사
      - name: NetworkPolicy 가 서비스 포트를 전부 여는지 본다
        run: bash .github/scripts/check-netpol-ports.sh rendered.yaml

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: config
          scan-ref: rendered.yaml
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests

  # terraform 형식 · 문법 · 가짜 프로바이더 테스트(AWS 에 닿지 않음)
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      # required_version 의 바닥 버전
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: 형식
        run: terraform fmt -check -recursive

      - name: 문법 · 루트 테스트
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: 멀티 노드 모듈 테스트
        working-directory: terraform/modules/k8s-cluster
        run: |
          terraform init -backend=false -input=false
          terraform test
