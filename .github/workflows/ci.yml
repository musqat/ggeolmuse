name: CI
on:
  pull_request:
  push:
    branches: [ master ]

# SARIF 를 올리는 잡만 security-events 쓰기
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 이전 실행 취소(master 는 커밋마다 따로 끝까지 · 끝의 릴리스까지, 대기 실행도 취소 안 됨)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡마다 시간 제한(최근 실행의 세 배 안팎)
jobs:
  # PR 은 바뀐 서비스 이미지만, master push 는 전부 빌드 · 문서와 인프라만 바뀐 PR 은 E2E 건너뜀(기준은 tools/cmd/ci-changes)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
      chat: ${{ steps.pick.outputs.chat }}
      e2e: ${{ steps.pick.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - id: pick
        working-directory: tools
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/ci-changes -event "$EVENT" -base "$BASE" >> "$GITHUB_OUTPUT"

  build-bom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.services != '[]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      # 잡마다 다른 캐시 키(받는 의존이 다름)
      # PR 은 캐시 읽기만(저장은 master push, 잡 끝)
      - name: Cache Maven dependencies
        id: m2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-bom-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-bom-
      # 모든 백엔드 모듈 Java 기본 형식(줄 끝 공백 · 끝 줄바꿈 · 탭, 고치기: mvn -f backend/pom.xml -N spotless:apply)
      - name: 백엔드 형식 검사
        run: mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" -B -f backend/pom.xml -N spotless:check
      - name: Build & Install ggeolmuse-bom · ggeolmuse-common
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install
          cd ../ggeolmuse-common
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install
      - name: Maven 캐시 저장
        if: github.event_name == 'push' && steps.m2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ steps.m2-cache.outputs.cache-primary-key }}

  build-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build-bom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      # PR 은 캐시 읽기만(저장은 master push, 잡 끝)
      - name: Cache Maven dependencies
        id: m2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-messaging-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-messaging-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install messaging
        run: |
          cd backend/messaging
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install
      - name: Maven 캐시 저장
        if: github.event_name == 'push' && steps.m2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ steps.m2-cache.outputs.cache-primary-key }}

  build-services:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    needs: [changes, build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      # PR 은 캐시 읽기만(저장은 master push, 잡 끝)
      - name: Cache Maven dependencies
        id: m2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-${{ matrix.service }}-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install ggeolmuse-common (for dependencies)
        run: |
          cd backend/ggeolmuse-common
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd backend/messaging
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰(Testcontainers 의 Postgres · Kafka 이미지 포함)
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          # verify: 단위(*Test) surefire · 통합(*IT) failsafe · 커버리지 검사(user · trade · market-data · backtest, 줄 90 · 분기 80)
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Docker 레이어를 Actions 캐시로 재사용(러너가 매번 새 머신)
      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          # 캐시 쓰기는 master push 만
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.service }}:ci-${{ github.sha }}
          name: ${{ matrix.service }}
      - name: Maven 캐시 저장
        if: github.event_name == 'push' && steps.m2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ steps.m2-cache.outputs.cache-primary-key }}

  # 프론트엔드는 BOM · messaging 과 무관해 Java 잡과 병렬
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test
        # vitest run + 커버리지(줄 90 · 분기 80 아래면 실패)
        run: npm run test:coverage
      - name: Build
        # tsc -b 포함(타입 오류도 여기서)
        run: npm run build

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker Image for frontend-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          tags: frontend-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend-web
          # 캐시 쓰기는 master push 만
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend-web' || '' }}

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: frontend-web:ci-${{ github.sha }}
          name: frontend-web

  # chat-service 테스트 · 커버리지
  test-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/chat-service/requirements.txt
            backend/chat-service/requirements-dev.txt
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: |
          coverage run -m pytest -q
          coverage json -q -o coverage.json
      # 줄 90 · 분기 80 아래면 실패, 표는 잡 요약에
      - name: Coverage
        working-directory: tools
        run: go run ./cmd/chat-coverage "$GITHUB_WORKSPACE/backend/chat-service/coverage.json" 90 80

  # chat-service 이미지 빌드 · 검사(파이썬이라 build-services 메이븐 잡 밖)
  scan-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    needs: [changes, test-chat]
    if: needs.changes.outputs.chat == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker Image for chat-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend/chat-service
          file: backend/chat-service/Dockerfile
          tags: chat-service:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=chat-service
          # 캐시 쓰기는 master push 만
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=chat-service' || '' }}

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: chat-service:ci-${{ github.sha }}
          name: chat-service

  # 렌더한 매니페스트 검사(리소스 한도 누락 · 특권 컨테이너처럼 이미지 스캔에 안 보이는 것)
  scan-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: values.yaml 만으로 렌더 확인
        run: helm template ggeolmuse infra/k8s/charts/ggeolmuse > /dev/null

      - name: 운영 값으로 렌더
        run: helm template ggeolmuse infra/k8s/charts/ggeolmuse -f infra/k8s/charts/ggeolmuse/values-prod.yaml > rendered-k8s.yaml

      # EBS(ext4) 볼륨 맨 위 lost+found 를 피하는 Kafka 데이터 하위 폴더 확인
      - name: 멀티 노드 Kafka 데이터 폴더
        run: |
          helm template ggeolmuse infra/k8s/charts/ggeolmuse -f infra/k8s/charts/ggeolmuse/values-prod.yaml \
            --show-only templates/infrastructure/kafka.yaml | grep -A1 'name: KAFKA_LOG_DIRS' | grep -q 'value: "/var/lib/kafka/data/[^"]' \
            || { echo "::error::멀티 노드 Kafka 데이터 폴더(KAFKA_LOG_DIRS)가 볼륨 하위 폴더가 아님"; exit 1; }

      # 노드 셋이 같이 켜질 때 자바 앱 동시 기동을 견디는 기동 검사 허용 시간(10분 이상) 확인
      - name: 멀티 노드 자바 앱 기동 검사 허용 시간
        run: |
          grep -A7 'startupProbe:' rendered-k8s.yaml | awk '
            /path:/ { path = $2 }
            /initialDelaySeconds:/ { d = $2 }
            /periodSeconds:/ { p = $2 }
            /failureThreshold:/ {
              if (path == "/actuator/health/readiness") { n++; if (d + p * $2 < 600) { print "::error::기동 검사 허용 시간 " d + p * $2 "초(10분 미만)"; bad = 1 } }
              path = ""; d = 0
            }
            END { if (n < 6) { print "::error::자바 앱 기동 검사 " n "개(6개 미만)"; bad = 1 } exit bad }'

      # 앱 CPU 요청 합계(레플리카 곱) 상한, 워커 하나가 멈춰도 Kafka 같은 하나짜리가 남은 워커로 옮겨 갈 자리
      - name: 운영 앱 CPU 요청 합계
        run: |
          total=$(awk '/^kind: /{k=$2; r=1} /^  replicas: /{r=$2} /^      containers:/{inc=1} /^      initContainers:/{inc=0}
            /requests:/{q=1; next} q && /cpu:/{ if (inc && k ~ /Deployment|StatefulSet/) { v=$2; sub(/m$/, "", v); s += v * r }; q=0 }
            END { print s + 0 }' rendered-k8s.yaml)
          echo "앱 CPU 요청 합계 ${total}m"
          if [ "$total" -gt 1600 ]; then
            echo "::error::앱 CPU 요청 합계 ${total}m 가 상한 1600m 를 넘음"
            exit 1
          fi

      # 교체 중 새 레플리카끼리 노드를 나누는 분산 계산(같은 ReplicaSet 파드만 셈) 확인
      - name: 멀티 노드 분산을 버전마다 계산
        run: |
          spread=$(grep -c 'topologySpreadConstraints:' rendered-k8s.yaml)
          perrev=$(grep -A10 'topologySpreadConstraints:' rendered-k8s.yaml | grep -c -- '- pod-template-hash')
          echo "분산 $spread · 버전마다 $perrev"
          if [ "$spread" -eq 0 ] || [ "$spread" -ne "$perrev" ]; then
            echo "::error::버전마다 계산하지 않는 분산 규칙이 있음(matchLabelKeys: pod-template-hash)"
            exit 1
          fi

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 운영 값으로 렌더한 PrometheusRule spec 을 규칙 파일로 꺼내 문법 검사 · 단위 테스트 · 알림별 대응 문서 주소 · 울리는 테스트 확인
      - name: promtool 알림 규칙 검사
        run: |
          promtool() { docker run --rm --network none -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.1.0 "$@"; }
          rules() {
            helm template ggeolmuse "$@" --show-only templates/monitoring/prometheusrule.yaml \
              | awk 'spec { sub(/^  /, ""); print } /^spec:$/ { spec = 1 }' > alert-rules.yaml
            promtool check rules alert-rules.yaml
            promtool test rules infra/k8s/monitoring/alert-rules-test.yaml
            (cd tools && go run ./cmd/alert-rules-coverage ../alert-rules.yaml ../infra/k8s/monitoring/alert-rules-test.yaml)
          }
          rules infra/k8s/charts/ggeolmuse -f infra/k8s/charts/ggeolmuse/values-prod.yaml

      # 클러스터 Application 묶음 렌더 · 네임스페이스 메타데이터는 네임스페이스마다 한 앱 · ArgoCD 자신의 자동 동기화(지우기 없음 · server-side apply)
      - name: ArgoCD Application 묶음 렌더 · 검사
        run: |
          helm lint infra/k8s/argocd/apps
          helm template apps infra/k8s/argocd/apps > argocd-apps.yaml
          dup=$(awk '/^---/{ns=""} /^    namespace: /{ns=$2} /^    managedNamespaceMetadata:/{print ns}' argocd-apps.yaml | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::managedNamespaceMetadata 를 둔 Application 이 둘 이상인 네임스페이스: $dup"
            exit 1
          fi
          self=$(awk '/^---/{p=0} /^  name: argocd$/{p=1} p' argocd-apps.yaml)
          for want in 'automated:' 'prune: false' 'ServerSideApply=true'; do
            if ! grep -q -- "$want" <<<"$self"; then
              echo "::error::ArgoCD 자신의 Application 에 $want 없음"
              exit 1
            fi
          done

      # 운영 렌더의 NetworkPolicy 기본 거부 · 워크로드마다 여는 정책 · 허용 목록에 없는 새 서비스 포트 검사(tools/cmd/netpol-check)
      - name: NetworkPolicy 기본 거부 · 서비스 포트 대조
        working-directory: tools
        run: |
          go run ./cmd/netpol-check ../rendered-k8s.yaml

      # 운영 렌더 · compose 의 realm 클라이언트 흐름 · 역할과 Keycloak 클라이언트 secret 을 받는 워크로드 검사(tools/cmd/keycloak-check)
      - name: Keycloak 클라이언트 권한과 secret 을 받는 곳을 본다
        working-directory: tools
        run: |
          go run ./cmd/keycloak-check ../rendered-k8s.yaml \
            ../infra/k8s/charts/ggeolmuse/config-files/keycloak-realm-template.json \
            ../infra/compose/keycloak/custom-realm.json

      # 렌더한 이미지 태그가 Docker Hub 에 있는지(값 파일 오타 · 없는 태그, tools/cmd/image-check)
      - name: Docker Hub 이미지 태그 확인
        working-directory: tools
        run: go run ./cmd/image-check ../rendered-k8s.yaml

      # Trivy 설치 · 스캔 실패로 잡을 막지 않음
      - uses: ./.github/actions/install-trivy
        continue-on-error: true

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: rendered-k8s.yaml
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests

  # tools Go 검사 · 테스트
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      # 리포 검사(repocheck)가 읽는 워크플로 · Dockerfile 은 모듈 밖이라 테스트 결과 캐시 없이
      - name: 형식 · 정적 검사 · 테스트
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go vet ./...
          go test -count=1 ./...

      # 백엔드 예외 생성식 · 오류 코드 enum 검사
      - name: 오류 코드
        run: go run ./cmd/error-codes ../backend

      # 워크플로 · 액션 문법과 run 스크립트(shellcheck) 검사
      - name: actionlint
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  # 운영 노드 · kind 스크립트 정적 검사 · 컨트롤 플레인 설정 렌더 테스트
  node-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck · 테스트
        run: |
          shellcheck -x -P SCRIPTDIR -S warning infra/k8s/bootstrap/*.sh infra/k8s/kind/*.sh
          bash infra/k8s/bootstrap/bootstrap_test.sh

  # terraform 형식 · 문법 · 가짜 프로바이더 테스트(AWS 에 닿지 않음, 운영 루트와 멀티 노드 루트)
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform/ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # required_version 하한(1.10) 줄의 버전
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5

      - name: 형식
        run: terraform fmt -check -recursive

      # 가짜 프로바이더 plan 은 변수 검사처럼 validate 가 못 보는 실패를 잡음, 제공자는 잠금 파일 버전 그대로
      - name: 문법 · 테스트
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

      # 멀티 노드 예비 클러스터(상태를 따로 둔 루트)
      - name: 멀티 노드 루트 형식 · 문법 · 테스트
        working-directory: infra/terraform/cluster
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: 멀티 노드 모듈 테스트
        working-directory: infra/terraform/cluster/modules/k8s-cluster
        run: |
          terraform init -backend=false -input=false
          terraform test

  # 스택 전체를 고정 시세로 띄운 브라우저 테스트(docker-compose.e2e.yml, 필수 체크 E2E)
  e2e:
    name: E2E
    needs: changes
    # 문서와 인프라만 바뀐 PR 만 건너뜀(고르기가 실패해도 E2E 는 돎, 조건으로 건너뛴 잡은 필수 체크에서 통과)
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # docker compose 명령마다 기본 파일 위에 E2E 덮어쓰기
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # 시크릿 없이 .env.example 기본값으로 기동(시세 · 환율은 고정 데이터, 선택 키는 없으면 안 씀)
      - name: compose 환경 변수 준비
        working-directory: infra/compose
        run: cp .env.example .env

      # 설정 리포 main 끝 커밋을 이 실행의 config-server 라벨로 고정하고 잡 요약에 남김(못 읽으면 main)
      - name: 설정 리포 커밋 고정
        run: |
          head=$(git ls-remote https://github.com/musqat/ggeolmuse-config.git refs/heads/main | cut -f1)
          if [ -n "$head" ]; then
            echo "CONFIG_GIT_LABEL=$head" >> "$GITHUB_ENV"
            echo "설정 리포 커밋 ${head:0:7}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=설정 리포::main 끝 커밋을 못 읽어 main 으로 띄움"
          fi

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 서비스 빌드 잡이 master push 때 저장한 서비스별 빌드 캐시를 읽는 스택 빌드(이미지는 compose 이름으로)
      - name: 스택 빌드(빌드 캐시)
        id: bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: infra/compose
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          load: true
          set: |
            config-server.cache-from=type=gha,scope=config-server
            gateway-server.cache-from=type=gha,scope=gateway-server
            user-service.cache-from=type=gha,scope=user-service
            trade-service.cache-from=type=gha,scope=trade-service
            market-data-service.cache-from=type=gha,scope=market-data-service
            backtest-service.cache-from=type=gha,scope=backtest-service
            chat-service.cache-from=type=gha,scope=chat-service
            frontend-web.cache-from=type=gha,scope=frontend-web

      # 캐시 빌드가 실패하면 compose 빌드로 다시(일시 네트워크 오류면 30초 뒤, 최대 3번)
      - name: 스택 빌드
        if: steps.bake.outcome == 'failure'
        working-directory: infra/compose
        run: |
          for i in 1 2 3; do
            docker compose build && exit 0
            echo "빌드 실패 ${i}번째, 30초 뒤 다시"
            sleep 30
          done
          exit 1

      # 기동이 일시 오류(이미지 받기 · 포트)로 실패하면 20초 뒤 다시(최대 3번)
      - name: 스택 기동
        working-directory: infra/compose
        run: |
          for i in 1 2 3; do
            docker compose up -d && exit 0
            echo "기동 실패 ${i}번째, 20초 뒤 다시"
            sleep 20
          done
          exit 1

      # PR 은 캐시 읽기만(저장은 master push, 설치 뒤)
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Playwright 설치
        working-directory: tests/e2e
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install chromium
          # 러너에 깔린 라이브러리로 브라우저가 뜨면 우분투 저장소를 부르지 않음
          if node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            exit 0
          fi
          echo "::warning::브라우저가 뜨지 않아 의존 패키지를 apt 로 받는다"
          # 우분투 저장소 주소가 안 풀려도 오래 걸리지 않게 apt 대기와 전체 시간을 짧게 제한
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-e2e-timeouts > /dev/null
          timeout 240 npx playwright install-deps chromium

      - name: Playwright 브라우저 캐시 저장
        if: github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: E2E 실행
        working-directory: tests/e2e
        run: npx playwright test

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: infra/compose
        run: |
          docker compose logs --tail 200
          # 앞쪽 기동 구간 따로 출력(폴링 로그에 밀려 나감)
          docker compose logs market-data-service | head -400
          # 게이트웨이 경로별 서킷 상태 · 성공 · 실패 · 거절 수(관리 포트는 컨테이너 안에서만 열림)
          docker compose exec -T gateway-server wget -qO- http://localhost:9090/actuator/prometheus \
            | grep -E '^resilience4j_circuitbreaker_(state|calls_seconds_count|not_permitted_calls_total)' \
            | grep -vE ' 0(\.0)?$' || true

      - name: 스택 정리
        if: always()
        working-directory: infra/compose
        run: docker compose down -v

  # 모든 잡 결과 모음(머지 필수 검사, 바뀐 것이 없어 건너뛴 잡은 통과)
  ci-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build-bom
      - build-messaging
      - build-services
      - build-frontend
      - test-chat
      - scan-images
      - scan-manifests
      - tools
      - node-scripts
      - terraform
    if: always()
    steps:
      - name: 실패하거나 취소된 잡이 있으면 실패
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          exit 1

  # 머지한 PR 번호와 빌드할 서비스 칸에 체크가 있는지(PR 없는 커밋 · 체크 없는 머지는 릴리스를 부르지 않음)
  release-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      # 머지 커밋의 PR(본문은 파일로만 넘김)
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")][0] // {}" > "$RUNNER_TEMP/pr.json"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          echo "number=$(jq -r '.number // ""' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
      - id: check
        working-directory: tools
        shell: bash
        run: go run ./cmd/release-plan -checked "$RUNNER_TEMP/pr-body.md" | tee -a "$GITHUB_OUTPUT"

  # master push 의 검사 · E2E 가 둘 다 성공하고 체크한 서비스가 있으면 릴리스(release.yml)
  release:
    needs: [ci-result, e2e, release-check]
    if: ${{ github.event_name == 'push' && needs.ci-result.result == 'success' && needs.e2e.result == 'success' && needs.release-check.outputs.release == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      pr: ${{ needs.release-check.outputs.pr }}
    secrets: inherit
