name: CI
on:
  pull_request:
  push:
    branches: [ master ]
jobs:
  build-bom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom
        run: |
          cd ggeolmuse-bom
          mvn clean install -DskipTests

  build-messaging:
    runs-on: ubuntu-latest
    needs: build-bom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn install -DskipTests
      - name: Build & Install messaging
        run: |
          cd messaging
          mvn clean install -DskipTests

  build-services:
    runs-on: ubuntu-latest
    needs: [build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - gateway-server
          - user-service
          - trade-service
          - market-data-service
          - backtest-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd messaging
          mvn install -DskipTests
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ "${{ matrix.service }}" = "market-data-service" ] || [ "${{ matrix.service }}" = "user-service" ]; then
            mvn clean compile test -DskipTests
          else
            mvn clean compile test
          fi
      - name: Build Docker Image for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn package -DskipTests
          docker build -t ${{ matrix.service }}:ci-${{ github.sha }} .