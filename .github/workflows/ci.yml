name: CI
on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  build-bom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom
        run: |
          cd ggeolmuse-bom
          mvn clean install -DskipTests

  build-messaging:
    runs-on: ubuntu-latest
    needs: build-bom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn install -DskipTests
      - name: Build & Install messaging
        run: |
          cd messaging
          mvn clean install -DskipTests

  build-services:
    runs-on: ubuntu-latest
    needs: [build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - gateway-server
          - user-service
          - trade-service
          - market-data-service
          - backtest-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd messaging
          mvn install -DskipTests
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          # Run unit tests only (*Test.java). Integration tests (*IT.java) are excluded by default
          mvn clean compile test
      - name: Build Docker Image for ${{ matrix.service }}
        # 멀티스테이지 Dockerfile
        run: |
          docker build -f ${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci-${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (table output for debugging)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:ci-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:ci-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  # 프론트엔드는 BOM/messaging 과 무관하므로 Java 잡과 병렬로 돈다
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 2
      - name: Test
        # vitest run. 날짜 테스트가 TZ 에 의존해 vitest.config.ts 에서 Asia/Seoul 로 고정된다
        run: npm test
      - name: Build
        # tsc -b 를 포함하므로 타입 오류도 여기서 걸린다
        run: npm run build
