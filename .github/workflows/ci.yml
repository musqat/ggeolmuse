name: CI
on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

# 같은 PR 에 새 커밋이 오면 이전 실행을 멈춘다. master 는 머지마다 끝까지 돈다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 은 바뀐 서비스 이미지만 빌드한다. master push 는 전부. 기준은 .github/scripts/ci-changes.sh
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
      chat: ${{ steps.pick.outputs.chat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/ci-changes.sh

  build-bom:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.services != '[]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 잡마다 받는 의존이 달라 키를 나눈다.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-bom-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-bom-
      - name: Build & Install ggeolmuse-bom
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install

  build-messaging:
    runs-on: ubuntu-latest
    needs: [changes, build-bom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-messaging-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-messaging-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging
        run: |
          cd backend/messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install -DskipTests

  build-services:
    runs-on: ubuntu-latest
    needs: [changes, build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-${{ matrix.service }}-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd backend/messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          # 단위 테스트만 돈다 (*Test.java). *IT.java 는 기본 제외
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean compile test
      # 로그인 없이 받으면 Docker Hub 횟수 제한(429)에 걸린다. 읽기 전용 토큰으로 받는다
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # 러너가 매번 새 머신이라 Docker 레이어를 Actions 캐시에 얹어 재사용한다
      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.service }}:ci-${{ github.sha }}
          name: ${{ matrix.service }}

  # 프론트엔드는 BOM/messaging 과 무관하므로 Java 잡과 병렬로 돈다
  build-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test
        # vitest run. 날짜 테스트가 TZ 에 의존해 vitest.config.ts 에서 Asia/Seoul 로 고정된다
        run: npm test
      - name: Build
        # tsc -b 를 포함하므로 타입 오류도 여기서 걸린다
        run: npm run build

      # 로그인 없이 받으면 Docker Hub 횟수 제한(429)에 걸린다. 읽기 전용 토큰으로 받는다
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Image for frontend-web
        uses: docker/build-push-action@v6
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          tags: frontend-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend-web
          cache-to: type=gha,mode=max,scope=frontend-web

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: frontend-web:ci-${{ github.sha }}
          name: frontend-web

  # 파이썬이라 build-services 의 메이븐 잡에 안 들어간다.
  scan-images:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    steps:
      - uses: actions/checkout@v4
      # 로그인 없이 받으면 Docker Hub 횟수 제한(429)에 걸린다. 읽기 전용 토큰으로 받는다
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Image for chat-service
        uses: docker/build-push-action@v6
        with:
          context: backend/chat-service
          file: backend/chat-service/Dockerfile
          tags: chat-service:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=chat-service
          cache-to: type=gha,mode=max,scope=chat-service

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: chat-service:ci-${{ github.sha }}
          name: chat-service

  # 렌더링한 매니페스트 검사. 리소스 한도 누락·특권 컨테이너처럼 이미지 스캔에 안 보이는 것
  scan-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: 실제 배포본을 뽑는다
        run: |
          helm template ggeolmuse helm/ggeolmuse \
            -f helm/ggeolmuse/values-prod.yaml > rendered.yaml

      # 새 서비스 포트가 NetworkPolicy 허용 목록에 없으면 여기서 잡는다
      - name: NetworkPolicy 가 서비스 포트를 전부 여는지 본다
        run: bash .github/scripts/check-netpol-ports.sh rendered.yaml

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: config
          scan-ref: rendered.yaml
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests
