name: CI
on:
  pull_request:
  push:
    branches: [ master ]

# SARIF 를 올리는 잡만 security-events 쓰기
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 이전 실행 취소(master 는 커밋마다 따로 끝까지 · 끝의 릴리스까지, 대기 실행도 취소 안 됨)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡마다 시간 제한(최근 실행의 세 배 안팎)
jobs:
  # PR 은 바뀐 서비스 이미지만, master push 는 전부 빌드(기준은 tools/cmd/ci-changes)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
      chat: ${{ steps.pick.outputs.chat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - id: pick
        working-directory: tools
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/ci-changes -event "$EVENT" -base "$BASE" >> "$GITHUB_OUTPUT"

  build-bom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.services != '[]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      # 잡마다 다른 캐시 키(받는 의존이 다름)
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-bom-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-bom-
      - name: Build & Install ggeolmuse-bom · ggeolmuse-common
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install
          cd ../ggeolmuse-common
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install

  build-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build-bom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-messaging-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-messaging-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install messaging
        run: |
          cd backend/messaging
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean install

  build-services:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    needs: [changes, build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-${{ matrix.service }}-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd backend/ggeolmuse-bom
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install ggeolmuse-common (for dependencies)
        run: |
          cd backend/ggeolmuse-common
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd backend/messaging
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" install -DskipTests
      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰(Testcontainers 의 Postgres · Kafka 이미지 포함)
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          # verify: 단위(*Test) surefire · 통합(*IT) failsafe · 커버리지 검사(user · trade · market-data · backtest, 줄 90 · 분기 80)
          mvn -s "$GITHUB_WORKSPACE/.mvn/ci-settings.xml" clean verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Docker 레이어를 Actions 캐시로 재사용(러너가 매번 새 머신)
      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.service }}:ci-${{ github.sha }}
          name: ${{ matrix.service }}

  # 프론트엔드는 BOM · messaging 과 무관해 Java 잡과 병렬
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test
        # vitest run + 커버리지(줄 90 · 분기 80 아래면 실패)
        run: npm run test:coverage
      - name: Build
        # tsc -b 포함(타입 오류도 여기서)
        run: npm run build

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker Image for frontend-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          tags: frontend-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend-web
          cache-to: type=gha,mode=max,scope=frontend-web

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: frontend-web:ci-${{ github.sha }}
          name: frontend-web

  # chat-service 테스트 · 커버리지
  test-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/chat-service/requirements.txt
            backend/chat-service/requirements-dev.txt
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: |
          coverage run -m pytest -q
          coverage json -q -o coverage.json
      # 줄 90 · 분기 80 아래면 실패, 표는 잡 요약에
      - name: Coverage
        working-directory: tools
        run: go run ./cmd/chat-coverage "$GITHUB_WORKSPACE/backend/chat-service/coverage.json" 90 80

  # chat-service 이미지 빌드 · 검사(파이썬이라 build-services 메이븐 잡 밖)
  scan-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    needs: [changes, test-chat]
    if: needs.changes.outputs.chat == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker Image for chat-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend/chat-service
          file: backend/chat-service/Dockerfile
          tags: chat-service:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=chat-service
          cache-to: type=gha,mode=max,scope=chat-service

      # 고친 버전이 나온 CRITICAL 이면 실패(설치 · DB 받기 실패는 경고만)
      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: chat-service:ci-${{ github.sha }}
          name: chat-service

  # 렌더한 매니페스트 검사(리소스 한도 누락 · 특권 컨테이너처럼 이미지 스캔에 안 보이는 것)
  scan-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: values-prod.yaml 로 매니페스트 렌더
        run: |
          helm template ggeolmuse helm/ggeolmuse \
            -f helm/ggeolmuse/values-prod.yaml > rendered.yaml

      - name: values.yaml 만으로 렌더 확인
        run: helm template ggeolmuse helm/ggeolmuse > /dev/null

      - name: 멀티 노드 차트 렌더
        run: |
          helm template ggeolmuse k8s/helm/ggeolmuse -f k8s/helm/ggeolmuse/values-prod.yaml \
            -f k8s/helm/ggeolmuse/values-k8s.yaml > rendered-k8s.yaml

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 두 차트(운영 · k8s/helm)의 PrometheusRule spec 을 규칙 파일로 꺼내 문법 검사 · 단위 테스트 · 알림별 대응 문서 주소 · 울리는 테스트 확인
      - name: promtool 알림 규칙 검사
        run: |
          promtool() { docker run --rm --network none -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.1.0 "$@"; }
          rules() {
            helm template ggeolmuse "$@" --show-only templates/monitoring/prometheusrule.yaml \
              | awk 'spec { sub(/^  /, ""); print } /^spec:$/ { spec = 1 }' > alert-rules.yaml
            promtool check rules alert-rules.yaml
            promtool test rules helm/monitoring/alert-rules-test.yaml
            python3 .github/scripts/alert_rules_coverage.py alert-rules.yaml helm/monitoring/alert-rules-test.yaml
          }
          rules helm/ggeolmuse -f helm/ggeolmuse/values-prod.yaml
          rules k8s/helm/ggeolmuse -f k8s/helm/ggeolmuse/values-prod.yaml -f k8s/helm/ggeolmuse/values-k8s.yaml

      # 운영 k3s 부품 Application 묶음(External Secrets · 모니터링 · Traefik 값), 네임스페이스 메타데이터는 네임스페이스마다 한 앱
      - name: 부품 Application 묶음 렌더 · 네임스페이스 메타데이터 중복 검사
        run: |
          helm lint helm/argocd/apps
          helm template k3s-apps helm/argocd/apps > k3s-apps.yaml
          dup=$(awk '/^---/{ns=""} /^    namespace: /{ns=$2} /^    managedNamespaceMetadata:/{print ns}' k3s-apps.yaml | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::managedNamespaceMetadata 를 둔 Application 이 둘 이상인 네임스페이스: $dup"
            exit 1
          fi

      # 두 차트의 NetworkPolicy 기본 거부 · 워크로드마다 여는 정책 · 허용 목록에 없는 새 서비스 포트 검사(tools/cmd/netpol-check)
      - name: NetworkPolicy 기본 거부 · 서비스 포트 대조
        working-directory: tools
        run: |
          go run ./cmd/netpol-check ../rendered.yaml
          go run ./cmd/netpol-check ../rendered-k8s.yaml

      # 두 차트 · compose 의 realm 클라이언트 흐름 · 역할과 Keycloak 클라이언트 secret 을 받는 워크로드 검사(tools/cmd/keycloak-check)
      - name: Keycloak 클라이언트 권한과 secret 을 받는 곳을 본다
        working-directory: tools
        run: |
          go run ./cmd/keycloak-check ../rendered.yaml \
            ../helm/ggeolmuse/config-files/keycloak-realm-template.json \
            ../docker-compose/keycloak/custom-realm.json
          go run ./cmd/keycloak-check ../rendered-k8s.yaml ../k8s/helm/ggeolmuse/config-files/keycloak-realm-template.json

      # 렌더한 이미지 태그가 Docker Hub 에 있는지(값 파일 오타 · 없는 태그, tools/cmd/image-check)
      - name: Docker Hub 이미지 태그 확인
        working-directory: tools
        run: go run ./cmd/image-check ../rendered.yaml

      # Trivy 설치 · 스캔 실패로 잡을 막지 않음
      - uses: ./.github/actions/install-trivy
        continue-on-error: true

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: rendered.yaml
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests

  # tools Go 검사 · 테스트
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: 형식 · 정적 검사 · 테스트
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go vet ./...
          go test ./...

      # 워크플로 · 액션 문법과 run 스크립트(shellcheck) 검사
      - name: actionlint
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  # 운영 노드 부트스트랩 스크립트 정적 검사 · --dry-run 출력 테스트
  node-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck · 테스트
        run: |
          shellcheck helm/k3s-node/*.sh
          bash helm/k3s-node/bootstrap_test.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # terraform 형식 · 문법 · 가짜 프로바이더 테스트(AWS 에 닿지 않음, 운영 루트와 멀티 노드 루트)
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # required_version 하한(1.10) 줄의 버전
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5

      - name: 형식
        run: terraform fmt -check -recursive

      # 가짜 프로바이더 plan 은 변수 검사처럼 validate 가 못 보는 실패를 잡음, 제공자는 잠금 파일 버전 그대로
      - name: 문법 · 테스트
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

      # 멀티 노드 예비 클러스터(상태를 따로 둔 루트)
      - name: 멀티 노드 루트 형식 · 문법 · 테스트
        working-directory: k8s/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: 멀티 노드 모듈 테스트
        working-directory: k8s/terraform/modules/k8s-cluster
        run: |
          terraform init -backend=false -input=false
          terraform test

  # 문서만 바뀐 PR 은 E2E 건너뜀(조건으로 건너뛴 잡은 필수 체크에서 통과)
  e2e-changes:
    name: e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '(\.md$|^docs/)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # 스택 전체를 고정 시세로 띄운 브라우저 테스트(docker-compose.e2e.yml, 필수 체크 E2E)
  e2e:
    name: E2E
    needs: e2e-changes
    # 문서만 바뀐 PR 만 건너뜀(고르기가 실패해도 E2E 는 돎)
    if: ${{ !cancelled() && needs.e2e-changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # docker compose 명령마다 기본 파일 위에 E2E 덮어쓰기
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # 시크릿 없이 .env.example 기본값으로 기동(시세 · 환율은 고정 데이터, 선택 키는 없으면 안 씀)
      - name: compose 환경 변수 준비
        working-directory: docker-compose
        run: cp .env.example .env

      # 설정 리포 main 끝 커밋을 이 실행의 config-server 라벨로 고정하고 잡 요약에 남김(못 읽으면 main)
      - name: 설정 리포 커밋 고정
        run: |
          head=$(git ls-remote https://github.com/musqat/ggeolmuse-config.git refs/heads/main | cut -f1)
          if [ -n "$head" ]; then
            echo "CONFIG_GIT_LABEL=$head" >> "$GITHUB_ENV"
            echo "설정 리포 커밋 ${head:0:7}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=설정 리포::main 끝 커밋을 못 읽어 main 으로 띄움"
          fi

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # compose 가 일곱 개를 병렬 빌드, 일시 네트워크 오류면 30초 뒤 다시(최대 3번, 끝난 이미지는 캐시로)
      - name: 스택 빌드
        working-directory: docker-compose
        run: |
          for i in 1 2 3; do
            docker compose build && exit 0
            echo "빌드 실패 ${i}번째, 30초 뒤 다시"
            sleep 30
          done
          exit 1

      - name: 스택 기동
        working-directory: docker-compose
        run: docker compose up -d

      - name: Playwright 브라우저 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Playwright 설치
        working-directory: tests/e2e
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install chromium
          # 러너에 깔린 라이브러리로 브라우저가 뜨면 우분투 저장소를 부르지 않음
          if node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            exit 0
          fi
          echo "::warning::브라우저가 뜨지 않아 의존 패키지를 apt 로 받는다"
          # 우분투 저장소 주소가 안 풀려도 오래 걸리지 않게 apt 대기와 전체 시간을 짧게 제한
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-e2e-timeouts > /dev/null
          timeout 240 npx playwright install-deps chromium

      - name: E2E 실행
        working-directory: tests/e2e
        run: npx playwright test

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: docker-compose
        run: |
          docker compose logs --tail 200
          # 앞쪽 기동 구간 따로 출력(폴링 로그에 밀려 나감)
          docker compose logs market-data-service | head -400
          # 게이트웨이 경로별 서킷 상태 · 성공 · 실패 · 거절 수(관리 포트는 컨테이너 안에서만 열림)
          docker compose exec -T gateway-server wget -qO- http://localhost:9090/actuator/prometheus \
            | grep -E '^resilience4j_circuitbreaker_(state|calls_seconds_count|not_permitted_calls_total)' \
            | grep -vE ' 0(\.0)?$' || true

      - name: 스택 정리
        if: always()
        working-directory: docker-compose
        run: docker compose down -v

  # 모든 잡 결과 모음(머지 필수 검사, 바뀐 것이 없어 건너뛴 잡은 통과)
  ci-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build-bom
      - build-messaging
      - build-services
      - build-frontend
      - test-chat
      - scan-images
      - scan-manifests
      - tools
      - node-scripts
      - terraform
    if: always()
    steps:
      - name: 실패하거나 취소된 잡이 있으면 실패
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          exit 1

  # master push 의 검사 · E2E 가 둘 다 성공하면 릴리스(release.yml)
  release:
    needs: [ci-result, e2e]
    if: ${{ github.event_name == 'push' && needs.ci-result.result == 'success' && needs.e2e.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
