name: CI
on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  build-bom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 잡마다 받는 의존이 달라 키를 나눈다.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-bom-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-bom-
      - name: Build & Install ggeolmuse-bom
        run: |
          cd ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install -DskipTests

  build-messaging:
    runs-on: ubuntu-latest
    needs: build-bom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-messaging-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-messaging-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging
        run: |
          cd messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean install -DskipTests

  build-services:
    runs-on: ubuntu-latest
    needs: [build-bom, build-messaging]
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - gateway-server
          - user-service
          - trade-service
          - market-data-service
          - backtest-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-${{ matrix.service }}-
      - name: Build & Install ggeolmuse-bom (for dependencies)
        run: |
          cd ggeolmuse-bom
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Install messaging (for dependencies)
        run: |
          cd messaging
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml install -DskipTests
      - name: Build & Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          # Run unit tests only (*Test.java). Integration tests (*IT.java) are excluded by default
          mvn -s $GITHUB_WORKSPACE/.mvn/ci-settings.xml clean compile test
      - uses: docker/setup-buildx-action@v3

      # 러너는 매번 새 머신이라 레이어가 안 남는다. GitHub Actions 캐시에 얹어
      # 실행 사이에 재사용한다. Dockerfile 의 의존성 레이어와 짝이다.
      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.service }}:ci-${{ github.sha }}
          name: ${{ matrix.service }}

  # 프론트엔드는 BOM/messaging 과 무관하므로 Java 잡과 병렬로 돈다
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 2
      - name: Test
        # vitest run. 날짜 테스트가 TZ 에 의존해 vitest.config.ts 에서 Asia/Seoul 로 고정된다
        run: npm test
      - name: Build
        # tsc -b 를 포함하므로 타입 오류도 여기서 걸린다
        run: npm run build

      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Image for frontend-web
        uses: docker/build-push-action@v6
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          tags: frontend-web:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend-web
          cache-to: type=gha,mode=max,scope=frontend-web

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: frontend-web:ci-${{ github.sha }}
          name: frontend-web

  scan-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - chat-service
          - nginx-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Image for ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy 이미지 스캔
        uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.image }}:ci-${{ github.sha }}
          name: ${{ matrix.image }}

  # 렌더링한 매니페스트를 검사한다. 리소스 한도 누락이나 특권 컨테이너처럼
  # 이미지 스캔으로는 안 보이는 것들이 여기서 걸린다.
  scan-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: 실제 배포본을 뽑는다
        run: |
          helm template ggeolmuse helm/ggeolmuse \
            -f helm/ggeolmuse/values-prod.yaml > rendered.yaml

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: config
          scan-ref: rendered.yaml
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests
