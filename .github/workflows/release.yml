name: 릴리스

# master CI 가 초록이면 머지한 PR 의 빌드할 서비스 칸에서 체크한 서비스 가운데 운영 태그부터 바뀐 것만 빌드 · 푸시하고 운영 태그 커밋(ArgoCD 반영)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# 머지마다 따로 병렬 실행(서로의 대기 실행을 취소하지 않음), 같은 커밋의 실행은 하나
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

# 파이프 앞 명령이 실패해도 단계 실패(bash -eo pipefail)
defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.plan.outputs.services }}
      tags: ${{ steps.plan.outputs.tags }}
      sha: ${{ steps.plan.outputs.sha }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: false

      # 머지 커밋의 PR 본문(PR 없는 직접 커밋은 빈 본문이라 내는 것 없음, 본문은 파일로만 넘김)
      - name: PR 본문 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")][0].body // \"\"" \
            > "$RUNNER_TEMP/pr-body.md"

      - name: 낼 서비스 고르기
        id: plan
        working-directory: tools
        run: |
          go run ./cmd/release-plan -head "$SHA" -rev origin/master -body "$RUNNER_TEMP/pr-body.md" | tee "$RUNNER_TEMP/plan.txt"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"

      - name: 고른 결과
        env:
          SERVICES: ${{ steps.plan.outputs.services }}
          TAGS: ${{ steps.plan.outputs.tags }}
          HELD: ${{ steps.plan.outputs.held }}
          UNCHANGED: ${{ steps.plan.outputs.unchanged }}
        run: |
          {
            echo "### 릴리스 계획 ${SHA::7}"
            echo "- 낼 서비스: $SERVICES"
            echo "- 태그: $TAGS"
            echo "- 보류(바뀌었지만 체크 안 함): $HELD"
            echo "- 체크했지만 바뀐 것 없음: $UNCHANGED"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 서비스 · 태그 빌드는 하나씩(뒤 실행은 앞 실행이 올린 이미지의 레이블 대조로 실패)
    concurrency:
      group: build-${{ matrix.service }}-${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      TAG: ${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # 같은 태그가 Hub 에 있으면 이미지 레이블의 커밋을 대조(같으면 빌드 건너뜀, 다르거나 레이블이 없으면 실패)
      - name: Hub 태그 확인
        id: hub
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/muscathan/$SERVICE/tags/$TAG")
          case "$code" in
            200)
              built=$(docker buildx imagetools inspect "muscathan/$SERVICE:$TAG" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
              if [ "$built" != "$SHA" ]; then
                echo "muscathan/$SERVICE:$TAG 은 다른 커밋의 이미지(${built:-레이블 없음}), 다른 버전으로"
                exit 1
              fi
              echo "muscathan/$SERVICE:$TAG 이미 있음(같은 커밋), 빌드 건너뜀"
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "muscathan/$SERVICE:$TAG 확인 실패(응답 $code)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: steps.hub.outputs.skip != 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: 빌드 위치
        id: ctx
        if: steps.hub.outputs.skip != 'true'
        run: |
          case "$SERVICE" in
            chat-service) printf 'context=backend/chat-service\nfile=backend/chat-service/Dockerfile\n' ;;
            frontend-web) printf 'context=frontend-web\nfile=frontend-web/Dockerfile\n' ;;
            *) printf 'context=.\nfile=backend/%s/Dockerfile\n' "$SERVICE" ;;
          esac >> "$GITHUB_OUTPUT"

      # 쓰기 토큰(CI 토큰은 읽기 전용)
      - uses: docker/login-action@v4
        if: steps.hub.outputs.skip != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.hub.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.hub.outputs.skip != 'true'
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: muscathan/${{ matrix.service }}:${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
          labels: org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      TAGS: ${{ needs.plan.outputs.tags }}
      SERVICES: ${{ needs.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: azure/setup-helm@v5

      # 최신 master 에서 다시 고르고 바꿈(같이 돈 다른 릴리스가 먼저 올렸으면 그 위에서 다시, 더 새 커밋이 나간 서비스는 뺌,
      # 그사이 올라간 운영 버전 이하면 실패), 커밋 직전 Hub 이미지 레이블이 이 커밋인지 대조
      # GITHUB_TOKEN 커밋이라 CI · 릴리스가 다시 안 돎
      - name: 운영 태그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            still=$(cd tools && go run ./cmd/release-plan -head "$SHA" -rev HEAD -only "$SERVICES" -tags "$TAGS" | sed -n 's/^services=//p')
            if [ "$still" = "[]" ]; then
              echo "### 릴리스 ${SHA::7} — 바꿀 서비스 없음(더 새 커밋이 나감)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            names=$(jq -r '.[]' <<<"$still")
            subject=$(cd tools && go run ./cmd/set-image-tag -tags "$TAGS" -built "$SHA" ../helm/ggeolmuse/values-prod.yaml $names | sed -n 's/^subject=//p')
            rendered=$(helm template ggeolmuse helm/ggeolmuse -f helm/ggeolmuse/values-prod.yaml)
            for s in $names; do
              tag=$(jq -r --arg s "$s" '.[$s]' <<<"$TAGS")
              grep -q "image: muscathan/$s:$tag" <<<"$rendered" || { echo "$s 렌더에 $tag 없음"; exit 1; }
              built=$(docker buildx imagetools inspect "muscathan/$s:$tag" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
              if [ "$built" != "$SHA" ]; then
                echo "muscathan/$s:$tag 은 다른 커밋의 이미지(${built:-레이블 없음})"
                exit 1
              fi
            done
            git commit -qam "$subject"
            if git push -q origin HEAD:master; then
              echo "### 릴리스 — $subject" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "master 가 앞서 있어 다시 고름($i)"
          done
          echo "master 에 못 올림"
          exit 1
