name: 릴리스

# master 커밋의 CI · E2E 가 둘 다 성공하면 머지한 PR 의 빌드할 서비스 칸에서 체크한 서비스(수동 실행은 입력한 서비스) 가운데 운영 배포 이후 바뀐 것만 빌드 · 푸시하고 운영 태그를 커밋(ArgoCD 반영), 끝에 롤아웃 · 스모크 요청 확인
# 둘 중 나중에 끝난 쪽의 실행이 릴리스, 먼저 끝난 쪽의 실행은 건너뜀
on:
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]
    branches: [master]
  # 수동 실행(master 에서만): CI · E2E 가 둘 다 성공한 가장 최근 master 커밋에서, 입력한 서비스 가운데 운영 배포 이후 바뀐 것만
  workflow_dispatch:
    inputs:
      picks:
        description: '빌드할 서비스와 버전을 쉼표로 구분(예: backtest-service 1.8.0, frontend-web), 버전을 비우면 커밋 SHA 7자리'
        required: true
        type: string

# 머지마다 따로 병렬 실행(서로의 대기 실행을 취소하지 않음), 같은 커밋의 실행은 하나씩 차례로(CI · E2E 가 함께 끝나 둘 다 돌면 뒤 실행은 바뀐 서비스 없음), 수동 실행은 실행마다 따로
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

# 파이프 앞 명령이 실패해도 단계 실패(bash -eo pipefail)
defaults:
  run:
    shell: bash

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # CI · E2E 가운데 하나가 아직이면 빌드할 서비스 없음
    outputs:
      services: ${{ steps.plan.outputs.services || '[]' }}
      tags: ${{ steps.plan.outputs.tags || '{}' }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: false

      # 머지는 실행을 부른 머지 커밋, 수동 실행은 CI · E2E 가 둘 다 성공한 가장 최근 master 커밋
      - name: 릴리스할 커밋
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 인자로 받은 워크플로가 성공한 master push 커밋(최근 것부터)
          passed() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?branch=master&event=push&status=success&per_page=50" \
              --jq '.workflow_runs[].head_sha'
          }
          sha=$RUN_SHA
          if [ -z "$sha" ]; then
            e2e=$(passed e2e.yml)
            sha=$(passed ci.yml | grep -Fx -m 1 -f <(printf '%s\n' "$e2e") || true)
          fi
          if [ -z "$sha" ]; then echo "CI · E2E 가 둘 다 성공한 master 커밋 없음"; exit 1; fi
          echo "SHA=$sha" >> "$GITHUB_ENV"

      # 머지는 머지 커밋의 CI · E2E 가 둘 다 성공했을 때만(먼저 끝난 쪽 실행은 여기서 멈추고 나중 쪽 실행이 릴리스)
      - name: CI · E2E 확인
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$SHA&event=push&status=success&per_page=1" \
              --jq '.total_count'
          }
          ci=$(passed ci.yml)
          e2e=$(passed e2e.yml)
          if [ "$ci" -gt 0 ] && [ "$e2e" -gt 0 ]; then
            echo "wait=false" >> "$GITHUB_OUTPUT"
          else
            echo "wait=true" >> "$GITHUB_OUTPUT"
            echo "### 릴리스 ${SHA::7} — 성공한 실행 CI $ci · E2E $e2e, 나머지가 성공하면 그 실행이 릴리스" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 머지 커밋의 PR 본문(PR 없는 직접 커밋은 본문이 비어 빌드할 서비스 없음, 본문은 파일로만 넘김)
      - name: PR 본문 받기
        if: github.event_name == 'workflow_run' && steps.gate.outputs.wait == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")][0].body // \"\"" \
            > "$RUNNER_TEMP/pr-body.md"

      # 수동 실행은 입력한 목록을 PR 의 빌드할 서비스 칸과 같은 규칙으로 검사
      - name: 빌드할 서비스 고르기
        id: plan
        if: steps.gate.outputs.wait != 'true'
        working-directory: tools
        env:
          PICKS: ${{ inputs.picks }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            go run ./cmd/release-plan -head "$SHA" -rev origin/master -picks "$PICKS" | tee "$RUNNER_TEMP/plan.txt"
          else
            go run ./cmd/release-plan -head "$SHA" -rev origin/master -body "$RUNNER_TEMP/pr-body.md" | tee "$RUNNER_TEMP/plan.txt"
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"

      # 보류는 바뀌었지만 체크하지 않은 서비스, 건너뜀은 체크했지만 운영 배포 이후 바뀐 것이 없는 서비스
      - name: 릴리스 계획 요약
        if: steps.gate.outputs.wait != 'true'
        env:
          SERVICES: ${{ steps.plan.outputs.services }}
          TAGS: ${{ steps.plan.outputs.tags }}
          HELD: ${{ steps.plan.outputs.held }}
          UNCHANGED: ${{ steps.plan.outputs.unchanged }}
        run: |
          # JSON 목록 · 객체를 쉼표 목록으로(비면 없음)
          plain() { local v; v=$(printf '%s' "$1" | tr -d '[]{}"' | sed 's/:/ /g; s/,/, /g'); printf '%s' "${v:-없음}"; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then how=수동 실행; else how=머지; fi
          {
            echo "### 릴리스 계획 ${SHA::7} ($how)"
            echo "- 빌드할 서비스: $(plain "$SERVICES")"
            echo "- 버전(태그): $(plain "$TAGS")"
            echo "- 보류: $(plain "$HELD")"
            echo "- 건너뜀: $(plain "$UNCHANGED")"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 서비스 · 태그 빌드는 하나씩(뒤 실행은 이미지 레이블의 커밋이 같으면 건너뜀 · 다르면 실패)
    concurrency:
      group: build-${{ matrix.service }}-${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      TAG: ${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # 같은 태그가 Hub 에 있으면 이미지 레이블의 커밋을 대조(같으면 빌드 건너뜀, 다르거나 레이블이 없으면 실패)
      - name: Hub 태그 확인
        id: hub
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/muscathan/$SERVICE/tags/$TAG")
          case "$code" in
            200)
              built=$(docker buildx imagetools inspect "muscathan/$SERVICE:$TAG" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
              if [ "$built" != "$SHA" ]; then
                echo "muscathan/$SERVICE:$TAG 는 다른 커밋으로 만든 이미지(${built:-레이블 없음}), 다른 버전으로 다시 실행"
                exit 1
              fi
              echo "muscathan/$SERVICE:$TAG 이미 있음(같은 커밋), 빌드 건너뜀"
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "muscathan/$SERVICE:$TAG 확인 실패(응답 $code)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: steps.hub.outputs.skip != 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: 빌드 위치
        id: ctx
        if: steps.hub.outputs.skip != 'true'
        run: |
          case "$SERVICE" in
            chat-service) printf 'context=backend/chat-service\nfile=backend/chat-service/Dockerfile\n' ;;
            frontend-web) printf 'context=frontend-web\nfile=frontend-web/Dockerfile\n' ;;
            *) printf 'context=.\nfile=backend/%s/Dockerfile\n' "$SERVICE" ;;
          esac >> "$GITHUB_OUTPUT"

      # Docker Hub 쓰기 토큰
      - uses: docker/login-action@v4
        if: steps.hub.outputs.skip != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.hub.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.hub.outputs.skip != 'true'
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: true
          tags: muscathan/${{ matrix.service }}:${{ fromJSON(needs.plan.outputs.tags)[matrix.service] }}
          labels: org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 배포 키 시크릿이 있는 환경(배포 브랜치 master 만)
    environment: release
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      TAGS: ${{ needs.plan.outputs.tags }}
      SERVICES: ${{ needs.plan.outputs.services }}
    # 푸시한 태그 커밋과 태그를 바꾼 서비스(바꿀 서비스가 없으면 빈 값)
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      services: ${{ steps.tag.outputs.services }}
    steps:
      # 배포 키가 없으면 바로 실패(키 없는 checkout 은 읽기 토큰이라 푸시 불가)
      - name: 배포 키 확인
        env:
          KEY_SET: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "환경 release 에 RELEASE_DEPLOY_KEY 없음(docs/DEPLOY.md 의 릴리스 봇 준비)"
            exit 1
          fi

      # 쓰기 배포 키로 받기 · 푸시(master 규칙의 우회 대상)
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: azure/setup-helm@v5

      # 최신 master 에서 다시 고른 뒤 태그를 바꿈(동시에 돈 다른 릴리스가 먼저 커밋했으면 새 master 에서 다시, 더 새 커밋이 배포된 서비스는 뺌,
      # 그사이 올라간 운영 버전 이하면 실패), 커밋 직전에 Hub 이미지 레이블이 릴리스할 커밋인지 대조
      # 커밋 본문의 [skip ci] 로 CI · E2E · 릴리스가 다시 돌지 않음, 푸시가 앞선 커밋 말고 다른 이유로 막히면 바로 실패
      - name: 운영 태그 커밋
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            still=$(cd tools && go run ./cmd/release-plan -head "$SHA" -rev HEAD -only "$SERVICES" -tags "$TAGS" | sed -n 's/^services=//p')
            if [ "$still" = "[]" ]; then
              echo "### 릴리스 ${SHA::7} — 바꿀 서비스 없음(더 새 커밋이 이미 배포됨)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            names=$(jq -r '.[]' <<<"$still")
            subject=$(cd tools && go run ./cmd/set-image-tag -tags "$TAGS" -built "$SHA" ../helm/ggeolmuse/values-prod.yaml $names | sed -n 's/^subject=//p')
            rendered=$(helm template ggeolmuse helm/ggeolmuse -f helm/ggeolmuse/values-prod.yaml)
            for s in $names; do
              tag=$(jq -r --arg s "$s" '.[$s]' <<<"$TAGS")
              grep -q "image: muscathan/$s:$tag" <<<"$rendered" || { echo "$s 렌더 결과에 $tag 없음"; exit 1; }
              built=$(docker buildx imagetools inspect "muscathan/$s:$tag" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
              if [ "$built" != "$SHA" ]; then
                echo "muscathan/$s:$tag 는 다른 커밋으로 만든 이미지(${built:-레이블 없음})"
                exit 1
              fi
            done
            git commit -qam "$subject" -m "[skip ci]"
            if out=$(git push -q origin HEAD:master 2>&1); then
              echo "### 릴리스 — $subject" >> "$GITHUB_STEP_SUMMARY"
              printf 'commit=%s\nservices=%s\n' "$(git rev-parse HEAD)" "$still" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! grep -qE 'fetch first|non-fast-forward' <<<"$out"; then
              echo "$out"
              echo "master 에 푸시 실패(master 가 앞선 것이 아님)"
              exit 1
            fi
            echo "master 가 앞서 있어 다시 계산($i)"
          done
          echo "master 에 푸시 실패"
          exit 1

  # 태그 커밋의 ArgoCD 반영 · 상태와 공개 주소 스모크 요청 확인(운영 시간 밖이면 건너뜀)
  rollout:
    needs: deploy
    if: needs.deploy.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 읽기 전용 ArgoCD 토큰 시크릿이 있는 환경
    environment: release
    env:
      SERVICES: ${{ needs.deploy.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.commit }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: false

      # 토큰이 없으면 경고만(릴리스는 통과)
      - name: 롤아웃 · 스모크 확인
        working-directory: tools
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          # ArgoCD 앞 Cloudflare Access 서비스 토큰
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$ARGOCD_TOKEN" ]; then
            echo "::warning::환경 release 에 ARGOCD_TOKEN 없음, 롤아웃 · 스모크 확인 건너뜀"
            exit 0
          fi
          {
            echo "### 롤아웃 확인"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          go run ./cmd/rollout-check -values ../helm/ggeolmuse/values-prod.yaml -only "$(jq -r 'join(",")' <<<"$SERVICES")" \
            -argocd https://argocd.ggeolmuse.com -site https://ggeolmuse.com -wait 20m | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
