name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - develop

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: Validate PR Title & Description
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false

  code-quality:
    name: Code Quality & Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build & Install BOM
        run: |
          cd ggeolmuse-bom
          mvn clean install -DskipTests

      - name: Build & Install Messaging
        run: |
          cd messaging
          mvn clean install -DskipTests

      - name: Compile & Run Tests (with Coverage)
        run: |
          services="config-server gateway-server user-service trade-service market-data-service backtest-service"
          for service in $services; do
            echo "Building $service..."
            cd $service
            if [ "$service" = "market-data-service" ] || [ "$service" = "user-service" ]; then
              mvn clean verify -DskipTests
            else
              mvn clean verify
            fi
            cd ..
          done

  build-verification:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - gateway-server
          - user-service
          - trade-service
          - market-data-service
          - backtest-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Dependencies
        run: |
          cd ggeolmuse-bom && mvn install -DskipTests
          cd ../messaging && mvn install -DskipTests

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Verify Docker build
        run: |
          cd ${{ matrix.service }}
          docker build -t ${{ matrix.service }}:pr-check .

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Build generated uncommitted changes"
            git status
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Integration Tests
        run: |
          # Add integration test commands here
          echo "Integration tests would run here"
        env:
          REDIS_HOST: localhost
          POSTGRES_HOST: localhost

  pr-summary:
    name: PR Check Summary
    runs-on: ubuntu-latest
    needs: [validate-pr, code-quality, build-verification]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.validate-pr.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.build-verification.result }}" != "success" ]; then
            echo " One or more PR checks failed"
            exit 1
          else
            echo " All PR checks passed!"
          fi

      - name: Comment PR Status
        uses: actions/github-script@v6
        if: always()
        continue-on-error: true
        with:
          script: |
            const status = '${{ needs.validate-pr.result }}' === 'success' &&
                          '${{ needs.code-quality.result }}' === 'success' &&
                          '${{ needs.build-verification.result }}' === 'success' ? 'PASSED' : 'FAILED';

            const body = `## PR Quality Checks ${status}

            | Check | Status |
            |-------|--------|
            | PR Title Validation | ${{ needs.validate-pr.result }} |
            | Code Quality | ${{ needs.code-quality.result }} |
            | Build Verification | ${{ needs.build-verification.result }} |

            ${status === 'FAILED' ? 'Please fix the failing checks before merging.' : 'All checks passed! Ready for review.'}
            `;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Unable to post comment (insufficient permissions):', error.message);
            }
