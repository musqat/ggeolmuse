# 커밋 속 secret(gitleaks) · 코드 정적 분석(CodeQL) · 운영 이미지 주 1회 스캔
name: 보안 검사
on:
  pull_request:
  push:
    branches: [ master ]
  # 월요일 09시(KST), 새로 나온 취약점은 빌드가 없어도 운영 이미지에서 찾음
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 은 그 PR 의 커밋만, 그 밖에는 전체 이력(찾으면 실패, 값은 가림)
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE" ]; then range=(--log-opts="$BASE..$HEAD"); fi
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 "${range[@]}" .

  # 결과는 Security 탭(알림만, 실패로 막지 않음)
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: matrix.language == 'go'
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  # 운영 값 파일이 가리키는 앱 이미지 목록(주 1회 · 손으로 돌릴 때만)
  prod-images:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: 이미지 목록
        id: list
        run: |
          images=$(helm template ggeolmuse infra/k8s/charts/ggeolmuse -f infra/k8s/charts/ggeolmuse/values-prod.yaml \
            | grep -oE 'image: "?muscathan/[^" ]+' | sed -E 's/image: "?//' | sort -u | jq -R . | jq -sc .)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # 고친 버전이 나온 CRITICAL 이 생기면 실패(실패 메일 · Security 탭)
  prod-images-scan:
    needs: prod-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prod-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 태그 없이 서비스 이름만(버전이 바뀌어도 같은 Security 탭 범주)
      - name: 리포트 이름
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=prod-$(sed -E 's#^muscathan/##; s#[:@].*##' <<<"$IMAGE")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/trivy-image-scan
        with:
          image: ${{ matrix.image }}
          name: ${{ steps.name.outputs.name }}
          require-report: 'true'
