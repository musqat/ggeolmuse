name: E2E

# PR 과 master push 에서 돈다. Yahoo Finance에 의존하는 스위트라 필수 체크로는 두지 않는다
# 이미지는 머지 뒤 손으로 올리므로 8분 안에 끝나면 배포 전에 결과가 나온다
on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ master ]
  workflow_dispatch:

# 같은 PR 에 새 커밋이 오면 이전 실행을 멈춘다. master 는 머지마다 끝까지 돈다
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: 핵심 흐름 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # 시크릿 없이 .env.example 기본값으로 뜬다. Yahoo는 키가 없고 선택 키는 없으면 안 쓴다
      - name: compose 환경 변수 준비
        working-directory: docker-compose
        run: cp .env.example .env

      # 로그인 없이 받으면 Docker Hub 횟수 제한(429)에 걸린다. 읽기 전용 토큰으로 받는다
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # compose 는 일곱 개를 병렬로 만든다.
      - name: 스택 기동
        working-directory: docker-compose
        run: docker compose up -d --build

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Playwright 설치
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 게이트웨이가 뜰 때까지는 setup 프로젝트가 알아서 기다린다.
      - name: E2E 실행
        working-directory: tests/e2e
        run: npx playwright test

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: docker-compose
        run: |
          docker compose logs --tail 200
          # 기동 구간이 폴링 로그에 밀려 나가 앞쪽을 따로 남긴다
          docker compose logs market-data-service | head -400

      - name: 스택 정리
        if: always()
        working-directory: docker-compose
        run: docker compose down -v
