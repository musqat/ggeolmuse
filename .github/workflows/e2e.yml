name: E2E

# PR · master push 에서 실행(스택은 market-data 고정 시세, docker-compose.e2e.yml)
# 필수 체크(잡 이름 E2E)
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

# 같은 PR 에 새 커밋이 오면 이전 실행 취소(master 는 커밋마다 따로 끝까지, 릴리스가 커밋마다 결과를 봄)
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 문서만 바뀐 PR 은 E2E 건너뜀(조건으로 건너뛴 잡은 필수 체크에서 통과)
  changes:
    name: e2e-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '(\.md$|^docs/)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E
    needs: changes
    # 문서만 바뀐 PR 만 건너뜀(고르기가 실패해도 E2E 는 돎)
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # docker compose 명령마다 기본 파일 위에 E2E 덮어쓰기
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # 시크릿 없이 .env.example 기본값으로 기동(시세 · 환율은 고정 데이터, 선택 키는 없으면 안 씀)
      - name: compose 환경 변수 준비
        working-directory: docker-compose
        run: cp .env.example .env

      # 설정 리포 main 끝 커밋을 이 실행의 config-server 라벨로 고정하고 잡 요약에 남김(못 읽으면 main)
      - name: 설정 리포 커밋 고정
        run: |
          head=$(git ls-remote https://github.com/musqat/ggeolmuse-config.git refs/heads/main | cut -f1)
          if [ -n "$head" ]; then
            echo "CONFIG_GIT_LABEL=$head" >> "$GITHUB_ENV"
            echo "설정 리포 커밋 ${head:0:7}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=설정 리포::main 끝 커밋을 못 읽어 main 으로 띄움"
          fi

      # 익명 받기 횟수 제한(429) 회피용 읽기 전용 토큰
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # compose 가 일곱 개를 병렬 빌드, 일시 네트워크 오류면 30초 뒤 다시(최대 3번, 끝난 이미지는 캐시로)
      - name: 스택 빌드
        working-directory: docker-compose
        run: |
          for i in 1 2 3; do
            docker compose build && exit 0
            echo "빌드 실패 ${i}번째, 30초 뒤 다시"
            sleep 30
          done
          exit 1

      - name: 스택 기동
        working-directory: docker-compose
        run: docker compose up -d

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Playwright 설치
        working-directory: tests/e2e
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install chromium
          # 러너에 깔린 라이브러리로 브라우저가 뜨면 우분투 저장소를 부르지 않음
          if node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            exit 0
          fi
          echo "::warning::브라우저가 뜨지 않아 의존 패키지를 apt 로 받는다"
          # 우분투 저장소 주소가 안 풀려도 오래 걸리지 않게 apt 대기와 전체 시간을 짧게 제한
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-e2e-timeouts > /dev/null
          timeout 240 npx playwright install-deps chromium

      - name: E2E 실행
        working-directory: tests/e2e
        run: npx playwright test

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: docker-compose
        run: |
          docker compose logs --tail 200
          # 앞쪽 기동 구간 따로 출력(폴링 로그에 밀려 나감)
          docker compose logs market-data-service | head -400
          # 게이트웨이 경로별 서킷 상태 · 성공 · 실패 · 거절 수(관리 포트는 컨테이너 안에서만 열림)
          docker compose exec -T gateway-server wget -qO- http://localhost:9090/actuator/prometheus \
            | grep -E '^resilience4j_circuitbreaker_(state|calls_seconds_count|not_permitted_calls_total)' \
            | grep -vE ' 0(\.0)?$' || true

      - name: 스택 정리
        if: always()
        working-directory: docker-compose
        run: docker compose down -v
