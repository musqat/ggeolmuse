name: E2E

# PR · master push 에서 실행(Yahoo Finance 에 기대는 스위트라 필수 체크 아님)
# 8분 안에 끝나 머지 뒤 이미지를 손으로 올리기 전에 결과 확인
on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ master ]
  workflow_dispatch:

# 같은 PR 에 새 커밋이 오면 이전 실행 취소(master 는 머지마다 끝까지)
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: 핵심 흐름 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # 시크릿 없이 .env.example 기본값으로 기동(Yahoo 는 키 없음, 선택 키는 없으면 안 씀)
      - name: compose 환경 변수 준비
        working-directory: docker-compose
        run: cp .env.example .env

      # Docker Hub 로그인(익명 받기의 횟수 제한 429 회피, 읽기 전용 토큰)
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # compose 가 일곱 개를 병렬 빌드, 일시 네트워크 오류면 30초 뒤 다시(최대 3번, 끝난 이미지는 캐시로)
      - name: 스택 빌드
        working-directory: docker-compose
        run: |
          for i in 1 2 3; do
            docker compose build && exit 0
            echo "빌드 실패 ${i}번째, 30초 뒤 다시"
            sleep 30
          done
          exit 1

      - name: 스택 기동
        working-directory: docker-compose
        run: docker compose up -d

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Playwright 설치
        working-directory: tests/e2e
        run: |
          npm ci
          # apt 미러가 잠깐 실패할 때가 있어 한 번 더
          npx playwright install --with-deps chromium || { sleep 20; npx playwright install --with-deps chromium; }

      # 게이트웨이 대기는 setup 프로젝트 몫
      - name: E2E 실행
        working-directory: tests/e2e
        run: npx playwright test

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: docker-compose
        run: |
          docker compose logs --tail 200
          # 앞쪽 기동 구간 따로 저장(폴링 로그에 밀려 나감)
          docker compose logs market-data-service | head -400
          # 게이트웨이 경로별 서킷 상태 · 성공 · 실패 · 거절 수(관리 포트는 컨테이너 안에서만 열림)
          docker compose exec -T gateway-server wget -qO- http://localhost:9090/actuator/prometheus \
            | grep -E '^resilience4j_circuitbreaker_(state|calls_seconds_count|not_permitted_calls_total)' \
            | grep -vE ' 0(\.0)?$' || true

      - name: 스택 정리
        if: always()
        working-directory: docker-compose
        run: docker compose down -v
