ingest:
  rpm: 10
  retry:
    max: 5
    backoffMs: 800

alpha-vantage:
  apiKey: ${ALPHAVANTAGE_API_KEY}

marketdata:
  fx:
    ingest:
      backfill:
        enabled: false
      incremental:
        enabled: true
        defaultDays: 7
      scheduler:
        enabled: true
        cron: "0 10 11 * * MON-FRI"