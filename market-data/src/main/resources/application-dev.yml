# dev 환경 설정 (개발: 낮은 rpm과 API 키 설정)
ingest:
    rpm: 6
    retry:
        max: 5
        backoffMs: 1200

# FX 데이터 수집 설정
marketdata:
    fx:
        koreaexim:
            url: "https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON"
            authkey: ${KOREAEXIM_API_KEY:}
        ingest:
            backfill:
                enabled: true
                start: 2024-01-01
                end: null
            incremental:
                enabled: true
                defaultDays: 30
            scheduler:
                enabled: false             # 개발환경에서 스케줄러 비활성화

