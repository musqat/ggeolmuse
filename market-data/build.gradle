plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
}

dependencies {
    implementation(enforcedPlatform(project(':bom')))
    annotationProcessor(enforcedPlatform(project(':bom')))
    testAnnotationProcessor(enforcedPlatform(project(':bom')))
    
    implementation project(':common-lib')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
//    implementation 'org.springframework.boot:spring-boot-starter-security'
//    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson'

//    runtimeOnly 'org.postgresql:postgresql'
//    testImplementation 'org.testcontainers:postgresql'

    implementation 'com.h2database:h2'
//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'

    implementation 'org.jsoup:jsoup:1.21.1'

    // QueryDSL 의존성 (수동으로 Q클래스 생성하므로 annotationProcessor는 주석처리)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    // annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    // annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    // annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// QueryDSL Q클래스 생성 설정
def generated = 'build/generated/sources/annotationProcessor/java/main'
sourceSets {
    main.java.srcDirs += [generated]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(generated))
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

clean.doLast {
    file(generated).deleteDir()
}

tasks.register("prepareKotlinBuildScriptModel") {}
