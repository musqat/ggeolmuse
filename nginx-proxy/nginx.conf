events {
    worker_connections 2048;
}

http {
    # 로그 설정
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 업스트림 서비스 정의
    upstream gateway_backend {
        server gateway-server:8070 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream keycloak_backend {
        server keycloak:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream frontend_backend {
        server frontend-web:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;

    # 메인 서버 블록 (포트 80)
    server {
        listen 80;
        server_name _;

        # 최대 업로드 크기
        client_max_body_size 10M;

        # CORS 헤더 (OPTIONS 프리플라이트)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # OPTIONS 메서드 처리
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check 엔드포인트
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway 프록시 (우선순위 높음)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 지원
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 버퍼링
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Keycloak 인증 서버
        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://keycloak_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Frontend 애플리케이션 (기본 라우팅)
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # React Router 지원을 위한 에러 처리
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        # Frontend fallback (SPA 라우팅)
        location @frontend_fallback {
            proxy_pass http://frontend_backend;
        }
    }

    # HTTPS 서버 블록 (나중에 TLS 인증서 추가 시 활성화)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # SSL 설정
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # 나머지 설정은 위와 동일
    # }
}