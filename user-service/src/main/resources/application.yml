spring:
  application:
    name: user-service

  # Config Server 연결
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
      username: ${SPRING_CLOUD_CONFIG_USERNAME:config}
      password: ${SPRING_CLOUD_CONFIG_PASSWORD:config123}
      fail-fast: false
      retry:
        initial-interval: 3000
        max-attempts: 6
        max-interval: 4000
        multiplier: 1.1

  # Security OAuth2 설정
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}

  # Mail 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:testpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 8080

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:7001}
  realm: ${KEYCLOAK_REALM:muscathan}
  resource: ggeolmuse-client
  credentials:
    secret: ${KEYCLOAK_SECRET:dev-secret}
  admin:
    username: admin
    password: admin

app:
  exchange-rate:
    min-valid-rate: ${EXCHANGE_RATE_MIN:1000}
    max-valid-rate: ${EXCHANGE_RATE_MAX:1500}
    fallback-rate: ${EXCHANGE_RATE_FALLBACK:1300}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8070/oauth/callback}
  mail:
    from: ${MAIL_FROM:noreply@example.com}
    verification:
      base-url: ${APP_BASE_URL:http://localhost:8090}
      expiry-hours: ${EMAIL_EXPIRY_HOURS:24}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  account:
    initial-krw-amount: 1000000

# swagger 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false