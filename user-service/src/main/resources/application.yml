spring:
  application:
    name: user-service
  config:
    import:
      - "optional:aws-secretsmanager:ggeolmuse/production"
      - "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:config123}

server:
  port: 8080
