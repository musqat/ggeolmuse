# 모든 응답에 붙이는 보안 헤더 (nginx.conf 에서 include).
# add_header 가 있는 location 은 server 블록의 add_header 를 물려받지 않아 그 location 에서도 include 한다
add_header X-Content-Type-Options "nosniff" always;
# 같은 출처만 프레임에 넣을 수 있다
add_header X-Frame-Options "SAMEORIGIN" always;
# 스크립트 · 스타일은 같은 출처 파일만 쓴다. XSS 로 넣은 코드가 돌지 않는다. React 의 style 속성은 CSSOM 으로 들어가 막히지 않는다
# 이미지 https: 는 종목 로고(구글 favicon · 회사 도메인)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8070; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
